      let v = views.get(meta.id);
      if (!v) { v = new DocView(meta); views.set(meta.id, v); }
      view = v;
      v.attach(bodyEl);
    }
  }
  ST.renderTabs = renderTabs;

  function openMenu(anchor) {
    const box = h('div', { class: 'menu doc-menu' });
    const it = (icon, label, fn) => { const b = h('button', { onclick: () => { A.closePopovers(); fn(); } }); b.innerHTML = A.icon(icon); b.append(label); box.append(b); };
    it('pdf', 'Import PDF or photo…', async () => { const f = await ST.pickFile(); if (!f) return; const m = await ST.importFile(f); if (m) ST.openDoc(m.id); });
    const subj = D.doc.subject;
    const docs = ST.docs().slice().sort((a, b) => (b.subject === subj) - (a.subject === subj) || b.added - a.added);
    if (docs.length) box.append(h('hr'), h('div', { class: 'sub' }, 'Library'));
    docs.slice(0, 30).forEach((m) => {
      const b = h('button', { onclick: () => { A.closePopovers(); ST.openDoc(m.id); } });
      b.innerHTML = A.icon(m.type === 'pdf' ? 'pdf' : 'image');
      b.append(h('span', { class: 'grow' }, m.name), m.subject ? h('i', { class: 'dot', style: { background: A.SU.color(m.subject) } }) : '');
      box.append(b);
    });
    A.popover(box, anchor, { side: 'down' });
  }

  /* ---------- document viewer ---------- */
  class DocView {
    constructor(meta) {
      this.meta = meta;
      this.zoom = 1;
      this.page = meta.lastPage || 1;
      this.el = h('div', { class: 'docview' });
      this.bar = h('div', { class: 'dv-bar' });
      this.scroller = h('div', { class: 'dv-scroll' });
      this.inner = h('div', { class: 'dv-inner' });
      this.scroller.append(this.inner);
      this.el.append(this.bar, this.scroller);
      this.pages = [];
      this.ready = this.init();
    }
    attach(parent) {
      parent.append(this.el);
      this.ready.then(() => { this.layout(true); });
    }
    detach() { this.meta.lastPage = this.page; ST.updateDoc(this.meta.id, { lastPage: this.page }); }
    async init() {
      const m = this.meta;
      const pageLbl = h('input', { class: 'dv-page num', id: 'dv-page-' + m.id, value: String(this.page), inputmode: 'numeric', 'aria-label': 'Page' });
      this.pageLbl = pageLbl;
      this.countLbl = h('span', { class: 'muted small num' }, '');
      pageLbl.addEventListener('change', () => this.goto(parseInt(pageLbl.value, 10) || 1));
      const ib = (icon, title, fn) => { const b = h('button', { class: 'ibtn', title, 'aria-label': title, html: A.icon(icon) }); b.addEventListener('click', fn); return b; };
      this.bar.append(
        m.type === 'pdf' ? h('div', { class: 'row', style: { gap: '4px' } }, ib('chevup', 'Previous page', () => this.goto(this.page - 1)), pageLbl, this.countLbl, ib('chevdown', 'Next page', () => this.goto(this.page + 1))) : h('span', { class: 'muted small' }, 'Photo'),
        h('div', { class: 'grow' }),
        ib('minus', 'Zoom out', () => this.setZoom(this.zoom / 1.25)),
        ib('plus', 'Zoom in', () => this.setZoom(this.zoom * 1.25)),
        ib('spark', 'Ask the tutor about this page', () => this.askTutor()),
        ib('more', 'More', (e) => this.more(e.currentTarget)));
      if (m.type === 'image') {
        const blob = await A.store.loadFile('doc_' + m.id, m.mime || 'image/jpeg');
        this.imgUrl = blob ? URL.createObjectURL(blob) : '';
        const img = h('img', { src: this.imgUrl, class: 'dv-img', alt: m.name });
        this.inner.append(img);
        this.imgEl = img;
        return;
      }
      try {
        this.pdf = await ST.loadPdf(m);
      } catch (e) {
        this.inner.append(h('p', { class: 'muted', style: { padding: '20px' } }, 'This PDF could not be opened. ' + (navigator.onLine ? '' : 'You may need to be online the first time.')));
        return;
      }
      const n = this.pdf.numPages;
      this.countLbl.textContent = '/ ' + n;
      const p1 = await this.pdf.getPage(1);
      const vp = p1.getViewport({ scale: 1 });
      this.aspect = vp.height / vp.width;
      for (let i = 1; i <= n; i++) {
        const d = h('div', { class: 'dv-pg', dataset: { n: i } }, h('span', { class: 'dv-pgnum num' }, String(i)));
        this.inner.append(d);
        this.pages.push({ el: d, n: i, canvas: null, scale: 0, aspect: this.aspect });
      }
      this.io = new IntersectionObserver((ents) => ents.forEach((en) => { const p = this.pages[+en.target.dataset.n - 1]; p.visible = en.isIntersecting; if (en.isIntersecting) this.renderPage(p); }), { root: this.scroller, rootMargin: '800px 0px' });
      this.pages.forEach((p) => this.io.observe(p.el));
      this.scroller.addEventListener('scroll', () => this.onScroll(), { passive: true });
      this.bindPinch();
    }
    width() { return Math.max(200, (this.scroller.clientWidth || 400) - 24) * this.zoom; }
    layout(restore) {
      if (this.imgEl) { this.imgEl.style.width = this.width() + 'px'; return; }
      if (!this.pages.length) return;
      const w = this.width();
      this.inner.style.width = w + 'px';
      this.pages.forEach((p) => { p.el.style.width = w + 'px'; p.el.style.height = Math.round(w * p.aspect) + 'px'; if (p.canvas && Math.abs(p.scale - w) > 2) { p.canvas.remove(); p.canvas = null; if (p.visible) this.renderPage(p); } });
      if (restore) requestAnimationFrame(() => this.goto(this.page, true));
    }
    setZoom(z) {
      const frac = this.scroller.scrollTop / Math.max(1, this.scroller.scrollHeight);
      this.zoom = A.clamp(z, 0.5, 4);
      this.layout(false);
      this.scroller.scrollTop = frac * this.scroller.scrollHeight;
    }
    async renderPage(p) {
      if (!this.pdf || p.busy) return;
      const w = this.width();
      if (p.canvas && Math.abs(p.scale - w) < 2) return;
      p.busy = true;
      try {
        const page = await this.pdf.getPage(p.n);
        const vp1 = page.getViewport({ scale: 1 });
        p.aspect = vp1.height / vp1.width;
        p.el.style.height = Math.round(w * p.aspect) + 'px';
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const vp = page.getViewport({ scale: (w / vp1.width) * dpr });
        const c = h('canvas', { class: 'dv-canvas' });
        c.width = Math.round(vp.width); c.height = Math.round(vp.height);
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        await page.render({ canvasContext: ctx, viewport: vp }).promise;
        if (p.canvas) p.canvas.remove();
        p.canvas = c; p.scale = w;
        p.el.append(c);
        // free far-away pages
        const near = this.page;
        this.pages.forEach((q) => { if (q.canvas && Math.abs(q.n - near) > 6) { q.canvas.remove(); q.canvas = null; } });
      } catch (e) { /* page render failed; keep placeholder */ }
      p.busy = false;
    }
    onScroll() {
      const mid = this.scroller.scrollTop + this.scroller.clientHeight * 0.35;
      let n = 1;
      for (const p of this.pages) { if (p.el.offsetTop <= mid) n = p.n; else break; }
      if (n !== this.page) { this.page = n; this.pageLbl.value = String(n); clearTimeout(this._st); this._st = setTimeout(() => ST.updateDoc(this.meta.id, { lastPage: n }), 500); }
    }
    goto(n, instant) {
      if (!this.pages.length) return;
      n = A.clamp(n, 1, this.pages.length);
      this.page = n; this.pageLbl.value = String(n);
      this.scroller.scrollTo({ top: this.pages[n - 1].el.offsetTop - 8, behavior: instant ? 'auto' : 'smooth' });
    }
    bindPinch() {
      const pts = new Map(); let d0 = 0, z0 = 1;
      this.scroller.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'touch') return; pts.set(e.pointerId, [e.clientX, e.clientY]); if (pts.size === 2) { const [a, b] = [...pts.values()]; d0 = Math.hypot(a[0] - b[0], a[1] - b[1]); z0 = this.zoom; } });
      this.scroller.addEventListener('pointermove', (e) => {
        if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, [e.clientX, e.clientY]);
        if (pts.size === 2 && d0) { const [a, b] = [...pts.values()]; const k = Math.hypot(a[0] - b[0], a[1] - b[1]) / d0; this.inner.style.transformOrigin = 'top center'; this.inner.style.transform = `scale(${A.clamp(z0 * k, 0.5, 4) / this.zoom})`; this._pz = A.clamp(z0 * k, 0.5, 4); }
      });
      const end = (e) => { pts.delete(e.pointerId); if (pts.size < 2 && this._pz) { this.inner.style.transform = ''; this.setZoom(this._pz); this._pz = 0; d0 = 0; } };
      this.scroller.addEventListener('pointerup', end); this.scroller.addEventListener('pointercancel', end);
    }
    async pageImage(scale = 1.6) {
      if (this.meta.type === 'image') return blobToJpeg(await A.store.loadFile('doc_' + this.meta.id, this.meta.mime), 1600);
      const r = await ST.renderPage(this.meta, this.page, scale);
      return r.url;
    }
    async askTutor() {
      const url = await this.pageImage();
      A.AI.attach({ kind: 'image', label: this.meta.type === 'pdf' ? `${this.meta.name} · p. ${this.page}` : this.meta.name, url });
      ST.showTutor();
    }
    more(anchor) {
      const box = h('div', { class: 'menu' });
      const it = (icon, label, fn) => { const b = h('button', { onclick: () => { A.closePopovers(); fn(); } }); b.innerHTML = A.icon(icon); b.append(label); box.append(b); };
      it('image', 'Put this page on the canvas', async () => {
        if (this.meta.type === 'pdf') { const r = await ST.renderPage(this.meta, this.page, 2); A.UI.placeImage(r.url, r.canvas.width, r.canvas.height, { width: r.w1 * (96 / 72) }); }
        else { const url = await this.pageImage(); const im = new Image(); im.onload = () => A.UI.placeImage(url, im.naturalWidth, im.naturalHeight); im.src = url; }
        A.toast('Page placed on the canvas: write on it with the Pencil');
      });
      if (this.meta.type === 'pdf') it('layers', 'Import all pages to annotate', async () => {
        const blob = await A.store.loadFile('doc_' + this.meta.id, 'application/pdf');
        A.UI.importPdf(new File([blob], this.meta.name + '.pdf', { type: 'application/pdf' }));
      });
      if (this.meta.type === 'pdf') it('spark', 'Give the whole document to the tutor', async () => {
        if (this.meta.size > 30e6) return A.toast('This PDF is too large to send whole. Ask about single pages instead.');
        const blob = await A.store.loadFile('doc_' + this.meta.id, 'application/pdf');
        const b64 = await blobToB64(blob);
        A.AI.attach({ kind: 'pdf', label: this.meta.name + ' (whole PDF)', b64 });
        ST.showTutor();
      });
      it('moveto', 'Course: ' + (A.SU.name(this.meta.subject) || 'none'), () => A.SU.pickMenu(anchor, this.meta.subject, (sid) => { ST.updateDoc(this.meta.id, { subject: sid }); A.emit('documents'); }));
      it('rename', 'Rename', async () => { const n = await A.dialog({ title: 'Rename document', input: this.meta.name, okText: 'Rename' }); if (n) { ST.updateDoc(this.meta.id, { name: n.slice(0, 80) }); renderTabs(); } });
      A.popover(box, anchor, { side: 'down' });
    }
  }
  const blobToB64 = (blob) => new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.readAsDataURL(blob); });
  const blobToJpeg = (blob, max) => new Promise((res) => {
    const url = URL.createObjectURL(blob); const im = new Image();
    im.onload = () => { const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)); const c = h('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.86)); };
    im.onerror = () => res(null); im.src = url;
  });
  ST.blobToB64 = blobToB64;

  /* current page of the most recent document tab (for tutor context) */
  ST.currentPage = async () => {
    const m = ST.activeDoc();
    if (!m) return null;
    let v = views.get(m.id);
    if (!v) { v = new DocView(m); views.set(m.id, v); await v.ready; }
    const url = await v.pageImage();
    return url ? { kind: 'image', label: m.type === 'pdf' ? `${m.name} · p. ${v.page}` : m.name, url } : null;
  };

  ST.mount = (el) => {
    host = el;
    const grip = h('div', { class: 'sp-grip', title: 'Drag to resize' });
    bindResize(grip);
    tabsEl = h('div', { class: 'sp-tabs', role: 'tablist' });
    const close = h('button', { class: 'ibtn', title: 'Close panel', 'aria-label': 'Close study panel', html: A.icon('close'), onclick: () => ST.toggle(false) });
    bodyEl = h('div', { class: 'sp-body' });
    host.append(grip, h('div', { class: 'sp-head' }, tabsEl, close), bodyEl);
    addEventListener('resize', () => { if (ST.isOpen()) { applyWidth(); if (view) view.layout(false); } });
    A.on('doc:open', () => {
      views.clear();
      const open = !!(D.doc && D.doc.studyOpen);
      cv().classList.toggle('split', open);
      host.hidden = !open;
      const b = A.$('#btn-study'); if (b) b.classList.toggle('on', open);
      applyWidth();
      R.resize(); R.render(); // the stage width depends on the panel
      if (open) renderTabs();
      if (ST.pendingDoc && ST.doc(ST.pendingDoc)) { const id = ST.pendingDoc; ST.pendingDoc = null; setTimeout(() => ST.openDoc(id), 50); }
    });
    A.on('go:gallery', () => { if (view && view.detach) view.detach(); });
  };
})();

/* ---- ai.js ---- */
/* Axiom tutor: Claude beside your canvas or your book.
   A "context" supplies where conversations live, which attach buttons appear, hidden page text,
   and what happens when the tutor cites a line ([[p12:L3-L5]]). */
'use strict';
(() => {
  const D = A.D, R = A.R, h = A.h;
  const S = A.settings;
  const AI = (A.AI = {});
  const SDK_URL = 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.133.0/+esm';
  const KATEX = 'https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/';

  AI.models = [
    { id: 'claude-opus-5-5', name: 'Opus 5.5', note: 'Most capable' },
    { id: 'claude-sonnet-5-5', name: 'Sonnet 5.5', note: 'Faster, lower cost' },
    { id: 'claude-haiku-5-5', name: 'Haiku 5.5', note: 'Quick answers' },
  ];
  AI.modes = [
    { id: 'explain', name: 'Explain', effort: 'medium' },
    { id: 'hint', name: 'Hint', effort: 'low' },
    { id: 'check', name: 'Check my work', effort: 'high' },
    { id: 'quiz', name: 'Quiz me', effort: 'medium' },
  ];
  const MODE_TEXT = {
    explain: 'Mode: EXPLAIN. Explain clearly and rigorously. Give intuition, then the precise definitions and argument. End by checking understanding with one short question when it helps.',
    hint: 'Mode: HINT (guided learning). Do not give the full solution or the final answer. Give the smallest useful next hint or a guiding question, and let the student do the work. Reveal more only when the student asks for it.',
    check: 'Mode: CHECK MY WORK. Read the student\'s handwritten work in the attached images and check it step by step against the problem (and the official solution if one is attached). Say which steps are correct. For the first error, quote the line, explain exactly why it is wrong and how to fix it. Do not rewrite the whole solution unless asked.',
    quiz: 'Mode: QUIZ. Ask one question at a time about the current material, wait for the student\'s answer, then give precise feedback and the next question. Increase difficulty gradually.',
  };

  /* ---------- lazy libraries ---------- */
  let sdkP = null, katexP = null;
  const sdk = () => (sdkP = sdkP || import(SDK_URL).then((m) => m.default || m.Anthropic));
  const katex = () => {
    if (katexP) return katexP;
    katexP = new Promise((res) => {
      document.head.append(h('link', { rel: 'stylesheet', href: KATEX + 'katex.min.css' }));
      const s = h('script', { src: KATEX + 'katex.min.js' });
      s.onload = () => res(window.katex); s.onerror = () => res(null);
      document.head.append(s);
    });
    return katexP;
  };
  AI.katex = katex;

  /* ---------- markdown + math + citations ---------- */
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  AI.md = (src, kx) => {
    const math = [], code = [], cites = [];
    const keep = (tex, display) => { math.push({ tex, display }); return `\u0000${math.length - 1}\u0000`; };
    let s = String(src || '');
    s = s.replace(/```([\w-]*)\n?([\s\S]*?)(```|$)/g, (_, lang, body) => { code.push(body); return `\u0001${code.length - 1}\u0001`; });
    s = s.replace(/\[\[p(\d+):L(\d+)(?:\s*[-–]\s*L?(\d+))?\]\]/g, (_, p, a, b) => { cites.push([+p, +a, +(b || a)]); return `\u0002${cites.length - 1}\u0002`; });
    s = s.replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => keep(t, true))
      .replace(/\\\[([\s\S]+?)\\\]/g, (_, t) => keep(t, true))
      .replace(/\\\(([\s\S]+?)\\\)/g, (_, t) => keep(t, false))
      .replace(/(^|[^\\$])\$([^\s$](?:[^$\n]*?[^\s$])?)\$(?!\d)/g, (_, pre, t) => pre + keep(t, false));
    s = esc(s);
    const inline = (t) => t
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    const out = [];
    let list = null, para = [];
    const flushP = () => { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
    const flushL = () => { if (list) { out.push(`<${list.t}>` + list.items.map((i) => '<li>' + inline(i) + '</li>').join('') + `</${list.t}>`); list = null; } };
    for (const raw of s.split('\n')) {
      const line = raw.trimEnd();
      let m;
      if (!line.trim()) { flushP(); flushL(); continue; }
      if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { flushP(); flushL(); const n = Math.min(5, m[1].length + 2); out.push(`<h${n}>${inline(m[2])}</h${n}>`); continue; }
      if ((m = line.match(/^\s*[-*•]\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ul') { flushL(); list = { t: 'ul', items: [] }; } list.items.push(m[1]); continue; }
      if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ol') { flushL(); list = { t: 'ol', items: [] }; } list.items.push(m[1]); continue; }
      if ((m = line.match(/^&gt;\s?(.*)$/))) { flushP(); flushL(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>'); continue; }
      if (/^\s*---+\s*$/.test(line)) { flushP(); flushL(); out.push('<hr>'); continue; }
      if (list && /^\s{2,}\S/.test(raw)) { list.items[list.items.length - 1] += ' ' + line.trim(); continue; }
      flushL(); para.push(line);
    }
    flushP(); flushL();
    let html = out.join('');
    html = html.replace(/\u0001(\d+)\u0001/g, (_, i) => '<pre><code>' + esc(code[+i]) + '</code></pre>');
    html = html.replace(/\u0002(\d+)\u0002/g, (_, i) => { const [p, a, b] = cites[+i]; return `<button class="cite" data-p="${p}" data-a="${a}" data-b="${b}" title="Show in the book">p. ${p}${a ? ` · ${a === b ? 'line ' + a : 'lines ' + a + '–' + b}` : ''}</button>`; });
    html = html.replace(/\u0000(\d+)\u0000/g, (_, i) => {
      const { tex, display } = math[+i];
      if (kx) { try { return kx.renderToString(tex, { displayMode: display, throwOnError: false, strict: 'ignore' }); } catch (e) { /* fall through */ } }
      return display ? `<div class="mathraw">${esc(tex)}</div>` : `<code class="mathraw">${esc(tex)}</code>`;
    });
    return html;
  };

  /* ---------- canvas snapshots ---------- */
  const regionShot = (bb, onlyIds, maxPx = 1500) => {
    const w = bb[2] - bb[0], hh = bb[3] - bb[1];
    const scale = Math.min(3, maxPx / Math.max(w, hh));
    return R.renderRegion(D.doc, bb, scale, { bg: true, grid: false, onlyIds }).toDataURL('image/jpeg', 0.86);
  };
  AI.shotCanvas = () => ({ kind: 'image', label: 'Canvas view', url: regionShot(R.visibleBB(), null) });
  AI.shotSelection = () => {
    if (!R.sel.size || !A.SEL.box) return null;
    const p = 20 / D.doc.view.zoom, b = A.SEL.box;
    return { kind: 'image', label: `Selection (${R.sel.size})`, url: regionShot([b[0] - p, b[1] - p, b[2] + p, b[3] + p], new Set(R.sel)) };
  };
  const shrink = (url, max = 900) => new Promise((res) => {
    const im = new Image();
    im.onload = () => { const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)); const c = h('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.82)); };
    im.onerror = () => res(url); im.src = url;
  });
  AI.shrink = shrink;

  /* ---------- the canvas context (conversations saved with the drawing) ---------- */
  AI.canvasCtx = {
    kind: 'canvas',
    store: () => D.doc,
    chats: () => (D.doc.chats = D.doc.chats || []),
    save: () => D.changed('meta'),
    subject: () => D.doc.subject,
    emptyTitle: () => (A.SU.name(D.doc.subject) ? `Tutor for ${A.SU.name(D.doc.subject)}` : 'Your tutor'),
    emptyText: 'Ask about a concept, a page of your PDF, or your own handwritten solution. Add your canvas, a selection or the current page with the buttons below, so you never need screenshots.',
    attachButtons: () => {
      const b = [{ icon: 'image', label: 'Canvas', fn: () => AI.attach(AI.shotCanvas()) }];
      if (R.sel.size) b.push({ icon: 'selectall', label: 'Selection', fn: () => AI.attach(AI.shotSelection()) });
      if (A.ST.activeDoc()) b.push({ icon: 'pdf', label: 'Current page', fn: async () => AI.attach(await A.ST.currentPage()) });
      return b;
    },
    autoAttach: (mode, atts) => { if (mode === 'check' && !atts.some((a) => a.kind === 'image')) atts.unshift(AI.shotCanvas()); },
  };

  /* ---------- conversation state ---------- */

  /* ---------- overlays: highlights, focus box, citations ---------- */
  const box = (r, cls, extra = {}) => h('div', Object.assign({ class: cls, style: { left: r[0] * 100 + '%', top: r[1] * 100 + '%', width: (r[2] - r[0]) * 100 + '%', height: (r[3] - r[1]) * 100 + '%' } }, extra));

  /* ---------- selecting with the Pencil (box or lasso) ---------- */
  const pageAt = (x, y) => { for (const p of st.pages) { const r = p.el.getBoundingClientRect(); if (y >= r.top && y <= r.bottom && x >= r.left - 20 && x <= r.right + 20) return { p, r }; } return null; };

    let cur = null;

      const stylus = [...e.changedTouches].some((t) => t.touchType === 'stylus');

    const up = (e) => {

  /* ---------- side rail: pages, contents, highlights ---------- */

    if (m.thumb) thumb.append(h('img', { src: m.thumb, alt: '' }));
    const open = h('button', { class: 'card-open', style: { display: 'contents' }, onclick: () => A.emit('open', m.id), 'aria-label': 'Open ' + m.name }, thumb);
    const more = h('button', { class: 'ibtn', 'aria-label': 'More for ' + m.name, html: A.icon('more') });
    more.addEventListener('click', (e) => { e.stopPropagation(); cardMenu(m, more); });
    const subj = m.subject && A.SU.get(m.subject);
    const el = h('div', { class: 'card' }, open, h('div', { class: 'meta' }, h('div', { class: 't' }, h('div', { class: 'name' }, m.name),
      h('div', { class: 'date' }, subj ? h('i', { class: 'dot', style: { background: subj.color } }) : null, (subj ? subj.name + ' · ' : '') + A.fmtDate(m.updated))), more));
    let lp;
    thumb.addEventListener('pointerdown', () => { lp = setTimeout(() => { lp = 'fired'; cardMenu(m, thumb); }, 550); });
    thumb.addEventListener('pointerup', () => { if (lp !== 'fired') clearTimeout(lp); });
    thumb.addEventListener('pointerleave', () => { if (lp !== 'fired') clearTimeout(lp); });
    open.addEventListener('click', (e) => { if (lp === 'fired') { e.stopImmediatePropagation(); lp = null; } }, true);
    return el;
  }

  function cardMenu(m, anchor) {
    const box = h('div', { class: 'menu' });
    const it = (icon, label, fn, cls) => { const b = h('button', { class: cls || '', onclick: () => { A.closePopovers(); fn(); } }); b.innerHTML = A.icon(icon); b.append(label); box.append(b); };
    it('chev', 'Open', () => A.emit('open', m.id));
    it('folder', 'Course: ' + (A.SU.name(m.subject) || 'none'), () => A.SU.pickMenu(anchor, m.subject, async (sid) => {
      const doc = await A.store.loadDoc(m.id); if (!doc) return;
      doc.subject = sid; await A.store.saveDoc(doc, m.thumb); render();
    }));
    it('rename', 'Rename', async () => {
      const n = await A.dialog({ title: 'Rename drawing', input: m.name, okText: 'Rename' });
      if (!n || !n.trim()) return;
      const doc = await A.store.loadDoc(m.id);
      if (!doc) return;
      doc.name = n.trim().slice(0, 80);
      await A.store.saveDoc(doc, m.thumb);
      render();
    });
    it('duplicate', 'Duplicate', async () => {
      const doc = await A.store.loadDoc(m.id);
      if (!doc) return;
      doc.id = A.uid(); doc.name = m.name + ' copy'; doc.created = doc.updated = Date.now();
      await A.store.saveDoc(doc, m.thumb);
      render();
    });
    it('export', 'Export project file', async () => {
      const doc = await A.store.loadDoc(m.id);
      if (!doc) return;
      A.deliverFile(new Blob([JSON.stringify(Object.assign({ format: 'axiom', version: 1 }, doc))], { type: 'application/json' }), m.name.replace(/[\\/:*?"<>|]+/g, '-') + '.axiom');
    });
    box.append(h('hr'));
    it('trash', 'Delete', async () => {
      const ok = await A.dialog({ title: `Delete “${m.name}”?`, body: 'This drawing is removed from this device. This cannot be undone.', okText: 'Delete', danger: true });
      if (ok) { await A.store.deleteDoc(m.id); render(); }
    }, 'danger');
    A.popover(box, anchor, { side: 'down' });
  }

  /* ---------- library: covers, shelves ---------- */
  const fmtSize = (n) => (n > 1e6 ? (n / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1e3)) + ' KB');
  const progressOf = (d) => (d.pages > 1 ? Math.min(1, (d.lastPage || 1) / d.pages) : 0);
  function cover(d) {
    const subj = d.subject && A.SU.get(d.subject);
    const c = h('span', { class: 'cover' + (d.kind === 'sheet' ? ' sheet' : ''), style: { '--c': subj ? subj.color : '#5b6b86' } });
    if (d.cover) c.append(h('img', { src: d.cover, alt: '' }));
    else c.append(h('span', { class: 'cover-ph' }, h('span', { class: 'cover-ph-t' }, d.name)));
    return c;
  }
  function bookCard(d) {
    const subj = d.subject && A.SU.get(d.subject);
    const p = progressOf(d);
    const more = h('button', { class: 'ibtn', 'aria-label': 'More for ' + d.name, html: A.icon('more') });
    more.addEventListener('click', (e) => { e.stopPropagation(); docMenu(d, more); });
    const el = h('div', { class: 'book', dataset: { id: d.id } },
      h('button', { class: 'book-open', onclick: () => A.emit('read', d.id), 'aria-label': 'Read ' + d.name }, cover(d)),
      h('div', { class: 'book-meta' },
        h('div', { class: 'grow' }, h('div', { class: 'book-title' }, d.name),
          h('div', { class: 'book-sub' }, subj ? h('i', { class: 'dot', style: { background: subj.color } }) : null, d.pages ? (d.lastRead && (d.lastPage || 1) > 1 ? `Page ${d.lastPage} of ${d.pages}` : `${d.pages} page${d.pages === 1 ? '' : 's'}`) : fmtSize(d.size || 0))),
        more),
      p > 0 && d.lastRead ? h('div', { class: 'book-progress' }, h('span', { style: { width: Math.round(p * 100) + '%' } })) : null);
    return el;
  }
  const shelf = (list, wrap) => { const s = h('div', { class: 'shelf' + (wrap ? ' wrap' : '') }); list.forEach((d) => s.append(bookCard(d))); return s; };
  function continueBook(d) {
    const p = progressOf(d);
    return h('button', { class: 'cont-card cont-book', onclick: () => A.emit('read', d.id) }, cover(d),
      h('div', { class: 'cont-info' }, h('span', { class: 'cont-kicker' }, 'Reading'), h('span', { class: 'cont-title' }, d.name),
        h('span', { class: 'cont-sub num' }, d.pages ? `Page ${d.lastPage || 1} of ${d.pages} · ${Math.round(p * 100)}%` : ''),
        h('span', { class: 'book-progress wide' }, h('span', { style: { width: Math.round(p * 100) + '%' } })),
        h('span', { class: 'cont-cta' }, 'Continue reading', A.iconEl('chev'))));
  }
  function continueDrawing(m) {
    const thumb = h('span', { class: 'cont-thumb', style: { background: m.paper || '#fff' } });
    if (m.thumb) thumb.append(h('img', { src: m.thumb, alt: '' }));
    return h('button', { class: 'cont-card cont-draw', onclick: () => A.emit('open', m.id) }, thumb,
      h('div', { class: 'cont-info' }, h('span', { class: 'cont-kicker' }, 'Drawing'), h('span', { class: 'cont-title' }, m.name),
        h('span', { class: 'cont-sub' }, (A.SU.name(m.subject) ? A.SU.name(m.subject) + ' · ' : '') + 'edited ' + A.fmtDate(m.updated)),
        h('span', { class: 'cont-cta' }, 'Open', A.iconEl('chev'))));
  }
  function docMenu(d, anchor) {
    const box = h('div', { class: 'menu' });
    const it = (icon, label, fn, cls) => { const b = h('button', { class: cls || '', onclick: () => { A.closePopovers(); fn(); } }); b.innerHTML = A.icon(icon); b.append(label); box.append(b); };
    it('book', 'Read', () => A.emit('read', d.id));
    it('rename', 'Work on it beside a drawing', () => studyDoc(d));
    it('folder', 'Course: ' + (A.SU.name(d.subject) || 'none'), () => A.SU.pickMenu(anchor, d.subject, (sid) => { A.ST.updateDoc(d.id, { subject: sid }); render(); }));
    it('layers', d.kind === 'sheet' ? 'Show under Books' : 'Show under Problem sets', () => { A.ST.updateDoc(d.id, { kind: d.kind === 'sheet' ? 'book' : 'sheet' }); render(); });
    it('rename', 'Rename', async () => { const n = await A.dialog({ title: 'Rename', input: d.name, okText: 'Rename' }); if (n) { A.ST.updateDoc(d.id, { name: n.slice(0, 80) }); render(); } });
    box.append(h('hr'));
    it('trash', 'Delete', async () => { if (await A.dialog({ title: `Delete “${d.name}”?`, body: 'The file, its highlights and tutor conversations are removed from Axiom on this device.', okText: 'Delete', danger: true })) { await A.ST.deleteDoc(d.id); try { await A.store.deleteFile('ann_' + d.id); } catch (e) { /* none */ } render(); } }, 'danger');
    A.popover(box, anchor, { side: 'down' });
  }
  /* open the document next to the most recent drawing of its course (or a new one) */
  async function studyDoc(d) {
    if (!d) return;
    const metas = (await A.store.listMeta()).filter(Boolean);
    let target = d.subject ? metas.filter((m) => m.subject === d.subject).sort((a, b) => b.updated - a.updated)[0] : null;
    if (!target) {
      const r = await UI.newDrawingSheet({ name: 'Notes · ' + d.name.slice(0, 40), subject: d.subject });
      if (!r) { if (!A.D.doc && !A.RD.isOpen()) render(); return; }
      const doc = UI.createFromSheet(r);
      await A.store.saveDoc(doc, null);
      target = { id: doc.id };
    }
    A.ST.pendingDoc = d.id;
    A.emit('open', target.id);
  }
  UI.studyDoc = studyDoc;
  async function importDocs() {
    const f = await A.ST.pickFile();
    if (!f) return;
    const sid = A.SU.get(S.galleryFilter) ? S.galleryFilter : null;
    await A.ST.importFile(f, sid);
    render();
  }

  async function newDrawing() {
    const r = await UI.newDrawingSheet();
    if (!r) return;
    const doc = UI.createFromSheet(r);
    await A.store.saveDoc(doc, null);
    A.emit('open', doc.id);
  }
  async function importProject() {
    const inp = h('input', { type: 'file', accept: '.axiom,application/json,.json', style: { display: 'none' } });
    inp.addEventListener('change', async () => {
      const f = inp.files && inp.files[0];
      inp.remove();
      if (!f) return;
      try { await UI.importProjectText(await f.text()); } catch (e) { A.toast('That file is not an Axiom project'); }
    });
    document.body.append(inp);
    inp.click();
  }
  UI.importProjectText = async (txt) => {
    const data = JSON.parse(txt);
    if (!data || !Array.isArray(data.layers)) throw new Error('bad file');
    delete data.format; delete data.version;
    data.id = A.uid();
    data.updated = Date.now();
    data.created = data.created || Date.now();
    data.name = data.name || 'Imported drawing';
    const doc = D.normalize(data);
    await A.store.saveDoc(doc, R.thumbnail(doc).toDataURL('image/jpeg', 0.8));
    A.toast('Imported “' + doc.name + '”');
    render();
  };

  UI.mountGallery = (el) => {
    host = el;
    const rr = () => { if (!host.hidden && !D.doc) render(); };
    A.on('subjects', rr); A.on('documents', A.debounce(rr, 200));
    A.on('cover', (id) => { if (host.hidden) return; const d = A.ST.doc(id); host.querySelectorAll(`.book[data-id="${id}"] .cover, .cont-book .cover`).forEach((c) => { if (d && d.cover && !c.querySelector('img')) { c.innerHTML = ''; c.append(h('img', { src: d.cover, alt: '' })); } }); });
  };
  UI.renderGallery = render;
})();

/* ---- app.js ---- */
/* Axiom boot: views, autosave, sample drawing, file drops, service worker */
'use strict';
(() => {
  const D = A.D, R = A.R, B = A.B, G = A.G, UI = A.UI;
  const S = A.settings;

  /* ---------- autosave ---------- */
  let saving = Promise.resolve();
  const save = async () => {
    const doc = D.doc;
    if (!doc) return;
    let thumb = null;
    try { thumb = R.thumbnail(doc).toDataURL('image/jpeg', 0.78); } catch (e) { /* tainted or unavailable */ }
    saving = saving.then(() => A.store.saveDoc(doc, thumb)).catch((e) => { console.error(e); A.toast('Could not save: storage may be full'); });
    return saving;
  };
  const autosave = A.debounce(save, 1200);
  A.on('doc:changed', (k) => { if (k !== 'view') autosave(); });
  A.on('view', A.debounce(() => { if (D.doc) autosave(); }, 1500));
  document.addEventListener('visibilitychange', () => { if (document.hidden && D.doc) autosave.flush(); });
  addEventListener('pagehide', () => { if (D.doc) autosave.flush(); });

  /* ---------- views ---------- */
  const gallery = () => A.$('#gallery-view'), canvasView = () => A.$('#canvas-view');
  async function showGallery() {
    A.closePopovers();
    if (D.doc) { autosave.cancel(); await save(); }
    A.IN.cancelAll();
    D.doc = null;
    if (A.RD.isOpen()) A.RD.close();
    A.$('#reader-view').hidden = true;
    canvasView().hidden = true;
    gallery().hidden = false;
    updateChrome();
    await UI.renderGallery();
  }
  async function openDoc(id) {
    const raw = await A.store.loadDoc(id);
    if (!raw) { A.toast('That drawing could not be found'); return showGallery(); }
    if (A.RD.isOpen()) A.RD.close();
    A.$('#reader-view').hidden = true;
    const doc = D.normalize(raw);
    D.doc = doc;
    D.resetHistory();
    A.emit('selection:clear');
    gallery().hidden = true;
    canvasView().hidden = false;
    canvasView().classList.remove('ui-hidden');
    R.resize();
    const v = doc.view;
    if (!v.tx && !v.ty) {
      const bb = D.allBB();
      if (bb) R.fitBB(bb); else { v.tx = R.w / 2; v.ty = R.h / 2; }
    }
    A.emit('doc:open');
    A.emit('view');
    UI.renderTools();
    UI.renderLayers();
    R.renderNow(true);
  }
  A.on('go:gallery', showGallery);
  A.on('read', async (id) => {
    const meta = A.ST.doc(id);
    if (!meta) return A.toast('That document could not be found');
    A.closePopovers();
    if (D.doc) { autosave.cancel(); await save(); A.IN.cancelAll(); D.doc = null; }
    canvasView().hidden = true;
    gallery().hidden = true;
    updateChrome();
    A.RD.open(meta);
  });
  A.on('app:background', () => { if (D.doc) autosave.flush(); });
  A.on('open', openDoc);

  /* ---------- sample drawing (first launch) ---------- */
  function sampleDoc() {
    const doc = D.create({ name: 'Welcome · unit circle and sine', bg: D.papers.white, grid: 'graph' });
    doc.paper.grid.spacing = 40; doc.paper.grid.divisions = 5;
    const L = doc.layers[0]; L.name = 'Sketch';
    const ink = D.newLayer('Ink'); const hl = D.newLayer('Highlights');
    doc.layers = [hl, L, ink]; doc.activeLayerId = ink.id;
    let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647 - 0.5);
    const stroke = (b, color, size, op, fn, n, opts = {}) => {
      const pts = [];
      for (let i = 0; i <= n; i++) {
        const t = i / n; const [x, y] = fn(t);
        const p = opts.flat ? 1 : 0.55 + 0.45 * Math.sin(Math.PI * Math.min(1, t * 1.15));
        pts.push(x + rnd() * (opts.j ?? 0.6), y + rnd() * (opts.j ?? 0.6), B.widthMul(b, p, opts.tilt || 0, true));
      }
      return D.makeStroke(b, color, size, op, G.simplify(pts, 0.15, 0.03), opts.extra || {});
    };
    const U = 120; // one unit = 120 px
    // axes
    ink.items.push(stroke('fineliner', '#1a1e26', 1.8, 1, (t) => [-200 + t * 1180, 0], 60, { flat: true, j: 0.4 }));
    ink.items.push(stroke('fineliner', '#1a1e26', 1.8, 1, (t) => [0, 200 - t * 400], 30, { flat: true, j: 0.4 }));
    ink.items.push(stroke('fineliner', '#1a1e26', 1.8, 1, (t) => [968 + t * 12, -8 + t * 8], 4, { flat: true, j: 0 }));
    ink.items.push(stroke('fineliner', '#1a1e26', 1.8, 1, (t) => [968 + t * 12, 8 - t * 8], 4, { flat: true, j: 0 }));
    ink.items.push(stroke('fineliner', '#1a1e26', 1.8, 1, (t) => [-8 + t * 8, -188 - t * 12 + 0], 4, { flat: true, j: 0 }));
    ink.items.push(stroke('fineliner', '#1a1e26', 1.8, 1, (t) => [8 - t * 8, -188 - t * 12], 4, { flat: true, j: 0 }));
    // ticks at pi/2 multiples
    for (let k = 1; k <= 4; k++) { const x = (k * Math.PI / 2) * U; ink.items.push(stroke('fineliner', '#1a1e26', 1.5, 1, (t) => [x, -7 + t * 14], 3, { flat: true, j: 0 })); }
    // unit circle (pencil) centred on the origin
    L.items.push(stroke('pencil', '#4a5060', 2.4, 0.9, (t) => [Math.cos(t * Math.PI * 2) * U, Math.sin(t * Math.PI * 2) * U], 140, { j: 0.8 }));
    // radius at 60°
    const a = -Math.PI / 3;
    ink.items.push(stroke('pen', '#c0392b', 2.6, 1, (t) => [Math.cos(a) * U * t, Math.sin(a) * U * t], 30));
    ink.items.push(stroke('dotted', '#c0392b', 2.4, 1, (t) => [Math.cos(a) * U, Math.sin(a) * U * (1 - t)], 20, { flat: true, j: 0 }));
    ink.items.push(stroke('dotted', '#1f4fbf', 2.4, 1, (t) => [Math.cos(a) * U + t * ((Math.PI / 3) * U - Math.cos(a) * U), Math.sin(a) * U], 30, { flat: true, j: 0 }));
    // angle arc
    ink.items.push(stroke('pen', '#c0392b', 1.8, 1, (t) => [Math.cos(-t * Math.PI / 3) * 34, Math.sin(-t * Math.PI / 3) * 34], 20));
    // sine curve
    ink.items.push(stroke('pen', '#1f4fbf', 3, 1, (t) => [t * 2 * Math.PI * U, -Math.sin(t * 2 * Math.PI) * U], 220, { j: 0.5 }));
    // shaded area under the first hump (fill)
    const fillPts = [];
    for (let i = 0; i <= 60; i++) { const t = i / 60; fillPts.push(t * Math.PI * U, -Math.sin(t * Math.PI) * U, 1); }
    fillPts.push(Math.PI * U, 0, 1, 0, 0, 1);
    L.items.unshift(D.makeStroke('fill', '#9cc3f0', 1, 0.45, fillPts));
    // highlighter on the point (pi/3, sin)
    hl.items.push(stroke('highlighter', '#f2c94c', 22, 0.45, (t) => [(Math.PI / 3) * U - 30 + t * 60, Math.sin(a) * U], 10, { flat: true, j: 0.3 }));
    // brush-pen flourish under everything: "area = 2"
    ink.items.push(stroke('brushpen', '#1e8449', 6, 1, (t) => [200 + t * 150, 90 + Math.sin(t * Math.PI) * -8], 60));
    doc.view = { tx: 0, ty: 0, zoom: 1, rot: 0 };
    return doc;
  }

  /* ---------- status-bar color: blend the clock strip into the canvas / gallery ---------- */
  function updateChrome() {
    let m = document.querySelector('meta[name="theme-color"]');
    if (!m) { m = document.createElement('meta'); m.name = 'theme-color'; document.head.append(m); }
    const onCanvas = D.doc && !canvasView().hidden;
    const c = onCanvas ? R.displayBg() : (getComputedStyle(document.body).backgroundColor || '#eef0f3');
    m.setAttribute('content', c);
  }
  A.on('doc:open', () => setTimeout(updateChrome, 0));
  A.on('doc:changed', (k) => { if (k === 'paper' || k === 'all') updateChrome(); });
  A.on('theme', () => setTimeout(updateChrome, 0));

  /* ---------- boot ---------- */
  async function boot() {
    try { if (navigator.standalone || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches) document.documentElement.classList.add('standalone'); } catch (e) { /* ignore */ }
    UI.applyTheme();
    if (matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => UI.applyTheme());
    R.init(A.$('#main'), A.$('#overlay'));
    A.IN.init(A.$('#overlay'));
    UI.mountStatus(A.$('#statusbar'));
    UI.mountTools(A.$('#tools'));
    UI.mountLayers(A.$('#layers'));
    UI.mountPrecision(A.$('#precision'));
    UI.mountSelection(A.$('#selmenu'), A.$('#selpopup'));
    UI.mountGallery(A.$('#gallery-view'));
    A.ST.mount(A.$('#studypanel'));
    A.RD.mount(A.$('#reader-view'));
    if (!S.homeSeen) { S.homeSeen = true; S.galleryFilter = 'home'; A.saveSettings(); }
    A.$('#restore-ui').innerHTML = A.icon('eye');
    A.$('#restore-ui').addEventListener('click', () => A.emit('cmd', 'toggleUI'));
    A.on('selmenu:show', () => {});
    A.on('eyedrop:end', () => {});

    // paste images / strokes
    document.addEventListener('paste', (e) => {
      if (!D.doc || canvasView().hidden) return;
      const items = (e.clipboardData && e.clipboardData.items) || [];
      for (const it of items) if (it.type && it.type.startsWith('image/')) { const f = it.getAsFile(); if (f) { e.preventDefault(); UI.importImageFile(f); return; } }
      if (A.clip) { e.preventDefault(); A.emit('cmd', 'paste'); }
    });
    // drag & drop files
    addEventListener('dragover', (e) => e.preventDefault());
    addEventListener('drop', async (e) => {
      e.preventDefault();
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (!f) return;
      if (/\.axiom$|json/i.test(f.name + f.type)) { try { await UI.importProjectText(await f.text()); } catch (er) { A.toast('That file is not an Axiom project'); } return; }
      if (!D.doc) return A.toast('Open a drawing first, then drop the file');
      if (f.type === 'application/pdf') UI.importPdf(f); else if (f.type.startsWith('image/')) UI.importImageFile(f);
    });

    const metas = await A.store.listMeta();
    if (!metas.length && !S.seenWelcome) {
      const doc = sampleDoc();
      await A.store.saveDoc(doc, null);
      S.seenWelcome = true; A.saveSettings();
      await openDoc(doc.id);
      await save();
      setTimeout(() => A.toast('Welcome to Axiom. Draw with Apple Pencil, and pinch with two fingers to move around.', 4200), 600);
    } else {
      await showGallery();
    }

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && window.top === window && !window.AXIOM_NO_SW) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
