      }
      const np = G.count(pts);
      const avgm = () => { let s = 0; for (let i = 2; i < pts.length; i += 3) s += pts[i]; return s / Math.max(1, np); };
      const g = doc.paper.grid;
      if (!this.guide && np >= 2 && doc.precision.snap && doc.precision.grid && g.type !== 'none') {
        const m = avgm();
        let a = [pts[0], pts[1]], b = [pts[pts.length - 3], pts[pts.length - 2]];
        if (doc.precision.snapMode === 'grid') {
          const sp = g.type === 'graph' || g.type === 'eng' ? g.spacing / Math.max(1, g.divisions) * (this.zoom * g.spacing / Math.max(1, g.divisions) < 10 ? Math.max(1, g.divisions) : 1) : g.spacing;
          a = G.snapLattice(g.type, sp, a[0], a[1]); b = G.snapLattice(g.type, sp, b[0], b[1]);
        } else {
          const ang = G.alignDir(g.type, Math.atan2(b[1] - a[1], b[0] - a[0]));
          const L = (b[0] - a[0]) * Math.cos(ang) + (b[1] - a[1]) * Math.sin(ang);
          b = [a[0] + Math.cos(ang) * L, a[1] + Math.sin(ang) * L];
        }
        pts = [a[0], a[1], m, b[0], b[1], m];
        sharp = true;
      } else if (!this.guide && this.slot.smoothing >= 0.97 && np >= 2) {
        const m = avgm();
        pts = [pts[0], pts[1], m, pts[pts.length - 3], pts[pts.length - 2], m];
        sharp = true;
      } else if (!live && !this.guide && np > 2) {
        if (this.slot.smoothing > 0.12) pts = G.chaikin(pts, 1);
        pts = G.simplify(pts, 0.1 / this.zoom, 0.025);
      }
      // connect endpoints to nearby stroke ends
      if (!live && doc.precision.snap && doc.precision.connect && G.count(pts) >= 2) {
        const tol = 14 / this.zoom;
        const ends = [];
        for (const it of D.active().items) if (it.t === 's' && !B.catalog[it.b].mask && it.pts.length >= 6) {
          ends.push([it.pts[0], it.pts[1]], [it.pts[it.pts.length - 3], it.pts[it.pts.length - 2]]);
        }
        const fix = (i) => {
          let best = null, bd = tol;
          for (const e of ends) { const d = hyp(e[0] - pts[i], e[1] - pts[i + 1]); if (d < bd) { bd = d; best = e; } }
          if (best) { pts[i] = best[0]; pts[i + 1] = best[1]; }
        };
        fix(0); fix(pts.length - 3);
      }
      return { pts, sharp, closed };
    }
    liveItem() {
      const { pts, sharp, closed } = this.finalPts(true);
      const cat = this.cat;
      if (cat.mask) {
        return { t: 's', b: cat.soft ? 'airbrush' : 'pen', c: R.displayBg(), raw: true, w: this.slot.size, o: 0.92, pts, sharp, closed };
      }
      return { t: 's', b: this.slot.b, c: this.slot.color, w: this.slot.size, o: this.slot.opacity, pts, sharp, closed, live: true };
    }
    up(e, rect) {
      if (this.done) return;
      this.done = true;
      clearTimeout(this.holdTimer);
      IN.liveDraw = null;
      if (e && !this.shape) for (const s of samplesOf(e, rect)) this.add(s);
      const { pts, sharp, closed } = this.finalPts(false);
      const dur = (this.tLast - this.tFirst) / 1000;
      if (dur > 0.3 && this.rec.type === 'pen') IN.inputStats = { rate: Math.round(this.nSamples / dur), coalesced: this.coalesced };
      R.renderOverlay();
      if (this.cat.kind === 'fill' && G.count(pts) < 3) return;
      const layer = D.targetLayerFor(this.slot.b);
      if (layer.locked) { A.toast('This layer is locked'); return; }
      if (!layer.visible) { A.toast('This layer is hidden'); }
      const extra = {};
      if (sharp) extra.sharp = true;
      if (closed) extra.closed = true;
      const item = D.makeStroke(this.slot.b, this.slot.color, this.slot.size, this.slot.opacity, pts, extra);
      D.begin();
      D.addItems([item], layer);
      D.commit();
      R.appendItem(item, layer);
      if (D.doc.precision.measure && G.count(pts) >= 2 && !this.cat.mask) {
        IN.lastMeasure = { item, until: performance.now() + 2200 };
        setTimeout(() => R.renderOverlay(), 2300);
      }
      A.emit('layers:thumbs');
    }
    cancel() { this.done = true; clearTimeout(this.holdTimer); IN.liveDraw = null; R.renderOverlay(); }
  }

  /* ---- slice eraser / stroke eraser ---- */
  class EraseAction {
    constructor(rec, s, kind) {
      this.kind = kind; this.rec = rec;
      this.slot = B.slot();
      this.changed = false;
      D.begin();
      this.last = R.toWorld(s.x, s.y);
      IN.cursor = { x: s.x, y: s.y, r: this.radiusScreen() };
      this.apply(this.last, this.last);
    }
    radiusScreen() { return Math.max(this.kind === 'slice' ? 2 : 4, (this.slot.size / 2) * D.doc.view.zoom); }
    apply(a, b) {
      const zoom = D.doc.view.zoom;
      const r = Math.max(this.kind === 'slice' ? 1.2 / zoom : 3 / zoom, this.slot.size / 2);
      const seg = [Math.min(a[0], b[0]) - r, Math.min(a[1], b[1]) - r, Math.max(a[0], b[0]) + r, Math.max(a[1], b[1]) + r];
      const map = new Map();
      const remove = [];
      for (const l of targetLayers(false)) {
        for (const it of l.items) {
          if (it.t !== 's' || !G.bbHit(it.bb, seg)) continue;
          if (!G.strokeHitSeg(it, a[0], a[1], b[0], b[1], r)) continue;
          if (this.kind === 'eraser') { remove.push(it.id); continue; }
          // slice: cut along the segment
          const half = (it.w * (it.mm || 1)) / 2;
          const cutR = r + (B.catalog[it.b].kind === 'fill' ? 0 : half * 0.5);
          let pieces = [it.pts];
          const d = hyp(b[0] - a[0], b[1] - a[1]);
          const steps = Math.max(1, Math.ceil(d / Math.max(cutR * 0.5, 0.3)));
          for (let k = 0; k <= steps; k++) {
            const t = k / steps, cx = a[0] + (b[0] - a[0]) * t, cy = a[1] + (b[1] - a[1]) * t;
            const next = [];
            for (const p of pieces) {
              const res = G.slice(p, cx, cy, cutR, Math.max(cutR * 0.4, 0.25));
              if (res) next.push(...res); else next.push(p);
            }
            pieces = next;
          }
          map.set(it.id, pieces.filter((p) => p.length >= 6).map((p) => D.withPts(it, p)));
        }
      }
      if (remove.length) { D.removeIds(remove); this.changed = true; }
      if (map.size) { D.replace(map); this.changed = true; }
      if (remove.length || map.size) R.render();
    }
    move(e, rect) {
      for (const s of samplesOf(e, rect)) {
        const w = R.toWorld(s.x, s.y);
        this.apply(this.last, w);
        this.last = w;
        IN.cursor = { x: s.x, y: s.y, r: this.radiusScreen() };
      }
      R.renderOverlay();
    }
    up() {
      IN.cursor = null;
      if (this.changed) { D.commit(); A.emit('layers:thumbs'); }
      else D.history.pending = null;
      R.renderOverlay();
    }
    cancel() { this.up(); }
  }

  /* ---- nudge ---- */
  class NudgeAction {
    constructor(rec, s) {
      this.rec = rec;
      this.slot = B.slot();
      this.last = R.toWorld(s.x, s.y);
      this.done = new Set();
      this.changed = false;
      D.begin();
      IN.cursor = { x: s.x, y: s.y, r: this.slot.size, nudge: true };
    }
    move(e, rect) {
      const s = samplesOf(e, rect).pop();
      const w = R.toWorld(s.x, s.y);
      const dx = w[0] - this.last[0], dy = w[1] - this.last[1];
      const Rw = this.slot.size / D.doc.view.zoom;
      const l = D.active();
      if (l.locked) { A.toast('This layer is locked'); return; }
      const box = [this.last[0] - Rw, this.last[1] - Rw, this.last[0] + Rw, this.last[1] + Rw];
      const map = new Map();
      for (const it of l.items) {
        if (it.t !== 's' || !G.bbHit(it.bb, box)) continue;
        let pts = this.done.has(it.id) ? it.pts.slice() : G.resample(it.pts, Math.max(Rw / 10, 0.5));
        let moved = false;
        for (let i = 0; i < pts.length; i += 3) {
          const d = hyp(pts[i] - this.last[0], pts[i + 1] - this.last[1]);
          if (d < Rw) { const f = (1 - d / Rw) ** 2; pts[i] += dx * f; pts[i + 1] += dy * f; moved = true; }
        }
        if (moved) { const n = D.withPts(it, pts); this.done.add(n.id); map.set(it.id, [n]); }
      }
      if (map.size) { D.replace(map); this.changed = true; R.render(); }
      this.last = w;
      IN.cursor = { x: s.x, y: s.y, r: this.slot.size, nudge: true };
      R.renderOverlay();
    }
    up() { IN.cursor = null; if (this.changed) { D.commit(); A.emit('layers:thumbs'); } else D.history.pending = null; R.renderOverlay(); }
    cancel() { this.up(); }
  }

  /* ---- lasso / item picker ---- */
  class LassoAction {
    constructor(rec, s, opts = {}) {
      this.rec = rec; this.opts = opts;
      this.poly = [];
      this.start = { x: s.x, y: s.y };
      this.moved = 0;
      this.mode = opts.forceLasso ? 'lasso' : IN.selMode;
      if (this.mode === 'lasso') this.poly.push(...R.toWorld(s.x, s.y));
      IN.lasso = this;
      A.emit('selmenu:show');
    }
    move(e, rect) {
      for (const s of samplesOf(e, rect)) {
        this.moved = Math.max(this.moved, hyp(s.x - this.start.x, s.y - this.start.y));
        if (this.mode === 'lasso') this.poly.push(...R.toWorld(s.x, s.y));
        this.cur = { x: s.x, y: s.y };
      }
      R.renderOverlay();
    }
    up(e, rect) {
      IN.lasso = null;
      const zoom = D.doc.view.zoom;
      const end = this.cur || this.start;
      if (this.mode === 'picker' || this.moved < 8 || this.poly.length < 8) {
        const [wx, wy] = R.toWorld(end.x, end.y);
        const it = pickItem(wx, wy, 10 / zoom);
        if (it) {
          const ids = new Set(R.sel);
          if (ids.has(it.id)) ids.delete(it.id); else ids.add(it.id);
          SEL.set(ids);
        } else if (this.mode === 'lasso' || this.moved < 8) SEL.clear();
        R.renderOverlay();
        return;
      }
      const poly = [];
      for (let i = 0; i < this.poly.length; i += 2) poly.push(this.poly[i], this.poly[i + 1]);
      const xs = poly.filter((_, i) => i % 2 === 0), ys = poly.filter((_, i) => i % 2 === 1);
      const pbb = [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
      const found = [];
      for (const l of targetLayers(IN.selLayerOnly)) {
        for (const it of l.items) {
          if (!G.bbHit(it.bb, pbb)) continue;
          if (it.t === 'i') {
            const cs = B.imageCorners(it);
            const inside = cs.filter(([x, y]) => G.pointInPoly(x, y, poly)).length;
            if (IN.selPartial ? inside > 0 : inside === 4) found.push(it.id);
            continue;
          }
          if (B.catalog[it.b].mask) continue;
          const p = it.pts, n = G.count(p), step = Math.max(1, Math.floor(n / 40));
          let ins = 0, tot = 0;
          for (let i = 0; i < n; i += step) { tot++; if (G.pointInPoly(p[i * 3], p[i * 3 + 1], poly)) ins++; }
          if (IN.selPartial ? ins > 0 : ins >= tot * 0.85) found.push(it.id);
        }
      }
      const ids = new Set(R.sel);
      if (found.length && found.every((id) => ids.has(id))) found.forEach((id) => ids.delete(id));
      else found.forEach((id) => ids.add(id));
      SEL.set(ids);
      R.renderOverlay();
    }
    cancel() { IN.lasso = null; R.renderOverlay(); }
  }

  /* ---- transforming the selection ---- */
  class SelTransformAction {
    constructor(rec, s, hit) {
      this.rec = rec; this.hit = hit;
      this.start = R.toWorld(s.x, s.y);
      this.T0 = R.selPreview || M.id();
      const bb = SEL.box;
      const c = [[bb[0], bb[1]], [bb[2], bb[1]], [bb[2], bb[3]], [bb[0], bb[3]]].map(([x, y]) => M.apply(this.T0, x, y));
      this.corners = c;
      this.center = [(c[0][0] + c[2][0]) / 2, (c[0][1] + c[2][1]) / 2];
      this.theta = Math.atan2(c[1][1] - c[0][1], c[1][0] - c[0][0]);
      A.emit('selpopup:hide');
    }
    move(e, rect) {
      const s = samplesOf(e, rect).pop();
      const [x, y] = R.toWorld(s.x, s.y);
      let T;
      if (this.hit.kind === 'move') T = M.mul(M.translate(x - this.start[0], y - this.start[1]), this.T0);
      else if (this.hit.kind === 'rotate') {
        let r = Math.atan2(y - this.center[1], x - this.center[0]) - Math.atan2(this.start[1] - this.center[1], this.start[0] - this.center[0]);
        const st = Math.PI / 12, k = Math.round(r / st) * st;
        if (Math.abs(r - k) < A.rad(2.5)) r = k;
        T = M.mul(M.about(M.rotate(r), this.center[0], this.center[1]), this.T0);
        this.angle = r;
      } else {
        if (IN.scaleMode === 'off') return;
        const i = this.hit.i, piv = this.corners[(i + 2) % 4], c0 = this.corners[i];
        if (IN.scaleMode === 'scale') {
          const d0 = hyp(c0[0] - piv[0], c0[1] - piv[1]) || 1;
          // project the pointer onto the diagonal for a stable uniform scale
          const ux = (c0[0] - piv[0]) / d0, uy = (c0[1] - piv[1]) / d0;
          const d1 = Math.max(0.02 * d0, (x - piv[0]) * ux + (y - piv[1]) * uy);
          T = M.mul(M.about(M.scale(d1 / d0), piv[0], piv[1]), this.T0);
        } else {
          const th = this.theta, rot = M.rotate(-th);
          const [l0x, l0y] = M.apply(rot, c0[0] - piv[0], c0[1] - piv[1]);
          const [l1x, l1y] = M.apply(rot, x - piv[0], y - piv[1]);
          const sx = Math.abs(l0x) > 1e-6 ? l1x / l0x : 1, sy = Math.abs(l0y) > 1e-6 ? l1y / l0y : 1;
          const S = M.mul(M.rotate(th), M.mul(M.scale(sx, sy), M.rotate(-th)));
          T = M.mul(M.about(S, piv[0], piv[1]), this.T0);
        }
      }
      R.selPreview = T;
      R.render();
      A.emit('selection:preview');
    }
    up() { IN.commitSelTransform(); }
    cancel() { this.up(); }
  }
  IN.commitSelTransform = () => {
    const T = R.selPreview;
    if (!T) return A.emit('selection');
    const isId = T.every((v, i) => Math.abs(v - M.id()[i]) < 1e-9);
    if (!isId) {
      D.begin();
      const map = new Map(), ids = [];
      for (const { it } of SEL.items()) {
        const n = D.transformItem(it, T, IN.scaleMode !== 'stretch');
        map.set(it.id, [n]); ids.push(n.id);
      }
      D.replace(map);
      R.selPreview = null;
      D.commit();
      SEL.set(ids);
      A.emit('layers:thumbs');
    } else { R.selPreview = null; R.render(); A.emit('selection'); }
  };

  /* ---- two-finger gesture (canvas or selection) ---- */
  class GestureAction {
    constructor(recs, selection = false) {
      this.ids = recs.map((r) => r.id);
      const [a, b] = recs;
      this.a0 = [a.x, a.y]; this.b0 = [b.x, b.y];
      this.d0 = hyp(b.x - a.x, b.y - a.y) || 1;
      this.ang0 = Math.atan2(b.y - a.y, b.x - a.x);
      this.mid0 = [(a.x + b.x) / 2, (a.y + b.y) / 2];
      this.v0 = Object.assign({}, D.doc.view);
      this.w0 = R.toWorld(this.mid0[0], this.mid0[1]);
      this.selection = selection;
      this.rotUnlocked = false;
      if (selection) { this.T0 = R.selPreview || M.id(); A.emit('selpopup:hide'); }
      else R.gesturing = true;
    }
    move() {
      const a = pointers.get(this.ids[0]), b = pointers.get(this.ids[1]);
      if (!a || !b) return;
      const d = hyp(b.x - a.x, b.y - a.y) || 1;
      const ang = Math.atan2(b.y - a.y, b.x - a.x);
      const mid = [(a.x + b.x) / 2, (a.y + b.y) / 2];
      let dr = ang - this.ang0;
      while (dr > Math.PI) dr -= 2 * Math.PI; while (dr < -Math.PI) dr += 2 * Math.PI;
      const sc = d / this.d0;
      if (this.selection) {
        const w0 = R.toWorld(this.mid0[0], this.mid0[1]), w1 = R.toWorld(mid[0], mid[1]);
        const s = IN.scaleMode === 'off' ? 1 : sc;
        const r = IN.allowSelRotate ? dr : 0;
        const T = M.mul(M.translate(w1[0] - w0[0], w1[1] - w0[1]), M.mul(M.about(M.mul(M.rotate(r), M.scale(s)), w0[0], w0[1]), this.T0));
        R.selPreview = T;
        R.render();
        return;
      }
      if (!this.rotUnlocked && Math.abs(dr) > 0.18 && A.settings.allowRotate) this.rotUnlocked = true;
      let rot = this.v0.rot + (this.rotUnlocked ? dr : 0);
      const near = Math.round(rot / (Math.PI / 2)) * (Math.PI / 2);
      if (this.rotUnlocked && Math.abs(rot - near) < A.rad(4)) rot = near;
      const zoom = A.clamp(this.v0.zoom * sc, R.ZMIN, R.ZMAX);
      const c = Math.cos(rot) * zoom, s = Math.sin(rot) * zoom;
      const [wx, wy] = this.w0;
      R.setView({ zoom, rot, tx: mid[0] - (c * wx - s * wy), ty: mid[1] - (s * wx + c * wy) });
      if (touchSession) touchSession.gestureMoved = true;
    }
    up() { this.end(); }
    end() {
      if (this.ended) return;
      this.ended = true;
      if (this.selection) IN.commitSelTransform();
      else { R.gesturing = false; R.render(); }
    }
    cancel() { this.end(); }
  }

  /* ---- one finger: drag pans; long-press then move = lasso; long-press and lift = context menu ---- */
  class FingerAction {
    constructor(rec, s) {
      this.rec = rec;
      this.start = { x: s.x, y: s.y };
      this.last = [s.x, s.y];
      this.moved = 0;
      this.v0 = { tx: D.doc.view.tx, ty: D.doc.view.ty };
      R.gesturing = true;
      this.timer = setTimeout(() => this.onHold(), A.settings.holdTime || 500);
    }
    onHold() {
      if (this.ended || this.moved > 10) return;
      R.setView({ tx: this.v0.tx, ty: this.v0.ty }); // undo tiny drift
      R.gesturing = false;
      this.held = true;
      this.holdPt = { x: this.rec.x, y: this.rec.y, t: performance.now(), type: 'touch' };
      this.lasso = new LassoAction(this.rec, this.holdPt, { forceLasso: true, temp: true });
      IN.holdRing = { x: this.holdPt.x, y: this.holdPt.y };
      R.renderOverlay();
    }
    move(e, rect) {
      const r = this.rec;
      this.moved = Math.max(this.moved, hyp(r.x - this.start.x, r.y - this.start.y));
      if (this.held) {
        if (hyp(r.x - this.holdPt.x, r.y - this.holdPt.y) > 6) IN.holdRing = null;
        this.lasso.move(e, rect);
        return;
      }
      if (this.moved > 10) clearTimeout(this.timer);
      const v = D.doc.view;
      R.setView({ tx: v.tx + r.x - this.last[0], ty: v.ty + r.y - this.last[1] });
      this.last = [r.x, r.y];
    }
    up(e, rect) {
      this.ended = true;
      clearTimeout(this.timer);
      IN.holdRing = null;
      if (!this.held) { R.gesturing = false; R.render(); return; }
      if (this.lasso.moved >= 8 && this.lasso.poly.length >= 8) { this.lasso.up(e, rect); return; }
      this.lasso.cancel();
      A.emit('canvas:menu', { x: this.holdPt.x, y: this.holdPt.y });
    }
    cancel() {
      this.ended = true; clearTimeout(this.timer); IN.holdRing = null;
      if (this.lasso) this.lasso.cancel();
      R.gesturing = false; R.render();
    }
  }

  class PanAction {
    constructor(rec) { this.rec = rec; this.last = [rec.x, rec.y]; R.gesturing = true; }
    move() {
      const r = this.rec;
      const v = D.doc.view;
      R.setView({ tx: v.tx + r.x - this.last[0], ty: v.ty + r.y - this.last[1] });
      this.last = [r.x, r.y];
    }
    up() { R.gesturing = false; R.render(); }
    cancel() { this.up(); }
  }

  class GuideAction {
    constructor(rec, s, g, h) {
      this.g = g; this.h = h; this.last = R.toWorld(s.x, s.y); this.moved = 0; this.start = [s.x, s.y];
    }
    move(e, rect) {
      const s = samplesOf(e, rect).pop();
      const w = R.toWorld(s.x, s.y);
      this.moved = Math.max(this.moved, hyp(s.x - this.start[0], s.y - this.start[1]));
      GU.drag(this.g, this.h, w[0], w[1], w[0] - this.last[0], w[1] - this.last[1]);
      this.last = w;
      R.renderOverlay();
    }
    up() {
      if (this.h.center && this.moved < 6) {
        const now = performance.now();
        if (now - lastCenterTap < 350) { GU.special(this.g); lastCenterTap = 0; } else lastCenterTap = now;
      }
      D.changed('guides');
      R.renderOverlay();
    }
    cancel() { this.up(); }
  }

  class EyedropAction {
    constructor(rec, s) { this.sample(s.x, s.y); }
    sample(x, y) {
      const [wx, wy] = R.toWorld(x, y);
      const hit = pickItem(wx, wy, 6 / D.doc.view.zoom);
      if (hit && hit.t === 's') { this.color = hit.c; IN.loupe = { x, y, color: B.col(hit.c) }; R.renderOverlay(); return; }
      try {

      const setRgb = (i, v) => { const c = rgb(); c[i] = v; [hh, ss, vv] = C.rgbToHsv(...c); };
      const gradRgb = (i) => () => { const a = rgb().map(Math.round), b = a.slice(); a[i] = 0; b[i] = 255; return `linear-gradient(90deg, rgb(${a}), rgb(${b}))`; };
      mk('R', 255, () => rgb()[0], (v) => setRgb(0, v), gradRgb(0));
      mk('G', 255, () => rgb()[1], (v) => setRgb(1, v), gradRgb(1));
      mk('B', 255, () => rgb()[2], (v) => setRgb(2, v), gradRgb(2));
      const hsl = () => C.rgbToHsl(...rgb());
      const setHsl = (i, v) => { const c = hsl(); c[i] = i === 0 ? v : v / 100; [hh, ss, vv] = C.rgbToHsv(...C.hslToRgb(...c)); if (i === 0) hh = v; };
      mk('H', 359, () => hh, (v) => setHsl(0, v), () => 'linear-gradient(90deg,' + [0, 60, 120, 180, 240, 300, 360].map((x) => `hsl(${x},90%,50%)`).join(',') + ')');
      mk('S', 100, () => hsl()[1] * 100, (v) => setHsl(1, v), () => { const [H, , L] = hsl(); return `linear-gradient(90deg,hsl(${H},0%,${L * 100}%),hsl(${H},100%,${L * 100}%))`; });
      mk('L', 100, () => hsl()[2] * 100, (v) => setHsl(2, v), () => { const [H, Sx] = hsl(); return `linear-gradient(90deg,#000,hsl(${H},${Sx * 100}%,50%),#fff)`; });
      rows.forEach((r) => r());
      onSync = () => rows.forEach((r) => r());
      return wrap;
    };

    /* ---- recents + palettes ---- */
    const renderExtra = () => {
      extra.innerHTML = '';
      const rec = S.recentColors || [];
      if (rec.length) {
        extra.append(h('h4', { style: { marginTop: '14px' } }, 'Recent'));
        const row = h('div', { class: 'color-row' });
        rec.forEach((c) => row.append(h('button', { class: 'c', style: { background: c }, 'aria-label': c, onclick: () => setHex(c) })));
        extra.append(row);
      }
      extra.append(h('h4', { style: { marginTop: '14px' } }, 'Palettes'));
      S.palettes.forEach((p, pi) => {
        const name = h('div', { class: 'pal-name' + (pi === S.activePalette ? ' on' : '') },
          h('button', { onclick: () => { S.activePalette = pi; A.saveSettings(); A.emit('palette'); renderExtra(); } }, p.name + (pi === S.activePalette ? ' · on toolbar' : '')),
          h('button', { class: 'ibtn', style: { width: '30px', height: '30px' }, 'aria-label': 'Delete palette', html: A.icon('close'), onclick: async () => {
            const ok = await A.dialog({ title: `Delete “${p.name}”?`, body: 'This removes the palette and its colors.', okText: 'Delete', danger: true });
            if (!ok) return;
            S.palettes.splice(pi, 1); S.activePalette = 0; A.saveSettings(); A.emit('palette'); renderExtra();
          } }));
        const row = h('div', { class: 'color-row' });
        p.colors.forEach((c, ci) => {
          const b = h('button', { class: 'c', style: { background: c }, 'aria-label': c, title: 'Tap to use · hold to remove' });
          let lp;
          b.addEventListener('pointerdown', () => { lp = setTimeout(() => { lp = null; p.colors.splice(ci, 1); A.saveSettings(); A.emit('palette'); renderExtra(); }, 550); });
          b.addEventListener('pointerup', () => { if (lp) { clearTimeout(lp); setHex(c); } });
          b.addEventListener('pointerleave', () => lp && clearTimeout(lp));
          row.append(b);
        });
        if (p.colors.length < 8) row.append(h('button', { class: 'add', title: 'Add current color', 'aria-label': 'Add current color', html: A.icon('plus'), onclick: () => { p.colors.push(current()); A.saveSettings(); A.emit('palette'); renderExtra(); } }));
        extra.append(name, row);
      });
      extra.append(h('button', { class: 'btn', style: { marginTop: '10px', width: '100%', justifyContent: 'center' }, onclick: async () => {
        const n = await A.dialog({ title: 'New palette', input: 'Palette ' + (S.palettes.length + 1), okText: 'Create' });
        if (!n) return;
        S.palettes.push({ name: n, colors: [current()] }); S.activePalette = S.palettes.length - 1; A.saveSettings(); A.emit('palette'); renderExtra();
      } }, 'New palette'));
    };

    const show = (keep) => {
      if (keep && lastTab === 'sliders' && onSync) { onSync(); return; }
      body.innerHTML = '';
      onSync = null;
      body.append(lastTab === 'swatches' ? renderSwatches() : lastTab === 'wheel' ? renderWheel() : renderSliders());
    };
    cmpNew.style.background = original;
    show();
    renderExtra();
    const pop = A.popover(box, anchor, { side: S.toolSide === 'right' ? 'left' : 'right', onClose: () => { clearTimeout(commitT); if (B.slot().color !== original) UI.pushRecent(B.slot().color); A.saveSettings(); A.emit('slot'); } });
    return pop;
  };
})();

/* ---- ui-layers.js ---- */
/* Axiom layers panel: thumbnails, visibility, lock, opacity, reorder, focus, auto/manual */
'use strict';
(() => {
  const D = A.D, R = A.R, G = A.G, h = A.h;
  const UI = (A.UI = A.UI || {});
  let host, list;

  const thumb = (layer, cv) => {
    const doc = D.doc;
    const W = 112, H = 84;
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const sc = document.createElement('canvas'); sc.width = W; sc.height = H;
    const bb = D.allBB(doc, false);
    let m;
    if (bb) {
      const bw = Math.max(bb[2] - bb[0], 40), bh = Math.max(bb[3] - bb[1], 30);
      const s = Math.min((W - 10) / bw, (H - 10) / bh, 2);
      m = [s, 0, 0, s, W / 2 - ((bb[0] + bb[2]) / 2) * s, H / 2 - ((bb[1] + bb[3]) / 2) * s];
    } else m = [1, 0, 0, 1, W / 2, H / 2];
    const fake = { paper: doc.paper, layers: [Object.assign({}, layer, { visible: true, opacity: 1 })], focusLayerId: null, precision: doc.precision };
    R.drawScene(ctx, { m, w: W, h: H, doc: fake, bg: doc.paper.bg, grid: false, scratch: sc, sctx: sc.getContext('2d'), dpr: 1 });
  };

  function render() {
    if (!host || host.hidden || !D.doc) return;
    const doc = D.doc;
    list.innerHTML = '';
    const L = doc.layers;
    for (let i = L.length - 1; i >= 0; i--) {
      const l = L[i];
      const cv = h('canvas');
      const row = h('div', {
        class: 'layer' + (l.id === doc.activeLayerId ? ' on' : '') + (!l.visible ? ' hidden-layer' : '') + (doc.focusLayerId === l.id ? ' focus' : ''),
        dataset: { id: l.id, index: i }, role: 'button', tabindex: 0,
      },
      cv,
      h('div', { class: 'grow' }, h('div', { class: 'lname' }, l.name), h('div', { class: 'lmeta' }, `${l.items.length} item${l.items.length === 1 ? '' : 's'}${l.opacity < 1 ? ' · ' + Math.round(l.opacity * 100) + '%' : ''}`)),
      l.locked ? h('button', { class: 'ibtn', title: 'Unlock', 'aria-label': 'Unlock layer', html: A.icon('lock'), onclick: (e) => { e.stopPropagation(); D.setLayer(l.id, { locked: false }, false); } }) : null,
      h('button', { class: 'ibtn', title: l.visible ? 'Hide' : 'Show', 'aria-label': l.visible ? 'Hide layer' : 'Show layer', html: A.icon(l.visible ? 'eye' : 'eyeoff'), onclick: (e) => { e.stopPropagation(); D.setLayer(l.id, { visible: !l.visible }, false); R.render(); } }));
      bindRow(row, l, i);
      list.append(row);
      thumb(l, cv);
    }
    if (doc.precision.grid && doc.paper.grid.type !== 'none') {
      const names = { dot: 'Dot grid', graph: 'Graph paper', lined: 'Lined paper', iso: 'Isometric grid', tri: 'Triangle grid', eng: 'Engineering grid' };
      list.append(h('div', { class: 'layer-grid' }, A.iconEl('gallery'), h('span', { class: 'grow' }, names[doc.paper.grid.type] || 'Grid'),
        h('button', { class: 'ibtn', 'aria-label': 'Hide grid', html: A.icon('eye'), onclick: () => { doc.precision.grid = false; D.changed('precision'); R.render(); render(); A.emit('precision'); } })));
    }
    const auto = A.$('#layers-auto');
    if (auto) auto.classList.toggle('on', doc.layerMode === 'auto');
  }

  function bindRow(row, l, index) {
    let lp = null, dragging = false, startY = 0, lastTap = 0, tapId = 0;
    row.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.ibtn')) return;
      startY = e.clientY;
      lp = setTimeout(() => {
        lp = null; dragging = true;
        row.classList.add('dragging');
        try { row.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      }, 380);
    });
    row.addEventListener('pointermove', (e) => {
      if (lp && Math.abs(e.clientY - startY) > 8) { clearTimeout(lp); lp = null; }
      if (!dragging) return;
      e.preventDefault();
      row.style.transform = `translateY(${e.clientY - startY}px)`;
    });
    const end = (e, cancelled) => {
      if (lp) { clearTimeout(lp); lp = null; if (!cancelled && Math.abs(e.clientY - startY) < 8) tap(); return; }
      if (!dragging) return;
      dragging = false;
      row.classList.remove('dragging');
      row.style.transform = '';
      const rows = [...list.querySelectorAll('.layer')];
      const rh = row.getBoundingClientRect().height + 4;
      const steps = Math.round((e.clientY - startY) / rh);
      const pos = rows.indexOf(row);
      const newPos = A.clamp(pos + steps, 0, rows.length - 1);
      const L = D.doc.layers.length;
      if (newPos !== pos) D.moveLayer(L - 1 - pos, L - 1 - newPos);
      else render();
    };
    const tap = () => {
      const now = performance.now();
      if (now - lastTap < 300) {
        D.doc.focusLayerId = D.doc.focusLayerId === l.id ? null : l.id;
        tapId++;
        D.changed('layers'); R.render(); render();
        lastTap = 0;
        return;
      }
      lastTap = now;
      if (D.doc.activeLayerId !== l.id) {
        D.doc.activeLayerId = l.id;
        D.doc.layerMode = 'manual';
        if (D.doc.focusLayerId) D.doc.focusLayerId = l.id;
        D.changed('layers'); R.render(); render();
      } else { const tok = ++tapId; setTimeout(() => { if (tok === tapId && row.isConnected) openOptions(row, l); }, 300); }
    };
    row.addEventListener('pointerup', (e) => end(e, false));
    row.addEventListener('pointercancel', (e) => end(e, true));
  }

  function openOptions(anchor, l) {
    const box = h('div', { class: 'menu' });
    const item = (icon, label, fn, cls) => {
      const b = h('button', { class: cls || '', onclick: () => { A.closePopovers(); fn(); } });
      b.innerHTML = A.icon(icon); b.append(label);
      box.append(b);
    };
    box.append(h('div', { class: 'sub' }, l.name));
    item('selectall', 'Select all on layer', () => { A.emit('tool:select'); A.SEL.set(l.items.map((it) => it.id)); });
    item('rename', 'Rename', async () => { const n = await A.dialog({ title: 'Rename layer', input: l.name, okText: 'Rename' }); if (n) D.setLayer(l.id, { name: n.slice(0, 60) }); });
    const op = h('input', { type: 'range', min: 0, max: 100, value: Math.round(l.opacity * 100), id: 'layer-opacity' });
    const opv = h('b', { class: 'num' }, Math.round(l.opacity * 100) + '%');
    let began = false;
    op.addEventListener('input', () => { if (!began) { D.begin(); began = true; } D.setLayer(l.id, { opacity: +op.value / 100 }, false); opv.textContent = op.value + '%'; R.render(); });
    op.addEventListener('change', () => { if (began) { D.commit('layers'); began = false; } });
    box.append(h('div', { style: { padding: '6px 10px' } }, h('div', { class: 'row between small muted' }, h('span', null, 'Opacity'), opv), op));
    item(l.locked ? 'unlock' : 'lock', l.locked ? 'Unlock' : 'Lock', () => D.setLayer(l.id, { locked: !l.locked }));
    item('focus', D.doc.focusLayerId === l.id ? 'Exit focus' : 'Focus (fade others)', () => { D.doc.focusLayerId = D.doc.focusLayerId === l.id ? null : l.id; D.changed('layers'); R.render(); render(); });
    item('duplicate', 'Duplicate', () => D.duplicateLayer(l.id));
    item('merge', 'Merge down', () => D.mergeDown(l.id));
    box.append(h('hr'));
    item('clear', 'Clear layer', async () => { if (await A.dialog({ title: 'Clear this layer?', body: 'All strokes on it are removed. You can undo this.', okText: 'Clear', danger: true })) D.clearLayer(l.id); }, 'danger');
    item('trash', 'Delete layer', async () => { if (await A.dialog({ title: `Delete “${l.name}”?`, body: 'You can undo this.', okText: 'Delete', danger: true })) D.deleteLayer(l.id); }, 'danger');
    A.popover(box, anchor, { side: 'left' });
  }

  const debounced = A.debounce(render, 450);
  UI.mountLayers = (el) => {
    host = el;
    const auto = h('button', { class: 'ibtn', id: 'layers-auto', title: 'Automatic layers: each tool draws on its own layer', 'aria-label': 'Automatic layers', html: A.icon('auto') });
    auto.addEventListener('click', () => {
      D.doc.layerMode = D.doc.layerMode === 'auto' ? 'manual' : 'auto';
      A.toast(D.doc.layerMode === 'auto' ? 'Automatic layers: each tool gets its own layer' : 'Manual layers: you draw on the active layer');
      D.changed('layers'); render();
    });
    host.append(h('div', { class: 'layers-head' }, h('h4', null, 'Layers'), auto,
      h('button', { class: 'ibtn', title: 'New layer', 'aria-label': 'New layer', html: A.icon('plus'), onclick: () => D.addLayer() })));
    list = h('div', { class: 'layer-list' });
    host.append(list);
    A.on('layers', render);
    A.on('layers:thumbs', debounced);
    A.on('doc:changed', (k) => { if (k === 'all' || k === 'layers') render(); else debounced(); });
  };
  UI.renderLayers = render;
})();

/* ---- ui-panels.js ---- */
/* Axiom panels: status bar, precision, selection menu/popup, import/export, settings, help */
'use strict';
(() => {
  const B = A.B, D = A.D, R = A.R, G = A.G, M = A.M, GU = A.GU, h = A.h;
  const UI = (A.UI = A.UI || {});
  const S = A.settings;

  /* ================= status bar ================= */
  UI.mountStatus = (el) => {
    const btn = (icon, title, fn, id) => {
      const b = h('button', { class: 'ibtn', title, 'aria-label': title, id, html: A.icon(icon) });
      b.addEventListener('click', fn);
      return b;
    };
    const name = h('button', { class: 'sb-name', id: 'doc-name', title: 'Rename drawing' });
    name.addEventListener('click', async () => {
      const n = await A.dialog({ title: 'Rename drawing', input: D.doc.name, okText: 'Rename' });
      if (n && n.trim()) { D.doc.name = n.trim().slice(0, 80); D.changed('meta'); syncName(); }
    });
    const precBtn = btn('precision', 'Precision (P)', () => togglePrecision(), 'btn-precision');
    const layBtn = btn('layers', 'Layers (L)', () => toggleLayers(), 'btn-layers');
    const left = h('div', { class: 'sb-group panel' },
      btn('gallery', 'Gallery', () => A.emit('go:gallery')), name, h('div', { class: 'sb-sep' }), precBtn, layBtn);
    const readout = h('button', { id: 'readout', class: 'panel', title: 'View options' });
    readout.addEventListener('click', () => viewMenu(readout));
    const right = h('div', { class: 'sb-group panel' },
      btn('import', 'Import', (e) => importMenu(e.currentTarget)),
      btn('export', 'Export', () => UI.openExport()),
      btn('hide', 'Hide interface (H)', () => A.emit('cmd', 'toggleUI')),
      btn('settings', 'Settings', () => UI.openSettings()),
      btn('help', 'Help and gestures', () => UI.openHelp()));
    el.append(left, readout, right);
    const syncName = () => { name.textContent = D.doc ? D.doc.name : ''; };
    UI.syncName = syncName;
    A.on('view', syncReadout);
    A.on('selection', syncReadout);
    A.on('selection:preview', syncReadout);
    A.on('doc:open', () => { syncName(); syncReadout(); });
  };
  function syncReadout() {
    const el = A.$('#readout');
    if (!el || !D.doc) return;
    const v = D.doc.view;
    let rot = ((A.deg(v.rot) % 360) + 360) % 360;
    if (rot > 180) rot -= 360;
    const parts = [`<b>${v.zoom >= 1 ? Math.round(v.zoom * 100) : (v.zoom * 100).toFixed(v.zoom < 0.1 ? 1 : 0)}%</b>`, `<span class="hide-sm">${rot.toFixed(0)}°</span>`];
    if (R.sel.size && A.SEL.box) {
      const bb = A.SEL.box, T = R.selPreview;
      let w = bb[2] - bb[0], hh = bb[3] - bb[1];
      if (T) { const k = Math.sqrt(Math.abs(M.det(T))); w *= k; hh *= k; }
      parts.push(`<span>${R.sel.size} sel · ${A.fmtLen(w)} × ${A.fmtLen(hh)}</span>`);
    }
    el.innerHTML = parts.join('<span class="dot"></span>');
  }
  function viewMenu(anchor) {
    const box = h('div', { class: 'menu' });
    const it = (label, fn) => box.append(h('button', { onclick: () => { A.closePopovers(); fn(); } }, label));
    it('Zoom to 100%', () => R.zoomAt(R.w / 2, R.h / 2, 1 / D.doc.view.zoom));
    it('Reset rotation', () => R.zoomAt(R.w / 2, R.h / 2, 1, -D.doc.view.rot));
    it('Fit drawing to screen', () => R.fitBB(D.allBB()));
    if (R.sel.size && A.SEL.box) it('Zoom to selection', () => R.fitBB(A.SEL.box, 100));
    it('Go to origin', () => R.setView({ tx: R.w / 2, ty: R.h / 2, zoom: 1, rot: 0 }));
    A.popover(box, anchor, { side: 'down' });
  }

  /* ================= precision ================= */
  let precHost;
  function togglePrecision(force) {
    const show = force != null ? force : precHost.hidden;
    precHost.hidden = !show;
    A.$('#btn-precision').classList.toggle('on', show);
    if (show) { renderPrecision(); const b = A.$('#btn-precision').getBoundingClientRect(); precHost.style.left = Math.max(10, b.left - 10) + 'px'; }
  }
  function toggleLayers(force) {
    const host = A.$('#layers');
    const show = force != null ? force : host.hidden;
    host.hidden = !show;
    A.$('#btn-layers').classList.toggle('on', show);
    if (show) UI.renderLayers();
  }
  UI.togglePrecision = togglePrecision;
  UI.toggleLayers = toggleLayers;

  const check = (label, checked, on, id) => {
    const inp = h('input', { type: 'checkbox', id });
    inp.checked = !!checked;
    inp.addEventListener('change', () => on(inp.checked));
    const l = h('label', { class: 'check', for: id }, inp, h('span', { class: 'box', html: A.icon('check') }), label);
    return l;
  };
  const segc = (opts, val, on) => {
    const s = h('div', { class: 'seg' });
    opts.forEach(([v, l]) => s.append(h('button', { class: v === val ? 'on' : '', onclick: () => on(v) }, l)));
    return s;
  };
  const toggleSw = (checked, on, id) => {
    const inp = h('input', { type: 'checkbox', id, role: 'switch' });
    inp.checked = !!checked;
    inp.addEventListener('change', () => on(inp.checked));
    return h('label', { class: 'toggle' }, inp, h('span'));
  };

  function renderPrecision() {
    if (!precHost || precHost.hidden) return;
    const doc = D.doc, P = doc.precision, g = doc.paper.grid;
    const changed = () => { D.changed('precision'); R.render(); renderPrecision(); A.emit('precision'); UI.renderLayers(); };
    precHost.innerHTML = '';
    // grid
    const gridRow = h('div', { class: 'prec-row' }, check('Grid', P.grid, (v) => { P.grid = v; if (v && g.type === 'none') g.type = 'dot'; changed(); }, 'p-grid'));
    if (P.grid) {
      const unitsLen = A.fmtLen(g.spacing);
      const sp = h('input', { type: 'range', min: 6, max: 120, step: 1, value: g.spacing, id: 'p-spacing' });
      const spv = h('b', null, unitsLen);
      sp.addEventListener('input', () => { g.spacing = +sp.value; spv.textContent = A.fmtLen(g.spacing); R.render(); });
      sp.addEventListener('change', () => changed());
      const op = h('input', { type: 'range', min: 10, max: 100, value: Math.round((g.opacity ?? 1) * 100), id: 'p-gop' });
      op.addEventListener('input', () => { g.opacity = +op.value / 100; R.render(); });
      op.addEventListener('change', () => D.changed('precision'));
      const opts = h('div', { class: 'opts' },
        segc([['dot', 'Dot'], ['graph', 'Graph'], ['lined', 'Lined'], ['iso', 'Iso'], ['tri', 'Triangle']], g.type, (v) => { g.type = v; changed(); }),
        h('div', { class: 'lab' }, 'Spacing', spv), sp);
      if (g.type === 'graph' || g.type === 'lined') {
        const dv = h('b', null, String(g.divisions));
        const dn = h('div', { class: 'row gap' },
          h('button', { class: 'ibtn', 'aria-label': 'Fewer divisions', html: A.icon('minus'), onclick: () => { g.divisions = Math.max(1, g.divisions - 1); changed(); } }),
          dv,
          h('button', { class: 'ibtn', 'aria-label': 'More divisions', html: A.icon('plus'), onclick: () => { g.divisions = Math.min(10, g.divisions + 1); changed(); } }));
        opts.append(h('div', { class: 'lab' }, 'Divisions', h('span')), dn);
      }
      opts.append(h('div', { class: 'lab' }, 'Opacity', h('span')), op);
      gridRow.append(opts);
    }
    // snap
    const snapRow = h('div', { class: 'prec-row' }, check('Snap', P.snap, (v) => { P.snap = v; if (v && !P.grid) { P.grid = true; A.toast('Grid turned on for snapping'); } changed(); }, 'p-snap'));
    if (P.snap) snapRow.append(h('div', { class: 'opts' },
      segc([['grid', 'Snap to grid'], ['align', 'Align to grid']], P.snapMode, (v) => { P.snapMode = v; changed(); }),
      h('div', { class: 'row between' }, h('span', { class: 'small muted' }, 'Connect to stroke ends'), toggleSw(P.connect, (v) => { P.connect = v; D.changed('precision'); }, 'p-connect')),
      h('p', { class: 'small muted', style: { margin: 0 } }, P.snapMode === 'grid' ? 'Strokes become straight segments between grid points.' : 'Strokes become straight lines along the grid directions.')));
    // measure
    const measRow = h('div', { class: 'prec-row' }, check('Measure', P.measure, (v) => { P.measure = v; changed(); }, 'p-measure'));
    if (P.measure) {
      const sc = h('input', { class: 'field', type: 'number', min: 0.0001, step: 'any', value: P.scale, id: 'p-scale', style: { margin: 0, width: '110px' } });
      sc.addEventListener('change', () => { const v = +sc.value; if (v > 0) { P.scale = v; changed(); } });
      measRow.append(h('div', { class: 'opts' },
        segc([['px', 'px'], ['pt', 'pt'], ['mm', 'mm'], ['cm', 'cm'], ['in', 'in']], P.units, (v) => { P.units = v; changed(); }),
        h('div', { class: 'row gap' }, h('span', { class: 'small muted' }, 'Drawing scale  1 :'), sc)));
    }

  const cmds = {
    selectAll() {

    copy() { if (!R.sel.size) return; writeClip(selItems()); A.toast(`Copied ${R.sel.size}`); },
    cut() { if (!R.sel.size) return; writeClip(selItems()); cmds.delete(); },
    paste(at) {
      if (!A.clip || !A.clip.items || !A.clip.items.length) return A.toast('Nothing to paste');
      const items = A.clip.items.map((it) => Object.assign({}, it, { id: A.uid() }));
      let bb = null; items.forEach((it) => (bb = G.bbUnion(bb, it.bb)));
      const [cx, cy] = R.toWorld(R.w / 2, R.h / 2);
      const vis = R.visibleBB();
      const onScreen = G.bbHit(bb, vis);
      const T = Array.isArray(at) ? M.translate(at[0] - (bb[0] + bb[2]) / 2, at[1] - (bb[1] + bb[3]) / 2)

      const moved = items.map((it) => D.transformItem(it, T, false));

    duplicate() {

  /* ================= import ================= */

  UI.importImageFile = async (file, at) => {
    try {
      let src = await readAs(file, 'url');
      const im = await loadImg(src);
      let w = im.naturalWidth, hh = im.naturalHeight;
      const MAX = 2400;
      if (Math.max(w, hh) > MAX) {
        const k = MAX / Math.max(w, hh);
        const c = h('canvas'); c.width = Math.round(w * k); c.height = Math.round(hh * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        src = c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.88);
        w = c.width; hh = c.height;
      }
      const img = placeImage(src, w, hh);
      if (Array.isArray(at)) {
        const bb = img.bb, T = M.translate(at[0] - (bb[0] + bb[2]) / 2, at[1] - (bb[1] + bb[3]) / 2);
        D.begin(); D.replace(new Map([[img.id, [D.transformItem(img, T)]]])); D.commit(); R.render();
      }
    } catch (e) { A.toast('That image could not be read'); }
  };
  function placeImage(src, w, hh, opts = {}) {
    const z = D.doc.view.zoom;
    const target = opts.width || Math.min(w, (R.w * 0.55) / z);
    const s = target / w;
    const [cx, cy] = opts.at || R.toWorld(R.w / 2, R.h / 2);
    const m = [s, 0, 0, s, opts.at ? cx : cx - (w * s) / 2, opts.at ? cy : cy - (hh * s) / 2];
    const it = { id: A.uid(), t: 'i', src, iw: w, ih: hh, m, o: 1 };
    it.bb = B.imageBB(it);
    let l = opts.layer || D.active();
    if (l.locked) l = D.addLayer();
    D.begin(); D.addItems([it], l); D.commit();
    R.render(); A.emit('layers:thumbs');
    return it;
  }

  const loadScript = (src) => new Promise((res, rej) => { const s = h('script', { src }); s.onload = res; s.onerror = rej; document.head.append(s); });
  UI.importPdf = async (file) => {
    A.toast('Opening PDF…', 2500);
    try {
      if (!window.pdfjsLib) {
        await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
      const buf = await readAs(file, 'buffer');
      const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
      const n = Math.min(pdf.numPages, 60);
      D.begin();
      const doc = D.doc;
      const layer = D.newLayer('PDF · ' + file.name.replace(/\.pdf$/i, '').slice(0, 28));
      const idx = doc.layers.findIndex((l) => l.id === doc.activeLayerId);
      doc.layers.splice(Math.max(0, idx), 0, layer); // below the active layer, so you can write on top
      const [x0, y0] = R.toWorld(R.w * 0.2, R.h * 0.14);
      let y = y0;
      const items = [];
      for (let p = 1; p <= n; p++) {
        const page = await pdf.getPage(p);
        const vp1 = page.getViewport({ scale: 1 });
        const vp = page.getViewport({ scale: 2 });
        const c = h('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        await page.render({ canvasContext: ctx, viewport: vp }).promise;
        const src = c.toDataURL('image/jpeg', 0.86);
        const wWorld = vp1.width * (96 / 72);
        const s = wWorld / c.width;
        const it = { id: A.uid(), t: 'i', src, iw: c.width, ih: c.height, m: [s, 0, 0, s, x0, y], o: 1 };
        it.bb = B.imageBB(it);
        items.push(it);
        y += c.height * s + 40;
        if (p % 3 === 0) A.toast(`Page ${p} of ${n}`, 900);
      }
      layer.items = items;
      layer.locked = true;
      D.commit('layers');
      A.emit('layers');
      R.fitBB(items.length ? G.bbUnion(items[0].bb, items[0].bb) : null, 40);
      A.toast(`Imported ${n} page${n === 1 ? '' : 's'} on a locked layer`);
    } catch (e) {
      console.error(e);
      D.cancel();
      A.toast('The PDF could not be opened. PDF import needs an internet connection the first time.', 3500);
    }
  };

  /* ================= export ================= */
  function makePdf(jpegBytes, pw, ph, iw, ih) {
    const enc = new TextEncoder();
    const chunks = []; let len = 0; const offs = [];
    const push = (x) => { const b = typeof x === 'string' ? enc.encode(x) : x; chunks.push(b); len += b.length; };
    const obj = (n, body) => { offs[n] = len; push(`${n} 0 obj\n`); body(); push('\nendobj\n'); };
    push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
    obj(2, () => push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
    obj(3, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`));
    obj(4, () => { push(`<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`); push(jpegBytes); push('\nendstream'); });
    const content = `q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
    obj(5, () => push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`));
    const xref = len;
    let x = 'xref\n0 6\n0000000000 65535 f \n';
    for (let i = 1; i <= 5; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
    push(x + `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
    const out = new Uint8Array(len); let o = 0;
    for (const c of chunks) { out.set(c, o); o += c.length; }
    return out;
  }
  function makeSvg(doc, bb, withBg, onlyIds) {
    const defs = [];
    const w = bb[2] - bb[0], hh = bb[3] - bb[1];
    let body = '';
    if (withBg) body += `<rect x="${bb[0]}" y="${bb[1]}" width="${w}" height="${hh}" fill="${doc.paper.bg}"/>`;
    doc.layers.forEach((l, li) => {
      if (!l.visible) return;
      const items = l.items.filter((it) => !onlyIds || onlyIds.has(it.id));
      if (!items.length) return;
      const masks = items.filter((it) => it.t === 's' && B.catalog[it.b].mask);
      const normal = items.filter((it) => !(it.t === 's' && B.catalog[it.b].mask));
      let attrs = l.opacity < 1 ? ` opacity="${l.opacity}"` : '';
      if (masks.length) {
        const id = 'mask' + li;
        defs.push(`<mask id="${id}" maskUnits="userSpaceOnUse" x="${bb[0]}" y="${bb[1]}" width="${w}" height="${hh}"><rect x="${bb[0]}" y="${bb[1]}" width="${w}" height="${hh}" fill="#fff"/>${masks.map((m) => B.itemSvg(m, defs)).join('')}</mask>`);
        attrs += ` mask="url(#${id})"`;
      }
      body += `<g id="${String(l.name).replace(/[^\w-]+/g, '_')}"${attrs}>${normal.map((it) => B.itemSvg(it, defs)).join('')}</g>`;
    });
    return `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(w)}" height="${Math.round(hh)}" viewBox="${bb[0]} ${bb[1]} ${w} ${hh}"><defs>${defs.join('')}</defs>${body}</svg>`;
  }
  const safeName = (n) => (n || 'drawing').replace(/[\\/:*?"<>|]+/g, '-').slice(0, 60);

  UI.openExport = () => {

    const box = h('div', { class: 'modal', role: 'dialog', 'aria-label': 'Export' });

    const draw = () => {

      if (st.fmt === 'png' || st.fmt === 'jpg' || st.fmt === 'pdf') row('Resolution', segc([[1, '1×'], [2, '2×'], [3, '3×'], [4, '4×']], st.scale, (v) => { st.scale = v; draw(); }));
      if (st.fmt === 'png' || st.fmt === 'svg') body.append(h('div', { class: 'set-row' }, h('div', null, h('div', { class: 't' }, 'Paper background'), h('div', { class: 'd' }, 'Off gives a transparent background')), toggleSw(st.bg, (v) => (st.bg = v), 'ex-bg')));
      if (st.fmt !== 'svg' && st.fmt !== 'axiom') body.append(h('div', { class: 'set-row' }, h('div', null, h('div', { class: 't' }, 'Include grid')), toggleSw(st.grid, (v) => (st.grid = v), 'ex-grid')));
      if (st.fmt === 'axiom') body.append(h('p', { class: 'muted' }, 'A complete, editable copy of this drawing (layers, vector strokes, images). Import it from the gallery on any device.'));
    };
    draw();
    const go = h('button', { class: 'btn primary', onclick: async () => {
      go.disabled = true;
      try { await doExport(st); close(); } catch (e) { console.error(e); A.toast('Export failed: ' + (e.message || e)); go.disabled = false; }
    } }, 'Export');
    box.append(h('h3', null, 'Export'), h('p', { class: 'muted' }, doc.name), body, h('div', { class: 'row end gap', style: { marginTop: '20px' } }, h('button', { class: 'btn', onclick: close }, 'Cancel'), go));
    back.append(box);
    back.addEventListener('pointerdown', (e) => { if (e.target === back) close(); });
    document.body.append(back);
  };
  async function doExport(st) {
    const doc = D.doc;
    const name = safeName(doc.name);
    if (st.fmt === 'axiom') {
      const blob = new Blob([JSON.stringify(Object.assign({ format: 'axiom', version: 1 }, doc))], { type: 'application/json' });
      return A.deliverFile(blob, name + '.axiom');
    }
    let bb, onlyIds = null;
    if (st.area === 'selection' && R.sel.size) { bb = A.SEL.box; onlyIds = new Set(R.sel); }
    else if (st.area === 'view') bb = R.visibleBB();
    else bb = D.allBB();
    if (!bb) throw new Error('the drawing is empty');
    if (st.area !== 'view') { const pad = 24; bb = [bb[0] - pad, bb[1] - pad, bb[2] + pad, bb[3] + pad]; }
    if (st.fmt === 'svg') {
      const svg = makeSvg(doc, bb, st.bg, onlyIds);
      return A.deliverFile(new Blob([svg], { type: 'image/svg+xml' }), name + '.svg');
    }
    const canvas = R.renderRegion(doc, bb, st.scale, { bg: st.fmt !== 'png' || st.bg, grid: st.grid, onlyIds });
    if (st.fmt === 'png') {
      const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
      return A.deliverFile(blob, name + '.png', canvas.toDataURL('image/png'));
    }
    const jpg = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.92));
    if (st.fmt === 'jpg') return A.deliverFile(jpg, name + '.jpg', canvas.toDataURL('image/jpeg', 0.92));
    const bytes = new Uint8Array(await jpg.arrayBuffer());
    const pw = Math.round((bb[2] - bb[0]) * 0.75), ph = Math.round((bb[3] - bb[1]) * 0.75);
    const pdf = makePdf(bytes, pw, ph, canvas.width, canvas.height);
    return A.deliverFile(new Blob([pdf], { type: 'application/pdf' }), name + '.pdf');
  }

    const sel = (k, opts, after) => segc(opts, S[k], (v) => { set(k, v); after && after(); rebuild(); });
    const content = h('div');
    const rebuild = () => {

      content.append(
        h('h5', null, 'Workspace'),

        row('Tool setup', 'Double-tap the toolbar grip to switch', sel('toolSetup', [['bar', 'Tool Bar'], ['wheel', 'Tool Wheel']], () => { S.toolPos = null; UI.renderTools(); })),
        row('Toolbar side', null, sel('toolSide', [['left', 'Left'], ['right', 'Right']], () => { S.toolPos = null; UI.renderTools(); })),
        row('Dark canvas in dark mode', 'Paper turns dark and ink adapts. Exports keep your real colors.', toggleSw(S.darkCanvas !== false, (v) => { set('darkCanvas', v); R.themeChanged(); }, 's-darkcanvas')),
        row('Palette on toolbar', 'Quick colors under the color button', toggleSw(S.showPalette, (v) => { set('showPalette', v); UI.renderTools(); }, 's-pal')),
        h('h5', null, 'Apple Pencil and touch'),
        row('Finger action', 'Pan: drag to move. Hold still, then move to lasso, or lift for a menu. Auto pans once a Pencil has been used.', sel('fingerAction', [['auto', 'Auto'], ['pan', 'Pan'], ['draw', 'Draw'], ['select', 'Select']])),
        row('Pressure response', 'Softer makes light strokes thicker', (() => {
          const r = h('input', { type: 'range', min: 40, max: 200, value: Math.round(S.pressure * 100), id: 's-pressure', style: { width: '160px' } });
          r.addEventListener('change', () => set('pressure', +r.value / 100));
          return h('div', { class: 'row gap small muted' }, 'Softer', r, 'Firmer');
        })()),
        row('Hover cursor', 'Shows the brush size while the Pencil hovers', toggleSw(S.hoverCursor, (v) => set('hoverCursor', v), 's-hover')),
        h('h5', null, 'Gestures'),
        row('Two-finger tap to undo', null, toggleSw(S.twoFingerUndo, (v) => set('twoFingerUndo', v), 's-2f')),

/* ---- ui-gallery.js ---- */
/* Axiom gallery: drawings grid, search/sort, new drawing sheet with paper templates, file import */
'use strict';
(() => {
  const D = A.D, R = A.R, h = A.h;
  const UI = (A.UI = A.UI || {});
  const S = A.settings;
  let host, query = '';

  UI.templates = [
    { id: 'blank', name: 'Blank', grid: 'none' },
    { id: 'dot', name: 'Dot grid', grid: 'dot', spacing: 24 },
    { id: 'graph', name: 'Graph', grid: 'graph', spacing: 40, divisions: 5 },
    { id: 'lined', name: 'Lined', grid: 'lined', spacing: 32, divisions: 1 },
    { id: 'iso', name: 'Isometric', grid: 'iso', spacing: 32 },
    { id: 'eng', name: 'Engineering', grid: 'graph', spacing: 50, divisions: 10, bg: '#eef5ec' },
  ];

  const drawTemplate = (cv, t, bg) => {
    const W = 200, H = 150; cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = t.bg || bg; ctx.fillRect(0, 0, W, H);
    const paper = { bg: t.bg || bg, grid: { type: t.grid, spacing: (t.spacing || 24) * 0.5, divisions: t.divisions || 5, opacity: 1 } };
    R.drawGrid(ctx, [1, 0, 0, 1, 0, 0], W, H, paper, { dpr: 1 });
  };

  UI.newDrawingSheet = () => new Promise((res) => {
    const st = { t: UI.templates[1], bg: D.papers.white, name: 'Untitled' };
    const back = h('div', { class: 'modal-back' });
    const close = (v) => { back.remove(); res(v); };
    const grid = h('div', { class: 'paper-grid' });
    const bgRow = h('div', { class: 'bg-row' });
    const nameIn = h('input', { class: 'field', id: 'new-name', value: st.name, autocomplete: 'off' });
    const draw = () => {
      grid.innerHTML = ''; bgRow.innerHTML = '';
      UI.templates.forEach((t) => {
        const cv = h('canvas');
        const b = h('button', { class: 'paper-opt' + (t.id === st.t.id ? ' on' : ''), onclick: () => { st.t = t; draw(); } }, cv, t.name);
        drawTemplate(cv, t, st.bg);
        grid.append(b);
      });
      Object.entries(D.papers).forEach(([k, c]) => bgRow.append(h('button', {
        class: c === st.bg && !st.t.bg ? 'on' : '', style: { background: c }, 'aria-label': k + ' paper', title: k,
        onclick: () => { st.bg = c; if (st.t.bg) st.t = UI.templates.find((x) => x.grid === st.t.grid && !x.bg) || UI.templates[2]; draw(); },
      })));
    };
    draw();
    const create = () => close({ name: nameIn.value.trim() || 'Untitled', t: st.t, bg: st.t.bg || st.bg });
    nameIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') create(); });
    back.append(h('div', { class: 'modal', role: 'dialog', 'aria-label': 'New drawing' },
      h('h3', null, 'New drawing'),
      h('h5', null, 'Name'), nameIn,
      h('h5', null, 'Paper'), grid,
      h('h5', null, 'Background'), bgRow,
      h('div', { class: 'row end gap', style: { marginTop: '22px' } }, h('button', { class: 'btn', onclick: () => close(null) }, 'Cancel'), h('button', { class: 'btn primary', onclick: create }, 'Create'))));
    back.addEventListener('pointerdown', (e) => { if (e.target === back) close(null); });
    document.body.append(back);
  });

  UI.createFromSheet = (r) => {
    const doc = D.create({ name: r.name, bg: r.bg, grid: r.t.grid });
    doc.paper.grid.spacing = r.t.spacing || 24;
    doc.paper.grid.divisions = r.t.divisions || 5;
    if (r.t.grid === 'none') { doc.paper.grid.type = 'dot'; doc.precision.grid = false; }
    return doc;
  };

  async function render() {
    const metas = (await A.store.listMeta()).filter(Boolean);
    const sorters = {
      updated: (a, b) => b.updated - a.updated,
      created: (a, b) => b.created - a.created,
      name: (a, b) => a.name.localeCompare(b.name),
    };
    metas.sort(sorters[S.sort] || sorters.updated);
    const q = query.trim().toLowerCase();
    const shown = q ? metas.filter((m) => m.name.toLowerCase().includes(q)) : metas;
    host.innerHTML = '';
    const search = h('input', { type: 'search', id: 'g-search', placeholder: 'Search drawings', value: query, 'aria-label': 'Search drawings' });
    search.addEventListener('input', () => { query = search.value; renderGrid(); });
    const sort = h('select', { class: 'field', id: 'g-sort', style: { margin: 0, width: 'auto', height: '40px' }, 'aria-label': 'Sort' },
      ...[['updated', 'Last edited'], ['created', 'Date created'], ['name', 'Name']].map(([v, l]) => h('option', { value: v, selected: S.sort === v }, l)));
    sort.addEventListener('change', () => { S.sort = sort.value; A.saveSettings(); render(); });
    const importBtn = h('button', { class: 'btn', onclick: importProject }, A.iconEl('import'), 'Import');
    const newBtn = h('button', { class: 'btn primary', id: 'g-new', onclick: newDrawing }, A.iconEl('plus'), 'New drawing');
    const wrap = h('div', { class: 'g-wrap' },
      h('div', { class: 'g-top' },
        h('div', null, h('h1', { class: 'wordmark' }, 'Axiom', h('i', null, '.')), h('p', { class: 'g-sub' }, 'An infinite canvas for scientists and mathematicians')),
        h('div', { class: 'g-actions' }, h('div', { class: 'g-search' }, A.iconEl('search'), search), sort, importBtn, newBtn)),
      h('div', { class: 'g-bar' }, h('h2', null, `Drawings · ${metas.length}`)),
      h('div', { class: 'g-grid', id: 'g-grid' }));
    host.append(wrap);
    const renderGrid = () => {
      const qq = query.trim().toLowerCase();
      const list = qq ? metas.filter((m) => m.name.toLowerCase().includes(qq)) : metas;
      const grid = A.$('#g-grid', host);
      grid.innerHTML = '';
      const nc = h('button', { class: 'card new', onclick: newDrawing, 'aria-label': 'New drawing' }, h('span', { class: 'thumb', html: A.icon('plus') }), h('div', { class: 'meta' }, h('div', { class: 't' }, h('div', { class: 'name' }, 'New drawing'), h('div', { class: 'date' }, 'Choose a paper'))));
      if (!qq) grid.append(nc);
      list.forEach((m) => grid.append(card(m)));
      if (!list.length && qq) grid.append(h('p', { class: 'empty-note' }, `No drawings match “${query}”.`));
    };
    renderGrid();
    void shown;
  }

  function card(m) {
    const thumb = h('span', { class: 'thumb', style: { background: m.paper || '#fff' } });
    if (m.thumb) thumb.append(h('img', { src: m.thumb, alt: '' }));
    const open = h('button', { class: 'card-open', style: { display: 'contents' }, onclick: () => A.emit('open', m.id), 'aria-label': 'Open ' + m.name }, thumb);
    const more = h('button', { class: 'ibtn', 'aria-label': 'More for ' + m.name, html: A.icon('more') });
    more.addEventListener('click', (e) => { e.stopPropagation(); cardMenu(m, more); });
    const el = h('div', { class: 'card' }, open, h('div', { class: 'meta' }, h('div', { class: 't' }, h('div', { class: 'name' }, m.name), h('div', { class: 'date' }, A.fmtDate(m.updated))), more));
    let lp;
    thumb.addEventListener('pointerdown', () => { lp = setTimeout(() => { lp = 'fired'; cardMenu(m, thumb); }, 550); });
    thumb.addEventListener('pointerup', () => { if (lp !== 'fired') clearTimeout(lp); });
    thumb.addEventListener('pointerleave', () => { if (lp !== 'fired') clearTimeout(lp); });
    open.addEventListener('click', (e) => { if (lp === 'fired') { e.stopImmediatePropagation(); lp = null; } }, true);
    return el;
  }

  function cardMenu(m, anchor) {
    const box = h('div', { class: 'menu' });
    const it = (icon, label, fn, cls) => { const b = h('button', { class: cls || '', onclick: () => { A.closePopovers(); fn(); } }); b.innerHTML = A.icon(icon); b.append(label); box.append(b); };
    it('chev', 'Open', () => A.emit('open', m.id));
    it('rename', 'Rename', async () => {
      const n = await A.dialog({ title: 'Rename drawing', input: m.name, okText: 'Rename' });
      if (!n || !n.trim()) return;
      const doc = await A.store.loadDoc(m.id);
      if (!doc) return;
      doc.name = n.trim().slice(0, 80);
      await A.store.saveDoc(doc, m.thumb);
      render();
    });
    it('duplicate', 'Duplicate', async () => {
      const doc = await A.store.loadDoc(m.id);
      if (!doc) return;
      doc.id = A.uid(); doc.name = m.name + ' copy'; doc.created = doc.updated = Date.now();
      await A.store.saveDoc(doc, m.thumb);
      render();
    });
    it('export', 'Export project file', async () => {
      const doc = await A.store.loadDoc(m.id);
      if (!doc) return;
      A.deliverFile(new Blob([JSON.stringify(Object.assign({ format: 'axiom', version: 1 }, doc))], { type: 'application/json' }), m.name.replace(/[\\/:*?"<>|]+/g, '-') + '.axiom');
    });
    box.append(h('hr'));
    it('trash', 'Delete', async () => {
      const ok = await A.dialog({ title: `Delete “${m.name}”?`, body: 'This drawing is removed from this device. This cannot be undone.', okText: 'Delete', danger: true });
      if (ok) { await A.store.deleteDoc(m.id); render(); }
    }, 'danger');
    A.popover(box, anchor, { side: 'down' });
  }

  async function newDrawing() {
    const r = await UI.newDrawingSheet();
    if (!r) return;
    const doc = UI.createFromSheet(r);
    await A.store.saveDoc(doc, null);
    A.emit('open', doc.id);
  }
  async function importProject() {
    const inp = h('input', { type: 'file', accept: '.axiom,application/json,.json', style: { display: 'none' } });
    inp.addEventListener('change', async () => {
      const f = inp.files && inp.files[0];
      inp.remove();
      if (!f) return;
      try { await UI.importProjectText(await f.text()); } catch (e) { A.toast('That file is not an Axiom project'); }
    });
    document.body.append(inp);
    inp.click();
  }
  UI.importProjectText = async (txt) => {
    const data = JSON.parse(txt);
    if (!data || !Array.isArray(data.layers)) throw new Error('bad file');
    delete data.format; delete data.version;
    data.id = A.uid();
    data.updated = Date.now();
    data.created = data.created || Date.now();
    data.name = data.name || 'Imported drawing';
    const doc = D.normalize(data);
    await A.store.saveDoc(doc, R.thumbnail(doc).toDataURL('image/jpeg', 0.8));
    A.toast('Imported “' + doc.name + '”');
    render();
  };

  UI.mountGallery = (el) => { host = el; };
  UI.renderGallery = render;
})();

/* ---- app.js ---- */
/* Axiom boot: views, autosave, sample drawing, file drops, service worker */
'use strict';
(() => {
  const D = A.D, R = A.R, B = A.B, G = A.G, UI = A.UI;
  const S = A.settings;

  /* ---------- autosave ---------- */
  let saving = Promise.resolve();
  const save = async () => {
    const doc = D.doc;
    if (!doc) return;
    let thumb = null;
    try { thumb = R.thumbnail(doc).toDataURL('image/jpeg', 0.78); } catch (e) { /* tainted or unavailable */ }
    saving = saving.then(() => A.store.saveDoc(doc, thumb)).catch((e) => { console.error(e); A.toast('Could not save: storage may be full'); });
    return saving;
  };
  const autosave = A.debounce(save, 1200);
  A.on('doc:changed', (k) => { if (k !== 'view') autosave(); });
  A.on('view', A.debounce(() => { if (D.doc) autosave(); }, 1500));
  document.addEventListener('visibilitychange', () => { if (document.hidden && D.doc) autosave.flush(); });
  addEventListener('pagehide', () => { if (D.doc) autosave.flush(); });

  /* ---------- views ---------- */
  const gallery = () => A.$('#gallery-view'), canvasView = () => A.$('#canvas-view');
  async function showGallery() {
    A.closePopovers();
    if (D.doc) { autosave.cancel(); await save(); }
    A.IN.cancelAll();
    D.doc = null;
    canvasView().hidden = true;
    gallery().hidden = false;
    updateChrome();
    await UI.renderGallery();
  }
  async function openDoc(id) {
    const raw = await A.store.loadDoc(id);
    if (!raw) { A.toast('That drawing could not be found'); return showGallery(); }
    const doc = D.normalize(raw);
    D.doc = doc;
    D.resetHistory();
    A.emit('selection:clear');
    gallery().hidden = true;
    canvasView().hidden = false;
    canvasView().classList.remove('ui-hidden');
    R.resize();
    const v = doc.view;
    if (!v.tx && !v.ty) {
      const bb = D.allBB();
      if (bb) R.fitBB(bb); else { v.tx = R.w / 2; v.ty = R.h / 2; }
    }
    A.emit('doc:open');
    A.emit('view');
    UI.renderTools();
    UI.renderLayers();
    R.renderNow(true);
  }
  A.on('go:gallery', showGallery);
  A.on('open', openDoc);

  /* ---------- sample drawing (first launch) ---------- */
  function sampleDoc() {
    const doc = D.create({ name: 'Welcome · unit circle and sine', bg: D.papers.white, grid: 'graph' });
    doc.paper.grid.spacing = 40; doc.paper.grid.divisions = 5;
    const L = doc.layers[0]; L.name = 'Sketch';
    const ink = D.newLayer('Ink'); const hl = D.newLayer('Highlights');
    doc.layers = [hl, L, ink]; doc.activeLayerId = ink.id;
    let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647 - 0.5);
    const stroke = (b, color, size, op, fn, n, opts = {}) => {
      const pts = [];
      for (let i = 0; i <= n; i++) {
        const t = i / n; const [x, y] = fn(t);
        const p = opts.flat ? 1 : 0.55 + 0.45 * Math.sin(Math.PI * Math.min(1, t * 1.15));
        pts.push(x + rnd() * (opts.j ?? 0.6), y + rnd() * (opts.j ?? 0.6), B.widthMul(b, p, opts.tilt || 0, true));
      }
      return D.makeStroke(b, color, size, op, G.simplify(pts, 0.15, 0.03), opts.extra || {});
    };
    const U = 120; // one unit = 120 px
    // axes
    ink.items.push(stroke('fineliner', '#1a1e26', 1.8, 1, (t) => [-200 + t * 1180, 0], 60, { flat: true, j: 0.4 }));
    ink.items.push(stroke('fineliner', '#1a1e26', 1.8, 1, (t) => [0, 200 - t * 400], 30, { flat: true, j: 0.4 }));
    ink.items.push(stroke('fineliner', '#1a1e26', 1.8, 1, (t) => [968 + t * 12, -8 + t * 8], 4, { flat: true, j: 0 }));
    ink.items.push(stroke('fineliner', '#1a1e26', 1.8, 1, (t) => [968 + t * 12, 8 - t * 8], 4, { flat: true, j: 0 }));
    ink.items.push(stroke('fineliner', '#1a1e26', 1.8, 1, (t) => [-8 + t * 8, -188 - t * 12 + 0], 4, { flat: true, j: 0 }));
    ink.items.push(stroke('fineliner', '#1a1e26', 1.8, 1, (t) => [8 - t * 8, -188 - t * 12], 4, { flat: true, j: 0 }));
    // ticks at pi/2 multiples
    for (let k = 1; k <= 4; k++) { const x = (k * Math.PI / 2) * U; ink.items.push(stroke('fineliner', '#1a1e26', 1.5, 1, (t) => [x, -7 + t * 14], 3, { flat: true, j: 0 })); }
    // unit circle (pencil) centred on the origin
    L.items.push(stroke('pencil', '#4a5060', 2.4, 0.9, (t) => [Math.cos(t * Math.PI * 2) * U, Math.sin(t * Math.PI * 2) * U], 140, { j: 0.8 }));
    // radius at 60°
    const a = -Math.PI / 3;
    ink.items.push(stroke('pen', '#c0392b', 2.6, 1, (t) => [Math.cos(a) * U * t, Math.sin(a) * U * t], 30));
    ink.items.push(stroke('dotted', '#c0392b', 2.4, 1, (t) => [Math.cos(a) * U, Math.sin(a) * U * (1 - t)], 20, { flat: true, j: 0 }));
    ink.items.push(stroke('dotted', '#1f4fbf', 2.4, 1, (t) => [Math.cos(a) * U + t * ((Math.PI / 3) * U - Math.cos(a) * U), Math.sin(a) * U], 30, { flat: true, j: 0 }));
    // angle arc
    ink.items.push(stroke('pen', '#c0392b', 1.8, 1, (t) => [Math.cos(-t * Math.PI / 3) * 34, Math.sin(-t * Math.PI / 3) * 34], 20));
    // sine curve
    ink.items.push(stroke('pen', '#1f4fbf', 3, 1, (t) => [t * 2 * Math.PI * U, -Math.sin(t * 2 * Math.PI) * U], 220, { j: 0.5 }));
    // shaded area under the first hump (fill)
    const fillPts = [];
    for (let i = 0; i <= 60; i++) { const t = i / 60; fillPts.push(t * Math.PI * U, -Math.sin(t * Math.PI) * U, 1); }
    fillPts.push(Math.PI * U, 0, 1, 0, 0, 1);
    L.items.unshift(D.makeStroke('fill', '#9cc3f0', 1, 0.45, fillPts));
    // highlighter on the point (pi/3, sin)
    hl.items.push(stroke('highlighter', '#f2c94c', 22, 0.45, (t) => [(Math.PI / 3) * U - 30 + t * 60, Math.sin(a) * U], 10, { flat: true, j: 0.3 }));
    // brush-pen flourish under everything: "area = 2"
    ink.items.push(stroke('brushpen', '#1e8449', 6, 1, (t) => [200 + t * 150, 90 + Math.sin(t * Math.PI) * -8], 60));
    doc.view = { tx: 0, ty: 0, zoom: 1, rot: 0 };
    return doc;
  }

  /* ---------- status-bar color: blend the clock strip into the canvas / gallery ---------- */
  function updateChrome() {
    let m = document.querySelector('meta[name="theme-color"]');
    if (!m) { m = document.createElement('meta'); m.name = 'theme-color'; document.head.append(m); }
    const onCanvas = D.doc && !canvasView().hidden;
    const c = onCanvas ? R.displayBg() : (getComputedStyle(document.body).backgroundColor || '#eef0f3');
    m.setAttribute('content', c);
  }
  A.on('doc:open', () => setTimeout(updateChrome, 0));
  A.on('doc:changed', (k) => { if (k === 'paper' || k === 'all') updateChrome(); });
  A.on('theme', () => setTimeout(updateChrome, 0));

  /* ---------- boot ---------- */
  async function boot() {
    try { if (navigator.standalone || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches) document.documentElement.classList.add('standalone'); } catch (e) { /* ignore */ }
    UI.applyTheme();
    if (matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => UI.applyTheme());
    R.init(A.$('#main'), A.$('#overlay'));
    A.IN.init(A.$('#overlay'));
    UI.mountStatus(A.$('#statusbar'));
    UI.mountTools(A.$('#tools'));
    UI.mountLayers(A.$('#layers'));
    UI.mountPrecision(A.$('#precision'));
    UI.mountSelection(A.$('#selmenu'), A.$('#selpopup'));
    UI.mountGallery(A.$('#gallery-view'));
    A.$('#restore-ui').innerHTML = A.icon('eye');
    A.$('#restore-ui').addEventListener('click', () => A.emit('cmd', 'toggleUI'));
    A.on('selmenu:show', () => {});
    A.on('eyedrop:end', () => {});

    // paste images / strokes
    document.addEventListener('paste', (e) => {
      if (!D.doc || canvasView().hidden) return;
      const items = (e.clipboardData && e.clipboardData.items) || [];
      for (const it of items) if (it.type && it.type.startsWith('image/')) { const f = it.getAsFile(); if (f) { e.preventDefault(); UI.importImageFile(f); return; } }
      if (A.clip) { e.preventDefault(); A.emit('cmd', 'paste'); }
    });
    // drag & drop files
    addEventListener('dragover', (e) => e.preventDefault());
    addEventListener('drop', async (e) => {
      e.preventDefault();
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (!f) return;
      if (/\.axiom$|json/i.test(f.name + f.type)) { try { await UI.importProjectText(await f.text()); } catch (er) { A.toast('That file is not an Axiom project'); } return; }
      if (!D.doc) return A.toast('Open a drawing first, then drop the file');
      if (f.type === 'application/pdf') UI.importPdf(f); else if (f.type.startsWith('image/')) UI.importImageFile(f);
    });

    const metas = await A.store.listMeta();
    if (!metas.length && !S.seenWelcome) {
      const doc = sampleDoc();
      await A.store.saveDoc(doc, null);
      S.seenWelcome = true; A.saveSettings();
      await openDoc(doc.id);
      await save();
      setTimeout(() => A.toast('Welcome to Axiom. Draw with Apple Pencil, and pinch with two fingers to move around.', 4200), 600);
    } else {
      await showGallery();
    }

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && window.top === window && !window.AXIOM_NO_SW) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
