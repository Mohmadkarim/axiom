    }
    pressureOf(s) {
      if (this.hasPressure && s.p > 0) return s.p;
      // simulate pressure from velocity (finger/mouse)
      if (this.lastS) {
        const dt = Math.max(1, s.t - this.lastS.t), v = hyp(s.x - this.lastS.x, s.y - this.lastS.y) / dt;
        this.vel = this.vel * 0.7 + v * 0.3;
      }
      return A.clamp(1.1 - this.vel * 0.42, 0.32, 1);
    }
    add(s) {
      if (this.lastS) this.lengthScreen += hyp(s.x - this.lastS.x, s.y - this.lastS.y);
      let [wx, wy] = R.toWorld(s.x, s.y);
      if (this.guide) [wx, wy] = GU.project(this.guide, wx, wy, this.gctx);
      const p = this.pressureOf(s);
      let m = B.widthMul(this.slot.b, p, s.tilt, this.hasPressure);
      this.pm = this.pm == null ? m : this.pm + (m - this.pm) * (this.hasPressure ? 0.55 : 0.3);
      m = this.pm;
      this.raw.push(wx, wy, m);
      // keep the real pen positions (no lagging filter): smoothing happens symmetrically in finalPts,
      // so the ink stays exactly under the Pencil and the stroke never drifts off the path
      const n = this.pts.length;
      if (!n || this.guide) { this.pts.push(wx, wy, m); }
      else {
        const lx = this.pts[n - 3], ly = this.pts[n - 2];
        if (hyp(wx - lx, wy - ly) * this.zoom > 0.6) this.pts.push(wx, wy, m);
        else { this.pts[n - 3] = wx; this.pts[n - 2] = wy; this.pts[n - 1] = Math.max(this.pts[n - 1], m); }
      }
      this.lastS = s;
    }
    move(e, rect) {
      const ss = samplesOf(e, rect);
      this.nSamples += ss.length; if (ss.length > 1) this.coalesced = true; this.tLast = ss[ss.length - 1].t;
      if (this.shape) {
        const s = ss[ss.length - 1];
        const [x, y] = R.toWorld(s.x, s.y);
        const [px, py] = this.shapePivot, [hx, hy] = this.shapeHold;
        const a0 = Math.atan2(hy - py, hx - px), a1 = Math.atan2(y - py, x - px);
        const d0 = hyp(hx - px, hy - py) || 1, d1 = hyp(x - px, y - py);
        const sc = d1 / d0;
        if (hyp(x - hx, y - hy) * this.zoom > 3) this.shapeM = M.about(M.mul(M.rotate(a1 - a0), M.scale(sc)), px, py);
        this.lastS = s;
        R.renderOverlay();
        return;
      }
      for (const s of ss) this.add(s);
      const s = ss[ss.length - 1];
      if (hyp(s.x - this.hold.x, s.y - this.hold.y) > 3) { this.hold = { x: s.x, y: s.y, t: s.t }; this.holdAt = performance.now(); this.armHold(); }
      // predicted samples for lower perceived latency
      this.predicted = null;
      if (e.getPredictedEvents) {
        const pe = e.getPredictedEvents();
        if (pe && pe.length) {
          const last = pe[pe.length - 1];
          if (hyp(last.clientX - rect.left - s.x, last.clientY - rect.top - s.y) > 24) { R.renderOverlay(); return; }
          let [wx, wy] = R.toWorld(last.clientX - rect.left, last.clientY - rect.top);
          if (this.guide) [wx, wy] = GU.project(this.guide, wx, wy, this.gctx);
          this.predicted = [wx, wy, this.pm];
        }
      }
      R.renderOverlay();
    }
    /* turn live points into final points (snap/align/straight/shape) */
    finalPts(live = false) {
      const doc = D.doc;
      let pts = this.guide ? this.pts.slice() : IN.smoothStroke(this.pts, this.slot.smoothing);
      if (live && this.predicted) pts = pts.concat(this.predicted);
      let sharp = false, closed = false;
      if (this.shape) {
        const T = this.shapeM;
        const sp = this.shape.pts.slice();
        for (let i = 0; i < sp.length; i += 3) { const [x, y] = M.apply(T, sp[i], sp[i + 1]); sp[i] = x; sp[i + 1] = y; }
        return { pts: sp, sharp: !!this.shape.sharp, closed: this.shape.closed };
      }
      const np = G.count(pts);
      const avgm = () => { let s = 0; for (let i = 2; i < pts.length; i += 3) s += pts[i]; return s / Math.max(1, np); };
      const g = doc.paper.grid;
      if (!this.guide && np >= 2 && doc.precision.snap && doc.precision.grid && g.type !== 'none') {
        const m = avgm();
        let a = [pts[0], pts[1]], b = [pts[pts.length - 3], pts[pts.length - 2]];
        if (doc.precision.snapMode === 'grid') {
          const sp = g.type === 'graph' || g.type === 'eng' ? g.spacing / Math.max(1, g.divisions) * (this.zoom * g.spacing / Math.max(1, g.divisions) < 10 ? Math.max(1, g.divisions) : 1) : g.spacing;
          a = G.snapLattice(g.type, sp, a[0], a[1]); b = G.snapLattice(g.type, sp, b[0], b[1]);
        } else {
          const ang = G.alignDir(g.type, Math.atan2(b[1] - a[1], b[0] - a[0]));
          const L = (b[0] - a[0]) * Math.cos(ang) + (b[1] - a[1]) * Math.sin(ang);
          b = [a[0] + Math.cos(ang) * L, a[1] + Math.sin(ang) * L];
        }
        pts = [a[0], a[1], m, b[0], b[1], m];
        sharp = true;
      } else if (!this.guide && this.slot.smoothing >= 0.97 && np >= 2) {
        const m = avgm();
        pts = [pts[0], pts[1], m, pts[pts.length - 3], pts[pts.length - 2], m];
        sharp = true;
      } else if (!live && !this.guide && np > 2) {
        if (this.slot.smoothing > 0.12) pts = G.chaikin(pts, 1);
        pts = G.simplify(pts, 0.1 / this.zoom, 0.025);
      }
      // connect endpoints to nearby stroke ends
      if (!live && doc.precision.snap && doc.precision.connect && G.count(pts) >= 2) {
        const tol = 14 / this.zoom;
        const ends = [];
        for (const it of D.active().items) if (it.t === 's' && !B.catalog[it.b].mask && it.pts.length >= 6) {
          ends.push([it.pts[0], it.pts[1]], [it.pts[it.pts.length - 3], it.pts[it.pts.length - 2]]);
        }
        const fix = (i) => {
          let best = null, bd = tol;
          for (const e of ends) { const d = hyp(e[0] - pts[i], e[1] - pts[i + 1]); if (d < bd) { bd = d; best = e; } }
          if (best) { pts[i] = best[0]; pts[i + 1] = best[1]; }
        };
        fix(0); fix(pts.length - 3);
      }
      return { pts, sharp, closed };
    }
    liveItem() {
      const { pts, sharp, closed } = this.finalPts(true);
      const cat = this.cat;
      if (cat.mask) {
        return { t: 's', b: cat.soft ? 'airbrush' : 'pen', c: R.displayBg(), raw: true, w: this.slot.size, o: 0.92, pts, sharp, closed };
      }
      return { t: 's', b: this.slot.b, c: this.slot.color, w: this.slot.size, o: this.slot.opacity, pts, sharp, closed, live: true };
    }
    up(e, rect) {
      if (this.done) return;
      this.done = true;
      clearTimeout(this.holdTimer);
      IN.liveDraw = null;
      if (e && !this.shape) for (const s of samplesOf(e, rect)) this.add(s);
      const { pts, sharp, closed } = this.finalPts(false);
      const dur = (this.tLast - this.tFirst) / 1000;
      if (dur > 0.3 && this.rec.type === 'pen') IN.inputStats = { rate: Math.round(this.nSamples / dur), coalesced: this.coalesced };
      R.renderOverlay();
      if (this.cat.kind === 'fill' && G.count(pts) < 3) return;
      const layer = D.targetLayerFor(this.slot.b);
      if (layer.locked) { A.toast('This layer is locked'); return; }
      if (!layer.visible) { A.toast('This layer is hidden'); }
      const extra = {};
      if (sharp) extra.sharp = true;
      if (closed) extra.closed = true;
      const stamp = IN.stamp && IN.stamp();
      if (stamp) Object.assign(extra, stamp);
      const item = D.makeStroke(this.slot.b, this.slot.color, this.slot.size, this.slot.opacity, pts, extra);
      D.begin();
      D.addItems([item], layer);
      D.commit();
      R.appendItem(item, layer);
      R.renderOverlayNow();
      if (D.doc.precision.measure && G.count(pts) >= 2 && !this.cat.mask) {
        IN.lastMeasure = { item, until: performance.now() + 2200 };
        setTimeout(() => R.renderOverlay(), 2300);
      }
      A.emit('layers:thumbs');
    }
    cancel() { this.done = true; clearTimeout(this.holdTimer); IN.liveDraw = null; R.renderOverlay(); }
  }

  /* ---- slice eraser / stroke eraser ---- */
  class EraseAction {
    constructor(rec, s, kind) {
      this.kind = kind; this.rec = rec;
      this.slot = B.slot();
      this.changed = false;
      D.begin();
      this.last = R.toWorld(s.x, s.y);
      IN.cursor = { x: s.x, y: s.y, r: this.radiusScreen() };
      this.apply(this.last, this.last);
    }
    radiusScreen() { return Math.max(this.kind === 'slice' ? 2 : 4, (this.slot.size / 2) * D.doc.view.zoom); }
    apply(a, b) {
      const zoom = D.doc.view.zoom;
      const r = Math.max(this.kind === 'slice' ? 1.2 / zoom : 3 / zoom, this.slot.size / 2);
      const seg = [Math.min(a[0], b[0]) - r, Math.min(a[1], b[1]) - r, Math.max(a[0], b[0]) + r, Math.max(a[1], b[1]) + r];
      const map = new Map();
      const remove = [];
      for (const l of targetLayers(false)) {
        for (const it of l.items) {
          if (it.t !== 's' || !G.bbHit(it.bb, seg)) continue;
          if (!G.strokeHitSeg(it, a[0], a[1], b[0], b[1], r)) continue;
          if (this.kind === 'eraser') { remove.push(it.id); continue; }
          // slice: cut along the segment
          const half = (it.w * (it.mm || 1)) / 2;
          const cutR = r + (B.catalog[it.b].kind === 'fill' ? 0 : half * 0.5);
          let pieces = [it.pts];
          const d = hyp(b[0] - a[0], b[1] - a[1]);
          const steps = Math.max(1, Math.ceil(d / Math.max(cutR * 0.5, 0.3)));
          for (let k = 0; k <= steps; k++) {
            const t = k / steps, cx = a[0] + (b[0] - a[0]) * t, cy = a[1] + (b[1] - a[1]) * t;
            const next = [];
            for (const p of pieces) {
              const res = G.slice(p, cx, cy, cutR, Math.max(cutR * 0.4, 0.25));
              if (res) next.push(...res); else next.push(p);
            }
            pieces = next;
          }
          map.set(it.id, pieces.filter((p) => p.length >= 6).map((p) => D.withPts(it, p)));
        }
      }
      if (remove.length) { D.removeIds(remove); this.changed = true; }
      if (map.size) { D.replace(map); this.changed = true; }
      if (remove.length || map.size) R.render();
    }
    move(e, rect) {
      for (const s of samplesOf(e, rect)) {
        const w = R.toWorld(s.x, s.y);
        this.apply(this.last, w);
        this.last = w;
        IN.cursor = { x: s.x, y: s.y, r: this.radiusScreen() };
      }
      R.renderOverlay();
    }
    up() {
      IN.cursor = null;
      if (this.changed) { D.commit(); A.emit('layers:thumbs'); }
      else D.history.pending = null;
      R.renderOverlay();
    }
    cancel() { this.up(); }
  }

  /* ---- nudge ---- */
  class NudgeAction {
    constructor(rec, s) {
      this.rec = rec;
      this.slot = B.slot();
      this.last = R.toWorld(s.x, s.y);
      this.done = new Set();
      this.changed = false;
      D.begin();
      IN.cursor = { x: s.x, y: s.y, r: this.slot.size, nudge: true };
    }
    move(e, rect) {
      const s = samplesOf(e, rect).pop();
      const w = R.toWorld(s.x, s.y);
      const dx = w[0] - this.last[0], dy = w[1] - this.last[1];
      const Rw = this.slot.size / D.doc.view.zoom;
      const l = D.active();
      if (l.locked) { A.toast('This layer is locked'); return; }
      const box = [this.last[0] - Rw, this.last[1] - Rw, this.last[0] + Rw, this.last[1] + Rw];
      const map = new Map();
      for (const it of l.items) {
        if (it.t !== 's' || !G.bbHit(it.bb, box)) continue;
        let pts = this.done.has(it.id) ? it.pts.slice() : G.resample(it.pts, Math.max(Rw / 10, 0.5));
        let moved = false;
        for (let i = 0; i < pts.length; i += 3) {
          const d = hyp(pts[i] - this.last[0], pts[i + 1] - this.last[1]);
          if (d < Rw) { const f = (1 - d / Rw) ** 2; pts[i] += dx * f; pts[i + 1] += dy * f; moved = true; }
        }
        if (moved) { const n = D.withPts(it, pts); this.done.add(n.id); map.set(it.id, [n]); }
      }
      if (map.size) { D.replace(map); this.changed = true; R.render(); }
      this.last = w;
      IN.cursor = { x: s.x, y: s.y, r: this.slot.size, nudge: true };
      R.renderOverlay();
    }
    up() { IN.cursor = null; if (this.changed) { D.commit(); A.emit('layers:thumbs'); } else D.history.pending = null; R.renderOverlay(); }
    cancel() { this.up(); }
  }

  /* ---- lasso / item picker ---- */
  class LassoAction {
    constructor(rec, s, opts = {}) {
      this.rec = rec; this.opts = opts;
      this.poly = [];
      this.start = { x: s.x, y: s.y };
      this.moved = 0;
      this.mode = opts.forceLasso ? 'lasso' : IN.selMode;
      if (this.mode === 'lasso') this.poly.push(...R.toWorld(s.x, s.y));
      IN.lasso = this;
      A.emit('selmenu:show');
    }
    move(e, rect) {
      for (const s of samplesOf(e, rect)) {
        this.moved = Math.max(this.moved, hyp(s.x - this.start.x, s.y - this.start.y));
        if (this.mode === 'lasso') this.poly.push(...R.toWorld(s.x, s.y));
        this.cur = { x: s.x, y: s.y };
      }
      R.renderOverlay();
    }
    up(e, rect) {
      IN.lasso = null;
      const zoom = D.doc.view.zoom;
      const end = this.cur || this.start;
      if (this.mode === 'picker' || this.moved < 8 || this.poly.length < 8) {
        const [wx, wy] = R.toWorld(end.x, end.y);
        const it = pickItem(wx, wy, 10 / zoom);
        if (it) {
          const ids = new Set(R.sel);
          if (ids.has(it.id)) ids.delete(it.id); else ids.add(it.id);
          SEL.set(ids);
        } else if (this.mode === 'lasso' || this.moved < 8) SEL.clear();
        R.renderOverlay();
        return;
      }
      const poly = [];
      for (let i = 0; i < this.poly.length; i += 2) poly.push(this.poly[i], this.poly[i + 1]);
      const xs = poly.filter((_, i) => i % 2 === 0), ys = poly.filter((_, i) => i % 2 === 1);
      const pbb = [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
      const found = [];
      for (const l of targetLayers(IN.selLayerOnly)) {
        for (const it of l.items) {
          if (!G.bbHit(it.bb, pbb)) continue;
          if (B.isBox(it)) {
            const cs = B.imageCorners(it);
            const inside = cs.filter(([x, y]) => G.pointInPoly(x, y, poly)).length;
            if (IN.selPartial ? inside > 0 : inside === 4) found.push(it.id);
            continue;
          }
          if (B.catalog[it.b].mask) continue;
          const p = it.pts, n = G.count(p), step = Math.max(1, Math.floor(n / 40));
          let ins = 0, tot = 0;
          for (let i = 0; i < n; i += step) { tot++; if (G.pointInPoly(p[i * 3], p[i * 3 + 1], poly)) ins++; }
          if (IN.selPartial ? ins > 0 : ins >= tot * 0.85) found.push(it.id);
        }
      }
      const ids = new Set(R.sel);
      if (found.length && found.every((id) => ids.has(id))) found.forEach((id) => ids.delete(id));
      else found.forEach((id) => ids.add(id));
      SEL.set(ids);
      R.renderOverlay();
    }
    cancel() { IN.lasso = null; R.renderOverlay(); }
  }

  /* ---- transforming the selection ---- */
  class SelTransformAction {
    constructor(rec, s, hit) {
      this.rec = rec; this.hit = hit;
      this.start = R.toWorld(s.x, s.y);
      this.T0 = R.selPreview || M.id();
      const bb = SEL.box;
      const c = [[bb[0], bb[1]], [bb[2], bb[1]], [bb[2], bb[3]], [bb[0], bb[3]]].map(([x, y]) => M.apply(this.T0, x, y));
      this.corners = c;
      this.center = [(c[0][0] + c[2][0]) / 2, (c[0][1] + c[2][1]) / 2];
      this.theta = Math.atan2(c[1][1] - c[0][1], c[1][0] - c[0][0]);
      A.emit('selpopup:hide');
    }
    move(e, rect) {
      const s = samplesOf(e, rect).pop();
      const [x, y] = R.toWorld(s.x, s.y);
      let T;
      if (this.hit.kind === 'move') T = M.mul(M.translate(x - this.start[0], y - this.start[1]), this.T0);
      else if (this.hit.kind === 'rotate') {
        let r = Math.atan2(y - this.center[1], x - this.center[0]) - Math.atan2(this.start[1] - this.center[1], this.start[0] - this.center[0]);
        const st = Math.PI / 12, k = Math.round(r / st) * st;
        if (Math.abs(r - k) < A.rad(2.5)) r = k;
        T = M.mul(M.about(M.rotate(r), this.center[0], this.center[1]), this.T0);
        this.angle = r;
      } else {
        if (IN.scaleMode === 'off') return;
        const i = this.hit.i, piv = this.corners[(i + 2) % 4], c0 = this.corners[i];
        if (IN.scaleMode === 'scale') {
          const d0 = hyp(c0[0] - piv[0], c0[1] - piv[1]) || 1;
          // project the pointer onto the diagonal for a stable uniform scale
          const ux = (c0[0] - piv[0]) / d0, uy = (c0[1] - piv[1]) / d0;
          const d1 = Math.max(0.02 * d0, (x - piv[0]) * ux + (y - piv[1]) * uy);
          T = M.mul(M.about(M.scale(d1 / d0), piv[0], piv[1]), this.T0);
        } else {
          const th = this.theta, rot = M.rotate(-th);
          const [l0x, l0y] = M.apply(rot, c0[0] - piv[0], c0[1] - piv[1]);
          const [l1x, l1y] = M.apply(rot, x - piv[0], y - piv[1]);
          const sx = Math.abs(l0x) > 1e-6 ? l1x / l0x : 1, sy = Math.abs(l0y) > 1e-6 ? l1y / l0y : 1;
          const S = M.mul(M.rotate(th), M.mul(M.scale(sx, sy), M.rotate(-th)));
          T = M.mul(M.about(S, piv[0], piv[1]), this.T0);
        }
      }
      R.selPreview = T;
      R.render();
      A.emit('selection:preview');
    }
    up() { IN.commitSelTransform(); }
    cancel() { this.up(); }
  }
  IN.commitSelTransform = () => {
    const T = R.selPreview;
    if (!T) return A.emit('selection');
    const isId = T.every((v, i) => Math.abs(v - M.id()[i]) < 1e-9);
    if (!isId) {
      D.begin();
      const map = new Map(), ids = [];
      for (const { it } of SEL.items()) {
        const n = D.transformItem(it, T, IN.scaleMode !== 'stretch');
        map.set(it.id, [n]); ids.push(n.id);
      }
      D.replace(map);
      R.selPreview = null;
      D.commit();
      SEL.set(ids);
      A.emit('layers:thumbs');
    } else { R.selPreview = null; R.render(); A.emit('selection'); }
  };

  /* ---- two-finger gesture (canvas or selection) ---- */
  class GestureAction {
    constructor(recs, selection = false) {
      this.ids = recs.map((r) => r.id);
      const [a, b] = recs;
      this.a0 = [a.x, a.y]; this.b0 = [b.x, b.y];
      this.d0 = hyp(b.x - a.x, b.y - a.y) || 1;
      this.ang0 = Math.atan2(b.y - a.y, b.x - a.x);
      this.mid0 = [(a.x + b.x) / 2, (a.y + b.y) / 2];
      this.v0 = Object.assign({}, D.doc.view);
      this.w0 = R.toWorld(this.mid0[0], this.mid0[1]);
      this.selection = selection;
      this.rotUnlocked = false;
      Glide.reset();
      if (selection) { this.T0 = R.selPreview || M.id(); A.emit('selpopup:hide'); }
      else R.gesturing = true;
    }
    move() {
      const a = pointers.get(this.ids[0]), b = pointers.get(this.ids[1]);
      if (!a || !b) return;
      const d = hyp(b.x - a.x, b.y - a.y) || 1;
      const ang = Math.atan2(b.y - a.y, b.x - a.x);
      const mid = [(a.x + b.x) / 2, (a.y + b.y) / 2];
      let dr = ang - this.ang0;
      while (dr > Math.PI) dr -= 2 * Math.PI; while (dr < -Math.PI) dr += 2 * Math.PI;
      const sc = d / this.d0;
      if (this.selection) {
        const w0 = R.toWorld(this.mid0[0], this.mid0[1]), w1 = R.toWorld(mid[0], mid[1]);
        const s = IN.scaleMode === 'off' ? 1 : sc;
        const r = IN.allowSelRotate ? dr : 0;
        const T = M.mul(M.translate(w1[0] - w0[0], w1[1] - w0[1]), M.mul(M.about(M.mul(M.rotate(r), M.scale(s)), w0[0], w0[1]), this.T0));
        R.selPreview = T;
        R.render();
        return;
      }
      if (!this.rotUnlocked && Math.abs(dr) > 0.18 && A.settings.allowRotate && !A.settings.rotLock && !D.isNotebook()) this.rotUnlocked = true;
      let rot = this.v0.rot + (this.rotUnlocked ? dr : 0);
      const near = Math.round(rot / (Math.PI / 2)) * (Math.PI / 2);
      if (this.rotUnlocked && Math.abs(rot - near) < A.rad(4)) rot = near;
      const zoom = A.settings.zoomLock ? this.v0.zoom : A.clamp(this.v0.zoom * sc, R.ZMIN, R.ZMAX);
      const c = Math.cos(rot) * zoom, s = Math.sin(rot) * zoom;
      const [wx, wy] = this.w0;
      R.setView({ zoom, rot, tx: mid[0] - (c * wx - s * wy), ty: mid[1] - (s * wx + c * wy) });
      Glide.track(mid[0], mid[1]);
      if (touchSession) touchSession.gestureMoved = true;

  /* ---- text tool: tap to type, tap a text box to edit it, drag to set the box width ---- */

  }
  /* ---- laser pointer: a glowing trail that fades, nothing is saved ---- */
  IN.laser = [];

    constructor(rec, s) { this.color = B.slot().color || '#ff3b30'; this.trail = { pts: [{ x: s.x, y: s.y, t: performance.now() }], color: this.color, end: 0 }; IN.laser.push(this.trail); IN.tickLaser(); }

    if (!IN.laser.length) return;

      if (p.length < 1) continue;

    const [wx, wy] = R.toWorld(sx, sy);

    for (let li = D.doc.layers.length - 1; li >= 0; li--) {
      const l = D.doc.layers[li];
      if (!l.visible) continue;

        const it = l.items[i];

  /* ---- artboards: labels above each frame; drag a label to move the artboard, tap it for options ---- */
  const abLabels = () => {
    if (!D.doc || D.isNotebook() || !(D.doc.artboards || []).length) return [];
    const out = [];
    for (const a of D.doc.artboards) {
      const [sx, sy] = R.toScreen(a.x, a.y);
      const txt = `${a.name}  ${(a.w / D.MM / 10).toFixed(1)} × ${(a.h / D.MM / 10).toFixed(1)} cm`;

    }
    up() {
      if (this.begun) { D.commit('all'); return; }
      A.UI.artboardOptions(this.L.a, { x: this.L.x + 40, y: this.L.y + 20 });

  /* zero-lag smoothing (Taubin λ|μ): removes jitter without pulling the line inward or behind the pen;

  IN.smoothStroke = (src, strength) => {
    const n = src.length / 3;

    track(x, y) { const t = performance.now(); this.samples.push([t, x, y]); while (this.samples.length > 2 && t - this.samples[0][0] > 90) this.samples.shift(); },
    reset() { this.samples = []; this.stop(); },
    stop() { if (this.raf) cancelAnimationFrame(this.raf); this.raf = 0; },
    release() {

  /* ---- one finger: drag pans; long-press then move = lasso; long-press and lift = context menu ---- */

      const setHsl = (i, v) => { const c = hsl(); c[i] = i === 0 ? v : v / 100; [hh, ss, vv] = C.rgbToHsv(...C.hslToRgb(...c)); if (i === 0) hh = v; };
      mk('H', 359, () => hh, (v) => setHsl(0, v), () => 'linear-gradient(90deg,' + [0, 60, 120, 180, 240, 300, 360].map((x) => `hsl(${x},90%,50%)`).join(',') + ')');
      mk('S', 100, () => hsl()[1] * 100, (v) => setHsl(1, v), () => { const [H, , L] = hsl(); return `linear-gradient(90deg,hsl(${H},0%,${L * 100}%),hsl(${H},100%,${L * 100}%))`; });
      mk('L', 100, () => hsl()[2] * 100, (v) => setHsl(2, v), () => { const [H, Sx] = hsl(); return `linear-gradient(90deg,#000,hsl(${H},${Sx * 100}%,50%),#fff)`; });
      rows.forEach((r) => r());
      onSync = () => rows.forEach((r) => r());
      return wrap;
    };

    const renderExtra = () => {
      extra.innerHTML = '';

            const ok = await A.dialog({ title: `Delete “${p.name}”?`, body: 'This removes the palette and its colors.', okText: 'Delete', danger: true });

          } }));
        const row = h('div', { class: 'color-row' });
        p.colors.forEach((c, ci) => {
          const b = h('button', { class: 'c', style: { background: c }, 'aria-label': c, title: 'Tap to use · hold to remove' });
          let lp;
          b.addEventListener('pointerdown', () => { lp = setTimeout(() => { lp = null; p.colors.splice(ci, 1); A.saveSettings(); A.emit('palette'); renderExtra(); }, 550); });
          b.addEventListener('pointerup', () => { if (lp) { clearTimeout(lp); setHex(c); } });

        extra.append(name, row);
      });
      extra.append(h('button', { class: 'btn', style: { marginTop: '10px', width: '100%', justifyContent: 'center' }, onclick: async () => {
        const n = await A.dialog({ title: 'New palette', input: 'Palette ' + (S.palettes.length + 1), okText: 'Create' });
        if (!n) return;
        S.palettes.push({ name: n, colors: [current()] }); S.activePalette = S.palettes.length - 1; A.saveSettings(); A.emit('palette'); renderExtra();
      } }, 'New palette'));
    };

    const show = (keep) => {
      if (keep && lastTab === 'sliders' && onSync) { onSync(); return; }
      body.innerHTML = '';
      onSync = null;
      body.append(lastTab === 'swatches' ? renderSwatches() : lastTab === 'wheel' ? renderWheel() : renderSliders());
    };
    cmpNew.style.background = original;
    show();
    renderExtra();
    const pop = A.popover(box, anchor, { side: S.toolSide === 'right' ? 'left' : 'right', onClose: () => { clearTimeout(commitT); if (B.slot().color !== original) UI.pushRecent(B.slot().color); A.saveSettings(); A.emit('slot'); } });
    return pop;
  };
})();

/* Axiom layers panel: thumbnails, visibility, lock, opacity, reorder, focus, auto/manual */
'use strict';
(() => {
  const D = A.D, R = A.R, G = A.G, h = A.h;
  const UI = (A.UI = A.UI || {});
  let host, list;

  const thumb = (layer, cv) => {
    const doc = D.doc;
    const W = 112, H = 84;
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const sc = document.createElement('canvas'); sc.width = W; sc.height = H;
    const bb = D.allBB(doc, false);
    let m;
    if (bb) {
      const bw = Math.max(bb[2] - bb[0], 40), bh = Math.max(bb[3] - bb[1], 30);
      const s = Math.min((W - 10) / bw, (H - 10) / bh, 2);
      m = [s, 0, 0, s, W / 2 - ((bb[0] + bb[2]) / 2) * s, H / 2 - ((bb[1] + bb[3]) / 2) * s];
    } else m = [1, 0, 0, 1, W / 2, H / 2];
    const fake = { paper: doc.paper, layers: [Object.assign({}, layer, { visible: true, opacity: 1 })], focusLayerId: null, precision: doc.precision };
    R.drawScene(ctx, { m, w: W, h: H, doc: fake, bg: doc.paper.bg, grid: false, scratch: sc, sctx: sc.getContext('2d'), dpr: 1 });
  };

  function render() {
    if (!host || host.hidden || !D.doc) return;
    const doc = D.doc;
    list.innerHTML = '';
    const L = doc.layers;
    for (let i = L.length - 1; i >= 0; i--) {
      const l = L[i];
      const cv = h('canvas');
      const row = h('div', {
        class: 'layer' + (l.id === doc.activeLayerId ? ' on' : '') + (!l.visible ? ' hidden-layer' : '') + (doc.focusLayerId === l.id ? ' focus' : ''),
        dataset: { id: l.id, index: i }, role: 'button', tabindex: 0,
      },
      cv,
      h('div', { class: 'grow' }, h('div', { class: 'lname' }, l.name), h('div', { class: 'lmeta' }, `${l.items.length} item${l.items.length === 1 ? '' : 's'}${l.opacity < 1 ? ' · ' + Math.round(l.opacity * 100) + '%' : ''}`)),
      l.locked ? h('button', { class: 'ibtn', title: 'Unlock', 'aria-label': 'Unlock layer', html: A.icon('lock'), onclick: (e) => { e.stopPropagation(); D.setLayer(l.id, { locked: false }, false); } }) : null,
      h('button', { class: 'ibtn', title: l.visible ? 'Hide' : 'Show', 'aria-label': l.visible ? 'Hide layer' : 'Show layer', html: A.icon(l.visible ? 'eye' : 'eyeoff'), onclick: (e) => { e.stopPropagation(); D.setLayer(l.id, { visible: !l.visible }, false); R.render(); } }));
      bindRow(row, l, i);
      list.append(row);
      thumb(l, cv);
    }
    if (doc.precision.grid && doc.paper.grid.type !== 'none') {
      const names = { dot: 'Dot grid', graph: 'Graph paper', lined: 'Lined paper', iso: 'Isometric grid', tri: 'Triangle grid', eng: 'Engineering grid' };
      list.append(h('div', { class: 'layer-grid' }, A.iconEl('gallery'), h('span', { class: 'grow' }, names[doc.paper.grid.type] || 'Grid'),
        h('button', { class: 'ibtn', 'aria-label': 'Hide grid', html: A.icon('eye'), onclick: () => { doc.precision.grid = false; D.changed('precision'); R.render(); render(); A.emit('precision'); } })));
    }
    const auto = A.$('#layers-auto');
    if (auto) auto.classList.toggle('on', doc.layerMode === 'auto');
  }

  function bindRow(row, l, index) {
    let lp = null, dragging = false, startY = 0, lastTap = 0, tapId = 0;
    row.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.ibtn')) return;
      startY = e.clientY;
      lp = setTimeout(() => {
        lp = null; dragging = true;
        row.classList.add('dragging');
        try { row.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      }, 380);
    });
    row.addEventListener('pointermove', (e) => {
      if (lp && Math.abs(e.clientY - startY) > 8) { clearTimeout(lp); lp = null; }
      if (!dragging) return;
      e.preventDefault();
      row.style.transform = `translateY(${e.clientY - startY}px)`;
    });
    const end = (e, cancelled) => {
      if (lp) { clearTimeout(lp); lp = null; if (!cancelled && Math.abs(e.clientY - startY) < 8) tap(); return; }
      if (!dragging) return;
      dragging = false;
      row.classList.remove('dragging');
      row.style.transform = '';
      const rows = [...list.querySelectorAll('.layer')];
      const rh = row.getBoundingClientRect().height + 4;
      const steps = Math.round((e.clientY - startY) / rh);
      const pos = rows.indexOf(row);
      const newPos = A.clamp(pos + steps, 0, rows.length - 1);
      const L = D.doc.layers.length;
      if (newPos !== pos) D.moveLayer(L - 1 - pos, L - 1 - newPos);
      else render();
    };
    const tap = () => {
      const now = performance.now();
      if (now - lastTap < 300) {
        D.doc.focusLayerId = D.doc.focusLayerId === l.id ? null : l.id;
        tapId++;
        D.changed('layers'); R.render(); render();
        lastTap = 0;
        return;
      }
      lastTap = now;
      if (D.doc.activeLayerId !== l.id) {
        D.doc.activeLayerId = l.id;
        D.doc.layerMode = 'manual';
        if (D.doc.focusLayerId) D.doc.focusLayerId = l.id;
        D.changed('layers'); R.render(); render();
      } else { const tok = ++tapId; setTimeout(() => { if (tok === tapId && row.isConnected) openOptions(row, l); }, 300); }
    };
    row.addEventListener('pointerup', (e) => end(e, false));
    row.addEventListener('pointercancel', (e) => end(e, true));
  }

  function openOptions(anchor, l) {
    const box = h('div', { class: 'menu' });
    const item = (icon, label, fn, cls) => {
      const b = h('button', { class: cls || '', onclick: () => { A.closePopovers(); fn(); } });
      b.innerHTML = A.icon(icon); b.append(label);
      box.append(b);
    };
    box.append(h('div', { class: 'sub' }, l.name));
    item('selectall', 'Select all on layer', () => { A.emit('tool:select'); A.SEL.set(l.items.map((it) => it.id)); });
    item('rename', 'Rename', async () => { const n = await A.dialog({ title: 'Rename layer', input: l.name, okText: 'Rename' }); if (n) D.setLayer(l.id, { name: n.slice(0, 60) }); });
    const op = h('input', { type: 'range', min: 0, max: 100, value: Math.round(l.opacity * 100), id: 'layer-opacity' });
    const opv = h('b', { class: 'num' }, Math.round(l.opacity * 100) + '%');
    let began = false;
    op.addEventListener('input', () => { if (!began) { D.begin(); began = true; } D.setLayer(l.id, { opacity: +op.value / 100 }, false); opv.textContent = op.value + '%'; R.render(); });
    op.addEventListener('change', () => { if (began) { D.commit('layers'); began = false; } });
    box.append(h('div', { style: { padding: '6px 10px' } }, h('div', { class: 'row between small muted' }, h('span', null, 'Opacity'), opv), op));
    item(l.locked ? 'unlock' : 'lock', l.locked ? 'Unlock' : 'Lock', () => D.setLayer(l.id, { locked: !l.locked }));
    item('focus', D.doc.focusLayerId === l.id ? 'Exit focus' : 'Focus (fade others)', () => { D.doc.focusLayerId = D.doc.focusLayerId === l.id ? null : l.id; D.changed('layers'); R.render(); render(); });
    item('duplicate', 'Duplicate', () => D.duplicateLayer(l.id));
    item('merge', 'Merge down', () => D.mergeDown(l.id));
    box.append(h('hr'));
    item('clear', 'Clear layer', async () => { if (await A.dialog({ title: 'Clear this layer?', body: 'All strokes on it are removed. You can undo this.', okText: 'Clear', danger: true })) D.clearLayer(l.id); }, 'danger');
    item('trash', 'Delete layer', async () => { if (await A.dialog({ title: `Delete “${l.name}”?`, body: 'You can undo this.', okText: 'Delete', danger: true })) D.deleteLayer(l.id); }, 'danger');
    A.popover(box, anchor, { side: 'left' });
  }

  const debounced = A.debounce(render, 450);
  UI.mountLayers = (el) => {
    host = el;
    const auto = h('button', { class: 'ibtn', id: 'layers-auto', title: 'Automatic layers: each tool draws on its own layer', 'aria-label': 'Automatic layers', html: A.icon('auto') });
    auto.addEventListener('click', () => {
      D.doc.layerMode = D.doc.layerMode === 'auto' ? 'manual' : 'auto';
      A.toast(D.doc.layerMode === 'auto' ? 'Automatic layers: each tool gets its own layer' : 'Manual layers: you draw on the active layer');
      D.changed('layers'); render();
    });
    host.append(h('div', { class: 'layers-head' }, h('h4', null, 'Layers'), auto,
      h('button', { class: 'ibtn', title: 'New layer', 'aria-label': 'New layer', html: A.icon('plus'), onclick: () => D.addLayer() })));
    list = h('div', { class: 'layer-list' });
    host.append(list);
    A.on('layers', render);
    A.on('layers:thumbs', debounced);
    A.on('doc:changed', (k) => { if (k === 'all' || k === 'layers') render(); else debounced(); });
  };
  UI.renderLayers = render;
})();

  function renderSelPopup() {
    if (!selPop) return;
    const c = R.sel.size && !R.selPreview ? A.SEL.screenCorners() : null;
    if (!c) { selPop.hidden = true; return; }
    selPop.hidden = false;
    if (!selPop.childElementCount) {
      const ib = (icon, title, fn) => { const b = h('button', { class: 'ibtn', title, 'aria-label': title, html: A.icon(icon) }); b.addEventListener('click', (e) => fn(e.currentTarget)); return b; };
      selPop.append(
        ib('duplicate', 'Duplicate', () => A.emit('cmd', 'duplicate')),
        ib('copy', 'Copy', () => A.emit('cmd', 'copy')),
        ib('trash', 'Delete', () => A.emit('cmd', 'delete')),
        ib('spark', 'Ask the tutor about this', () => A.emit('cmd', 'askTutor')),
        (() => { const b = ib('crop', 'Crop picture', () => A.CROP.start()); b.classList.add('sp-crop'); return b; })(),
        h('div', { class: 'sb-sep' }),

    const ys = c.map((p) => p[1]), xs = c.map((p) => p[0]);

    const stage = A.$('#stage').getBoundingClientRect();
    // prefer above the selection (clear of the rotation handle), else below, never over the bottom bars
    let y = Math.min(...ys) - r.height - 48;
    if (y < stage.top + 66) y = Math.max(...ys) + 18;
    y = A.clamp(y, stage.top + 66, stage.bottom - r.height - 84);
    const x = A.clamp((Math.min(...xs) + Math.max(...xs)) / 2 - r.width / 2, stage.left + 76, stage.right - r.width - 76);
    selPop.style.left = x + 'px';

  function moveToMenu(anchor) {
    const box = h('div', { class: 'menu' });

    [...D.doc.layers].reverse().forEach((l) => box.append(h('button', { onclick: () => { A.closePopovers(); moveSelTo(l.id); } }, l.name)));
    box.append(h('hr'), h('button', { onclick: () => { A.closePopovers(); const l = D.addLayer(); moveSelTo(l.id); } }, 'New layer'));

  function moveSelTo(layerId) {
    D.begin();
    const items = A.SEL.items().map((x) => x.it);

  /* ================= commands ================= */
  const selItems = () => A.SEL.items().map((x) => x.it);
  const writeClip = (items) => {
    A.clip = { items: JSON.parse(JSON.stringify(items)) };
    try { localStorage.setItem('axiom.clip', JSON.stringify(A.clip)); } catch (e) { /* too big or blocked */ }
    renderSelMenu();
  };
  const cmds = {
    undo() { if (A.PK && A.PK.active) A.PK.undo(); else D.undo(); },
    redo() { if (A.PK && A.PK.active) A.PK.redo(); else D.redo(); },
    selectAll() {
      const ids = [];
      for (const l of D.doc.layers) if (l.visible && !l.locked && (!A.IN.selLayerOnly || l.id === D.doc.activeLayerId)) for (const it of l.items) if (B.isBox(it) || !B.catalog[it.b].mask) ids.push(it.id);
      A.SEL.set(ids);
    },
    copy() { if (!R.sel.size) return; writeClip(selItems()); A.toast(`Copied ${R.sel.size}`); },
    cut() { if (!R.sel.size) return; writeClip(selItems()); cmds.delete(); },
    paste(at) {
      if (!A.clip || !A.clip.items || !A.clip.items.length) return A.toast('Nothing to paste');
      const items = A.clip.items.map((it) => Object.assign({}, it, { id: A.uid() }));
      let bb = null; items.forEach((it) => (bb = G.bbUnion(bb, it.bb)));
      const [cx, cy] = R.toWorld(R.w / 2, R.h / 2);
      const vis = R.visibleBB();
      const onScreen = G.bbHit(bb, vis);
      const T = Array.isArray(at) ? M.translate(at[0] - (bb[0] + bb[2]) / 2, at[1] - (bb[1] + bb[3]) / 2)
        : onScreen ? M.translate(24 / D.doc.view.zoom, 24 / D.doc.view.zoom) : M.translate(cx - (bb[0] + bb[2]) / 2, cy - (bb[1] + bb[3]) / 2);
      const moved = items.map((it) => D.transformItem(it, T, false));
      let l = D.active();
      if (l.locked) l = D.addLayer();
      D.begin(); D.addItems(moved, l); D.commit();
      A.SEL.set(moved.map((i) => i.id));
      A.emit('layers:thumbs');
    },
    duplicate() {
      if (!R.sel.size) return;
      const z = D.doc.view.zoom, T = M.translate(20 / z, 20 / z);
      D.begin();
      const ids = [];
      for (const l of D.doc.layers) {
        const add = [];
        for (const it of l.items) if (R.sel.has(it.id)) { const n = D.transformItem(it, T, false); add.push(n); ids.push(n.id); }
        if (add.length) l.items = l.items.concat(add);
      }
      D.commit();
      A.SEL.set(ids);
    },
    delete() {
      if (!R.sel.size) return;
      D.begin(); D.removeIds(R.sel); D.commit();
      A.emit('selection:clear'); R.render(); A.emit('layers:thumbs');
    },
    flipH() { flip(-1, 1); },
    flipV() { flip(1, -1); },
    recolor() {
      if (!R.sel.size) return;
      const col = B.slot().color;
      D.begin();
      const map = new Map(), ids = [];
      for (const it of selItems()) { if (it.t !== 's') { ids.push(it.id); continue; } const n = Object.assign({}, it, { id: A.uid(), c: col }); map.set(it.id, [n]); ids.push(n.id); }
      D.replace(map); D.commit(); A.SEL.set(ids);
    },
    front() { reorder(true); },
    back() { reorder(false); },
    export() { UI.openExport(); },
    resetView() { R.zoomAt(R.w / 2, R.h / 2, 1 / D.doc.view.zoom, -D.doc.view.rot); },
    fit() { R.fitBB(D.allBB()); },
    toggleGrid() { D.doc.precision.grid = !D.doc.precision.grid; D.changed('precision'); R.render(); renderPrecision(); UI.renderLayers(); },
    saveVisual() { A.V.saveSelection(); },
    askTutor() { const a = A.AI.shotSelection(); if (a) { A.AI.attach(a); A.ST.showTutor(); } },
    toggleUI() { A.$('#canvas-view').classList.toggle('ui-hidden'); A.closePopovers(); },
    toggleLayers() { toggleLayers(); },
    togglePrecision() { togglePrecision(); },
  };
  function flip(sx, sy) {
    if (!R.sel.size || !A.SEL.box) return;
    const bb = A.SEL.box, cx = (bb[0] + bb[2]) / 2, cy = (bb[1] + bb[3]) / 2;
    const T = M.about(M.scale(sx, sy), cx, cy);
    D.begin();
    const map = new Map(), ids = [];
    for (const it of selItems()) { const n = D.transformItem(it, T, false); map.set(it.id, [n]); ids.push(n.id); }
    D.replace(map); D.commit(); A.SEL.set(ids);
  }
  function reorder(toFront) {
    D.begin();
    for (const l of D.doc.layers) {
      const sel = l.items.filter((it) => R.sel.has(it.id));
      if (!sel.length) continue;
      const rest = l.items.filter((it) => !R.sel.has(it.id));
      l.items = toFront ? rest.concat(sel) : sel.concat(rest);

    D.commit(); R.render();
  }

  /* ================= import ================= */
  const pickFile = (accept) => new Promise((res) => {
    const inp = h('input', { type: 'file', accept, style: { display: 'none' } });
    inp.addEventListener('change', () => { res(inp.files && inp.files[0]); inp.remove(); });
    document.body.append(inp);
    inp.click();
  });
  const readAs = (file, how) => new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error);
    how === 'text' ? fr.readAsText(file) : how === 'buffer' ? fr.readAsArrayBuffer(file) : fr.readAsDataURL(file);
  });
  const loadImg = (src) => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });

  function importMenu(anchor) {
    const box = h('div', { class: 'menu' });
    const it = (icon, label, fn) => { const b = h('button', { onclick: () => { A.closePopovers(); fn(); } }); b.innerHTML = A.icon(icon); b.append(label); box.append(b); };
    it('image', 'Image or photo', async () => { const f = await pickFile('image/*'); if (f) UI.importImageFile(f); });
    it('pdf', 'PDF (problem sheet, notes)', async () => { const f = await pickFile('application/pdf,.pdf'); if (f) UI.importPdf(f); });
    it('book', 'Open in study panel (PDF or photo)', async () => { const f = await A.ST.pickFile(); if (!f) return; const m = await A.ST.importFile(f); if (m) A.ST.openDoc(m.id); });
    it('paste', 'Paste strokes', () => cmds.paste());
    A.popover(box, anchor, { side: 'down' });
  }
  UI.importImageFile = async (file, at) => {
    try {
      let src = await readAs(file, 'url');
      const im = await loadImg(src);
      let w = im.naturalWidth, hh = im.naturalHeight;
      const MAX = 2400;
      if (Math.max(w, hh) > MAX) {
        const k = MAX / Math.max(w, hh);
        const c = h('canvas'); c.width = Math.round(w * k); c.height = Math.round(hh * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        src = c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.88);
        w = c.width; hh = c.height;
      }
      const img = placeImage(src, w, hh);
      if (Array.isArray(at)) {
        const bb = img.bb, T = M.translate(at[0] - (bb[0] + bb[2]) / 2, at[1] - (bb[1] + bb[3]) / 2);
        D.begin(); D.replace(new Map([[img.id, [D.transformItem(img, T)]]])); D.commit(); R.render();
      }
    } catch (e) { A.toast('That image could not be read'); }
  };
  function placeImage(src, w, hh, opts = {}) {
    const z = D.doc.view.zoom;
    const target = opts.width || Math.min(w, (R.w * 0.55) / z);
    const s = target / w;

  const loadScript = (src) => new Promise((res, rej) => { const s = h('script', { src }); s.onload = res; s.onerror = rej; document.head.append(s); });
  UI.importPdf = async (file) => {
    A.toast('Opening PDF…', 2500);
    try {
      const lib = await A.ST.pdfLib();
      const buf = await readAs(file, 'buffer');
      const pdf = await lib.getDocument({ data: new Uint8Array(buf) }).promise;
      const doc = D.doc;
      const nb = D.isNotebook(doc);
      const n = Math.min(pdf.numPages, nb ? 400 : 60);
      const render = async (p) => {
        const page = await pdf.getPage(p);
        const vp1 = page.getViewport({ scale: 1 });
        const vp = page.getViewport({ scale: Math.min(2, 2400 / vp1.width) });
        const c = h('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        await page.render({ canvasContext: ctx, viewport: vp }).promise;
        return { c, w1: vp1.width * (96 / 72), src: c.toDataURL('image/jpeg', 0.86) };
      };
      D.begin();
      let layer = doc.layers.find((l) => l.pdfLayer);
      if (!layer) {
        layer = D.newLayer(nb ? 'Imported pages' : 'PDF · ' + file.name.replace(/\.pdf$/i, '').slice(0, 28));
        layer.pdfLayer = true;
        const idx = doc.layers.findIndex((l) => l.id === doc.activeLayerId);
        doc.layers.splice(Math.max(0, idx), 0, layer); // below the active layer, so you can write on top
        if (doc.activeLayerId === layer.id) doc.activeLayerId = doc.layers[doc.layers.length - 1].id;
      }
      const items = [];
      if (nb) {
        // each PDF page becomes a notebook page (inserted after the current page, blank template)
        let at = R.currentPage();
        const curEmpty = !doc.layers.some((l) => l.items.some((it) => D.pageAt(doc, (it.bb[0] + it.bb[2]) / 2, (it.bb[1] + it.bb[3]) / 2) === at));
        if (!curEmpty) at += 1;
        const [pw, ph] = D.pageSize(doc);
        D.commit('all');
        for (let p = 1; p <= n; p++) {
          const r = await render(p);
          if (!(p === 1 && curEmpty)) D.insertPage(at + p - 1, { template: 'blank' }); else D.setPage(at, { template: 'blank' });
          const rc = D.pageRect(doc, at + p - 1);
          const s = Math.min(pw / r.c.width, ph / r.c.height);
          const x = rc[0] + (pw - r.c.width * s) / 2, y = rc[1] + (ph - r.c.height * s) / 2;
          const it = { id: A.uid(), t: 'i', src: r.src, iw: r.c.width, ih: r.c.height, m: [s, 0, 0, s, x, y], o: 1, pdfPage: p };
          it.bb = B.imageBB(it);
          D.begin(); layer.items = layer.items.concat([it]); D.commit('all');
          if (p % 3 === 0) A.toast(`Page ${p} of ${n}`, 900);
        }
        layer.locked = true;
        A.emit('layers'); A.emit('pages');
        R.showPage(at, true);
        A.toast(`Added ${n} page${n === 1 ? '' : 's'}. Write on them with any pen.`);
        return;
      }
      const [x0, y0] = R.toWorld(R.w * 0.2, R.h * 0.14);
      let y = y0;
      for (let p = 1; p <= n; p++) {
        const r = await render(p);
        const s = r.w1 / r.c.width;
        const it = { id: A.uid(), t: 'i', src: r.src, iw: r.c.width, ih: r.c.height, m: [s, 0, 0, s, x0, y], o: 1 };
        it.bb = B.imageBB(it);
        items.push(it);
        y += r.c.height * s + 40;
        if (p % 3 === 0) A.toast(`Page ${p} of ${n}`, 900);
      }
      layer.items = layer.items.concat(items);
      layer.locked = true;
      D.commit('layers');
      A.emit('layers');
      R.fitBB(items.length ? items[0].bb : null, 40);
      A.toast(`Imported ${n} page${n === 1 ? '' : 's'} on a locked layer`);
    } catch (e) {
      console.error(e);
      D.cancel();
      A.toast('The PDF could not be opened.', 3500);
    }
  };

  /* ================= export ================= */
  /* pages: [{bytes (JPEG), pw, ph (points), iw, ih (pixels)}] */
  function makePdf(pages) {
    const enc = new TextEncoder();
    const chunks = []; let len = 0; const offs = [];
    const push = (x) => { const b = typeof x === 'string' ? enc.encode(x) : x; chunks.push(b); len += b.length; };
    const obj = (n, body) => { offs[n] = len; push(`${n} 0 obj\n`); body(); push('\nendobj\n'); };
    push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    const N = pages.length;
    const pageObj = (i) => 3 + i * 3;
    obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
    obj(2, () => push(`<< /Type /Pages /Kids [${pages.map((_, i) => pageObj(i) + ' 0 R').join(' ')}] /Count ${N} >>`));
    pages.forEach((pg, i) => {
      const po = pageObj(i);
      obj(po, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pg.pw} ${pg.ph}] /Resources << /XObject << /Im0 ${po + 1} 0 R >> >> /Contents ${po + 2} 0 R >>`));
      obj(po + 1, () => { push(`<< /Type /XObject /Subtype /Image /Width ${pg.iw} /Height ${pg.ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.bytes.length} >>\nstream\n`); push(pg.bytes); push('\nendstream'); });
      const content = `q ${pg.pw} 0 0 ${pg.ph} 0 0 cm /Im0 Do Q`;
      obj(po + 2, () => push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`));
    });
    const total = 3 + N * 3;
    const xref = len;
    let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
    for (let i = 1; i < total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
    push(x + `trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
    const out = new Uint8Array(len); let o = 0;
    for (const c of chunks) { out.set(c, o); o += c.length; }
    return out;
  }
  function makeSvg(doc, bb, withBg, onlyIds) {
    const defs = [];
    const w = bb[2] - bb[0], hh = bb[3] - bb[1];
    let body = '';
    if (withBg) body += `<rect x="${bb[0]}" y="${bb[1]}" width="${w}" height="${hh}" fill="${doc.paper.bg}"/>`;
    doc.layers.forEach((l, li) => {
      if (!l.visible) return;
      const items = l.items.filter((it) => !onlyIds || onlyIds.has(it.id));
      if (!items.length) return;
      const masks = items.filter((it) => it.t === 's' && B.catalog[it.b].mask);
      const normal = items.filter((it) => !(it.t === 's' && B.catalog[it.b].mask));
      let attrs = l.opacity < 1 ? ` opacity="${l.opacity}"` : '';
      if (masks.length) {
        const id = 'mask' + li;
        defs.push(`<mask id="${id}" maskUnits="userSpaceOnUse" x="${bb[0]}" y="${bb[1]}" width="${w}" height="${hh}"><rect x="${bb[0]}" y="${bb[1]}" width="${w}" height="${hh}" fill="#fff"/>${masks.map((m) => B.itemSvg(m, defs)).join('')}</mask>`);
        attrs += ` mask="url(#${id})"`;
      }
      body += `<g id="${String(l.name).replace(/[^\w-]+/g, '_')}"${attrs}>${normal.map((it) => B.itemSvg(it, defs)).join('')}</g>`;
    });
    return `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(w)}" height="${Math.round(hh)}" viewBox="${bb[0]} ${bb[1]} ${w} ${hh}"><defs>${defs.join('')}</defs>${body}</svg>`;
  }
  const safeName = (n) => (n || 'drawing').replace(/[\\/:*?"<>|]+/g, '-').slice(0, 60);

  function regionBB(st) {
    const doc = D.doc;
    if (st.region === 'selection' && R.sel.size) return A.SEL.box;
    if (st.region === 'view') return R.visibleBB();
    if (st.region === 'page') return D.pageRect(doc, R.currentPage());
    if (st.region === 'pages') return D.pageRect(doc, 0);
    if (st.region.startsWith('ab:')) { const a = (doc.artboards || []).find((x) => 'ab:' + x.id === st.region); if (a) return [a.x, a.y, a.x + a.w, a.y + a.h]; }

    return bb ? [bb[0] - 24, bb[1] - 24, bb[2] + 24, bb[3] + 24] : null;

  UI.quickExportPdf = () => doExport({ fmt: 'pdf', region: 'pages', ppi: 200, bg: true, grid: false });
  async function doExport(st) {
    const doc = D.doc;
    const name = safeName(doc.name);
    if (st.fmt === 'axiom') {
      const blob = new Blob([JSON.stringify(Object.assign({ format: 'axiom', version: 1 }, doc))], { type: 'application/json' });
      return A.deliverFile(blob, name + '.axiom');
    }
    const onlyIds = st.region === 'selection' && R.sel.size ? new Set(R.sel) : null;
    const scale = (st.ppi || 192) / 96;
    // a list of world rectangles: several for "All pages"
    const rects = st.region === 'pages' ? (D.isNotebook(doc) ? D.pageRects(doc).filter((rc, i) => i < doc.pages.length - 1 || doc.layers.some((l) => l.items.some((it) => G.bbHit(it.bb, rc)))) : []) : [regionBB(st)];
    if (!rects.length || !rects[0]) throw new Error('the drawing is empty');
    if (st.fmt === 'svg') {
      const svg = makeSvg(doc, rects[0], st.bg, onlyIds);
      return A.deliverFile(new Blob([svg], { type: 'image/svg+xml' }), name + '.svg');
    }
    const renderOne = (bb) => R.renderRegion(doc, bb, scale, { bg: st.fmt !== 'png' || st.bg, grid: st.grid, onlyIds, maxPx: 12000 });
    if (st.fmt === 'png' || st.fmt === 'jpg') {
      const canvas = renderOne(rects[0]);
      const type = st.fmt === 'png' ? 'image/png' : 'image/jpeg';
      const blob = await new Promise((r) => canvas.toBlob(r, type, 0.92));
      return A.deliverFile(blob, name + '.' + st.fmt, canvas.toDataURL(type, 0.92));
    }
    const pages = [];
    for (let i = 0; i < rects.length; i++) {
      const bb = rects[i];
      const canvas = renderOne(bb);
      const jpg = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.9));
      pages.push({ bytes: new Uint8Array(await jpg.arrayBuffer()), pw: Math.round((bb[2] - bb[0]) * 0.75), ph: Math.round((bb[3] - bb[1]) * 0.75), iw: canvas.width, ih: canvas.height });
      if (rects.length > 4 && i % 4 === 3) A.toast(`Page ${i + 1} of ${rects.length}`, 700);
    }
    return A.deliverFile(new Blob([makePdf(pages)], { type: 'application/pdf' }), name + '.pdf');
  }

  async function bookText(b, budget) {
    const meta = A.ST.doc(b.docId);
    if (!meta) return '';
    try {
      const pdf = await A.ST.loadPdf(meta);
      let out = '';
      for (let n = b.from; n <= Math.min(b.to, pdf.numPages) && out.length < budget; n++) {
        const tc = await (await pdf.getPage(n)).getTextContent();
        out += `\n[p. ${n}]\n` + tc.items.map((it) => it.str).join(' ').replace(/\s+/g, ' ');

  const shotNotebook = async (id, max = 8) => {

      g.z = A.clamp(g.z0 * m.d / g.d0, 0.5, 4); g.x = m.x; g.y = m.y;
      inner.style.transform = `translate(${m.x - g.x0}px, ${m.y - g.y0}px) scale(${g.z / g.z0})`;
    });
    const end = (e) => {
      if (!pts.delete(e.pointerId) || !g || pts.size >= 2) return;
      const done = g; g = null; pts.clear();
      inner.style.transform = ''; inner.style.willChange = '';
      if (Math.abs(done.z - done.z0) < 0.02 && Math.hypot(done.x - done.x0, done.y - done.y0) < 4) return;
      st.zoom = done.z;
      layout(false);
      if (done.anchor) restoreAnchor(Object.assign({}, done.anchor, { cx: done.x, cy: done.y }));
    };
    main.addEventListener('pointerup', end); main.addEventListener('pointercancel', end);
  }
  RD.close = (silent) => {
    if (!st) return;
    leavePK();
    try { st.io && st.io.disconnect(); } catch (e) { /* ignore */ }
    try { if (st.rendition) st.rendition.destroy(); } catch (e) { /* ignore */ }
    if (st.book) { const bk = st.book; Promise.resolve(bk.ready).catch(() => {}).then(() => { try { bk.destroy(); } catch (e) { /* ignore */ } }); }
    saveAnn.flush && saveAnn.flush();
    const d = A.ST.doc(st.meta.id); if (d) { d.lastPage = st.page; d.lastRead = Date.now(); A.saveSettings(); }
    st = null;
    host.hidden = true;
    host.innerHTML = '';
    void silent;
  };
  RD.isOpen = () => !!st;
  RD.mount = (el) => {
    host = el;
    addEventListener('resize', () => { if (st) { applyWidth(); layout(); if (rpk.on) A.PK.post({ op: 'pkFrame', frame: mainFrame(), insets: pkInsets() }); } });
    addEventListener('keydown', (e) => {
      if (!st || /INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || '')) return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') { goto(st.page + 1); e.preventDefault(); }
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') { goto(st.page - 1); e.preventDefault(); }
      if (e.key === 'Escape') { st.focus = null; clearActions(); redrawAll(); }
    });
  };
})();

/* ---- textedit.js ---- */
/* Axiom text boxes and sticky notes: an editor laid over the canvas, with a small format bar */
'use strict';
(() => {
  const D = A.D, R = A.R, B = A.B, h = A.h;
  const S = A.settings;
  const TE = (A.TE = {});
  let stage = null, ed = null;
  const COLORS = ['#16181d', '#1f4fbf', '#c0392b', '#1e8449', '#7d3cff', '#e67e22'];
  const STICKY = [null, '#fff1a8', '#ffd6e0', '#cdeffd', '#d7f5d0', '#e8dcff'];

  TE.mount = (el) => {
    stage = el;
    A.on('canvas:down', () => { if (ed) TE.commit(); });
    document.addEventListener('pointerdown', (e) => { if (ed && !e.target.closest('.te-area, .te-bar, .popover, #overlay')) TE.commit(); }, true);
    A.on('view', () => { if (ed) place(); });
    A.on('doc:close', () => { if (ed) TE.commit(); });
  };
  TE.active = () => !!ed;

  const textSlot = () => { const s = B.slot(); return s && s.b === 'text' ? s : (S.slots.find((x) => x.b === 'text') || { color: '#16181d', size: 20, font: 'sans' }); };

  TE.create = (x, y, width, opts = {}) => {
    const sl = textSlot();
    const zoom = D.doc.view.zoom;
    let iw = width && width > 40 ? width : Math.min(420, Math.max(220, (R.w * 0.4) / zoom));
    if (D.isNotebook()) {
      // keep the box on the page
      const i = D.pageAt(D.doc, x, y), rc = D.pageRect(D.doc, i);
      x = A.clamp(x, rc[0] + 8, rc[2] - 60);
      iw = Math.min(iw, rc[2] - 12 - x);
    }
    const item = B.makeText(Object.assign({ text: '', fs: opts.fs || sl.size || 20, font: sl.font || 'sans', c: sl.color || '#16181d', iw, m: [1, 0, 0, 1, x, y - (opts.fs || sl.size || 20) * 0.6] }, opts));
    open(item, true);
  };
  TE.edit = (item) => open(item, false);

  function open(item, isNew) {
    if (ed) TE.commit();
    const ta = h('textarea', { class: 'te-area', spellcheck: 'true', 'aria-label': 'Text box' });
    ta.value = item.text || '';
    const bar = h('div', { class: 'te-bar panel' });
    ed = { item: Object.assign({}, item), isNew, ta, bar };
    R.hideId = isNew ? null : item.id;
    R.render();
    ta.addEventListener('input', () => { ed.item.text = ta.value; place(); });
    ta.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.preventDefault(); TE.commit(); }
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); TE.commit(); }
      e.stopPropagation();
    });
    stage.append(ta);
    stage.parentElement.append(bar);
    drawBar();
    place();
    setTimeout(() => { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 30);
  }

  /* one quiet bar: font, size, bold, colour (with sticky-note papers inside), done */
  const FONT_NAMES = { sans: 'Sans', serif: 'Serif', mono: 'Mono', round: 'Round' };
  function drawBar() {
    const it = ed.item, bar = ed.bar;
    bar.innerHTML = '';
    const upd = (patch) => { Object.assign(ed.item, patch); drawBar(); place(); ed.ta.focus(); };
    const keys = Object.keys(B.FONTS);
    const font = h('button', { class: 'te-font', style: { fontFamily: B.FONTS[it.font] }, title: 'Font', onclick: () => upd({ font: keys[(keys.indexOf(it.font) + 1) % keys.length] }) }, FONT_NAMES[it.font] || 'Sans');
    const dot = h('button', { class: 'te-sw', style: { background: it.bg || B.col(it.c) }, 'aria-label': 'Colour and paper' });
    dot.addEventListener('click', () => {
      const box = h('div', { class: 'menu te-colors' });
      const row1 = h('div', { class: 'nb-sw' }), row2 = h('div', { class: 'nb-sw' });
      COLORS.forEach((c) => row1.append(h('button', { class: 'nb-swatch' + (!it.bg && it.c === c ? ' on' : ''), style: { background: c }, 'aria-label': 'Text ' + c, onclick: () => { A.closePopovers(); upd({ c, bg: undefined }); } })));
      STICKY.filter(Boolean).forEach((c) => row2.append(h('button', { class: 'nb-swatch sq' + (it.bg === c ? ' on' : ''), style: { background: c }, 'aria-label': 'Sticky note ' + c, onclick: () => { A.closePopovers(); upd({ bg: c }); } })));
      box.append(h('div', { class: 'sub' }, 'Text'), row1, h('div', { class: 'sub' }, 'Sticky note'), row2);
      A.popover(box, dot, { side: 'down' });
    });
    bar.append(font,
      h('button', { class: 'ibtn', 'aria-label': 'Smaller', onclick: () => upd({ fs: Math.max(8, Math.round(it.fs / 1.15)) }) }, '−'),
      h('span', { class: 'te-fs num' }, String(Math.round(it.fs))),
      h('button', { class: 'ibtn', 'aria-label': 'Larger', onclick: () => upd({ fs: Math.min(160, Math.round(it.fs * 1.15)) }) }, '+'),
      h('button', { class: 'ibtn' + (it.bold ? ' on' : ''), 'aria-label': 'Bold', style: { fontWeight: 800 }, onclick: () => upd({ bold: !it.bold }) }, 'B'),
      dot,
      h('button', { class: 'ibtn', 'aria-label': 'Delete text box', html: A.icon('trash'), onclick: () => { ed.item.text = ''; TE.commit(); } }),
      h('button', { class: 'te-done', onclick: () => TE.commit() }, 'Done'));
  }

  function place() {
    if (!ed) return;
    const it = ed.item;
    const zoom = D.doc.view.zoom;
    const k = Math.sqrt(Math.abs(A.M.det(it.m))) * zoom;
    const [sx, sy] = R.toScreen(it.m[4], it.m[5]);
    const pad = B.textPad(it);
    const L = B.layoutText(Object.assign({}, it, { text: it.text || ' ' }));
    const ta = ed.ta;
    Object.assign(ta.style, {
      left: sx + 'px', top: sy + 'px', width: it.iw * k + 'px', height: Math.max(L.h, it.fs * 1.6) * k + 'px',
      font: `${it.bold ? 700 : 400} ${it.fs * k}px/${1.36} ${B.FONTS[it.font] || B.FONTS.sans}`,
      padding: `${pad * k + it.fs * k * 0.02}px ${pad * k}px`, color: it.bg ? '#2a2620' : B.col(it.c),
      background: it.bg || 'transparent', borderRadius: it.bg ? 6 * k + 'px' : '4px',
    });
    const bar = ed.bar, br = stage.getBoundingClientRect();
    bar.style.left = A.clamp(sx, 10, br.width - 520) + 'px';
    bar.style.top = Math.max(64, sy - 54) + 'px';
  }

  TE.commit = () => {
    if (!ed) return;
    const { item, isNew, ta, bar } = ed;
    ed = null;
    ta.remove(); bar.remove();
    R.hideId = null;
    const text = String(item.text || '').replace(/\s+$/, '');
    if (!text) {
      if (!isNew) { D.begin(); D.removeIds([item.id]); D.commit(); }
      R.render();
      return;
    }
    const next = B.makeText(Object.assign({}, item, { id: isNew ? item.id : A.uid(), text }));
    const stamp = A.IN.stamp && A.IN.stamp();
    if (stamp && isNew) Object.assign(next, stamp);
    D.begin();
    if (isNew) {
      let l = D.active();
      if (l.locked || !l.visible) l = D.doc.layers.slice().reverse().find((x) => !x.locked && x.visible) || D.addLayer();
      D.addItems([next], l);
    } else D.replace(new Map([[item.id, [next]]]));
    D.commit();
    R.render();
    A.emit('layers:thumbs');
  };
})();

  };

  const family = (b) => (b === 'highlighter' || b === 'marker' ? 'highlighter' : b === 'eraser' || b === 'slice' ? 'eraser' : b === 'tape' ? 'tape' : b === 'laser' ? 'laser' : b === 'text' ? 'text' : b === 'select' ? 'select' : 'pen');

  /* ---------- mount / lifecycle ---------- */
  NB.mount = (el) => {

/* ---- crop.js ---- */
/* Cropping pictures on the page (photos, PDF pages, Desmos graphs): the full picture is kept, the crop is a
   rectangle in the picture's own units that can be changed or removed later. */
'use strict';
(() => {
  const D = A.D, R = A.R, B = A.B, M = A.M, h = A.h;
  const CR = (A.CROP = {});
  const MIN = 8; // smallest crop, in picture units

  /* the uncropped picture: its size and placement */
  const original = (it) => {
    const c = it.crop;
    if (!c) return { iw: it.iw, ih: it.ih, m: it.m.slice(), rect: [0, 0, it.iw, it.ih] };
    return { iw: c.iw0, ih: c.ih0, m: M.mul(it.m, [1, 0, 0, 1, -c.x, -c.y]), rect: [c.x, c.y, c.x + c.w, c.y + c.h] };
  };
  /* apply a crop rectangle [x0, y0, x1, y1] (picture units of the original); a full rectangle removes the crop */
  const apply = (it, o, r) => {
    const full = r[0] <= 0.5 && r[1] <= 0.5 && r[2] >= o.iw - 0.5 && r[3] >= o.ih - 0.5;
    const next = Object.assign({}, it, { iw: r[2] - r[0], ih: r[3] - r[1], m: M.mul(o.m, [1, 0, 0, 1, r[0], r[1]]) });
    if (full) { delete next.crop; next.iw = o.iw; next.ih = o.ih; next.m = o.m; }
    else next.crop = { x: r[0], y: r[1], w: r[2] - r[0], h: r[3] - r[1], iw0: o.iw, ih0: o.ih };
    next.bb = B.imageBB(next);
    return next;
  };
  CR.canCrop = () => {
    if (R.sel.size !== 1 || !D.doc) return null;
    const id = [...R.sel][0];
    for (const l of D.doc.layers) for (const it of l.items) if (it.id === id && it.t === 'i' && !l.locked) return it;
    return null;
  };

  let ui = null;
  CR.start = (item = CR.canCrop()) => {
    if (!item || ui) return;
    const o = original(item);
    const T = M.mul(R.matrix(), o.m); // picture units -> stage pixels
    if (Math.abs(T[1]) > 1e-3 * Math.abs(T[0]) || Math.abs(T[2]) > 1e-3 * Math.abs(T[3])) { A.toast('Straighten the picture (rotation 0°) to crop it.'); return; }
    const stage = A.$('#stage').getBoundingClientRect();
    const sx = T[0], sy = T[3], ox = T[4] + stage.left, oy = T[5] + stage.top;
    const toScr = (x, y) => [ox + x * sx, oy + y * sy];
    const r = o.rect.slice();
    A.emit('selection:clear');
    R.hideId = item.id; R.render();
    const back = h('div', { class: 'crop-ui' });
    const img = h('img', { class: 'crop-img', src: item.src, alt: '' });
    const shade = h('div', { class: 'crop-shade' });
    const box = h('div', { class: 'crop-box' });
    const handles = ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'].map((k) => { const d = h('div', { class: 'crop-h h-' + k, dataset: { k } }); box.append(d); return d; });
    const bar = h('div', { class: 'crop-bar panel' },
      h('button', { class: 'btn ghost-btn', onclick: () => finish(false) }, 'Cancel'),
      h('button', { class: 'btn ghost-btn', onclick: () => { r[0] = 0; r[1] = 0; r[2] = o.iw; r[3] = o.ih; draw(); } }, 'Reset'),
      h('button', { class: 'btn primary', onclick: () => finish(true) }, 'Crop'));
    back.append(img, shade, box, bar);
    document.body.append(back);
    ui = back;
    const [ax, ay] = toScr(0, 0), [bx, by] = toScr(o.iw, o.ih);
    Object.assign(img.style, { left: Math.min(ax, bx) + 'px', top: Math.min(ay, by) + 'px', width: Math.abs(bx - ax) + 'px', height: Math.abs(by - ay) + 'px', transform: `scale(${Math.sign(sx)}, ${Math.sign(sy)})` });

      const [x0, y0] = toScr(r[0], r[1]), [x1, y1] = toScr(r[2], r[3]);
      const L = Math.min(x0, x1), Tp = Math.min(y0, y1), W = Math.abs(x1 - x0), H = Math.abs(y1 - y0);
      Object.assign(box.style, { left: L + 'px', top: Tp + 'px', width: W + 'px', height: H + 'px' });
      shade.style.clipPath = `polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 0, ${L}px ${Tp}px, ${L}px ${Tp + H}px, ${L + W}px ${Tp + H}px, ${L + W}px ${Tp}px, ${L}px ${Tp}px)`;

    // drag a handle, or the box itself to move the crop
    let drag = null;
    const toPic = (px, py) => [(px - ox) / sx, (py - oy) / sy];
    back.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.crop-bar')) return;

/* Axiom boot: views, autosave, sample drawing, file drops, service worker */
'use strict';
(() => {
  const D = A.D, R = A.R, B = A.B, G = A.G, UI = A.UI;
  const S = A.settings;

  /* ---------- autosave ---------- */
  let saving = Promise.resolve();
  const save = async () => {
    const doc = D.doc;
    if (!doc) return;
    let thumb = null;
    try { thumb = R.thumbnail(doc).toDataURL('image/jpeg', 0.78); } catch (e) { /* tainted or unavailable */ }
    saving = saving.then(() => A.store.saveDoc(doc, thumb)).catch((e) => { console.error(e); A.toast('Could not save: storage may be full'); });
    return saving;
  };
  const autosave = A.debounce(save, 1200);
  A.on('doc:changed', (k) => { if (k !== 'view') autosave(); });
  A.on('view', A.debounce(() => { if (D.doc) autosave(); }, 1500));
  document.addEventListener('visibilitychange', () => { if (document.hidden && D.doc) autosave.flush(); });
  addEventListener('pagehide', () => { if (D.doc) autosave.flush(); });

  /* ---------- views ---------- */
  const enter = (el, kind = 'in') => { el.classList.remove('view-in', 'view-back'); void el.offsetWidth; el.classList.add(kind === 'back' ? 'view-back' : 'view-in'); };
  const gallery = () => A.$('#gallery-view'), canvasView = () => A.$('#canvas-view');
  /* reading time for the daily goal on the Books page */
  const endReading = () => {
    if (!S.readStart) return;
    const mins = Math.min(240, (Date.now() - S.readStart) / 60000);
    const day = new Date().toISOString().slice(0, 10);
    S.readLog = S.readLog || {};
    S.readLog[day] = (S.readLog[day] || 0) + mins;
    for (const k of Object.keys(S.readLog)) if (k < new Date(Date.now() - 60 * 864e5).toISOString().slice(0, 10)) delete S.readLog[k];
    S.readStart = null; A.saveSettings();
  };
  A.on('app:background', endReading);
  async function showGallery() {
    endReading();
    A.closePopovers();
    if (D.doc) { autosave.cancel(); await save(); A.emit('doc:close'); }
    A.IN.cancelAll();
    D.doc = null;
    if (A.RD.isOpen()) A.RD.close();
    A.$('#reader-view').hidden = true;
    canvasView().hidden = true;
    gallery().hidden = false;
    enter(gallery(), 'back');
    updateChrome();
    await UI.renderGallery();
  }
  async function openDoc(id) {
    endReading();
    const raw = await A.store.loadDoc(id);
    if (!raw) { A.toast('That drawing could not be found'); return showGallery(); }
    if (A.RD.isOpen()) A.RD.close();
    A.$('#reader-view').hidden = true;
    const doc = D.normalize(raw);
    if (D.doc) A.emit('doc:close');
    D.doc = doc;
    D.resetHistory();
    A.emit('selection:clear');
    B.useToolset(D.isNotebook(doc) ? 'notebook' : 'canvas');
    gallery().hidden = true;
    canvasView().hidden = false;
    enter(canvasView());
    canvasView().classList.remove('ui-hidden');
    canvasView().classList.toggle('nb-mode', D.isNotebook(doc));
    R.resize();
    const v = doc.view;
    if (D.isNotebook(doc)) {
      if (!v.tx && !v.ty) { v.zoom = R.fitPageZoom(); v.rot = 0; v.ty = 1e9; }
      else if (Math.abs(v.zoom - R.fitPageZoom()) > R.fitPageZoom() * 0.02 && v.zoom < R.fitPageZoom()) { const keep = R.toWorld(R.w / 2, 80); v.zoom = R.fitPageZoom(); v.ty = 80 - keep[1] * v.zoom; }
      R.constrainNotebook();
    } else if (!v.tx && !v.ty) {
      const bb = D.allBB() || (doc.artboards.length ? [doc.artboards[0].x, doc.artboards[0].y, doc.artboards[0].x + doc.artboards[0].w, doc.artboards[0].y + doc.artboards[0].h] : null);
      if (bb) R.fitBB(bb); else { v.tx = R.w / 2; v.ty = R.h / 2; }
    }
    A.emit('doc:open');
    A.emit('view');
    UI.renderTools();
    UI.renderLayers();
    R.renderNow(true);
  }
  A.on('go:gallery', showGallery);
  A.on('read', async (id) => {
    const meta = A.ST.doc(id);
    if (!meta) return A.toast('That document could not be found');
    A.closePopovers();
    if (D.doc) { autosave.cancel(); await save(); A.IN.cancelAll(); D.doc = null; }
    canvasView().hidden = true;
    gallery().hidden = true;
    updateChrome();
    S.readStart = Date.now();
    A.RD.open(meta);
    enter(A.$('#reader-view'));
  });
  A.on('app:background', () => { if (D.doc) autosave.flush(); });
  A.on('open', openDoc);

  /* ---------- sample drawing (first launch) ---------- */
  function sampleDoc() {
    const doc = D.create({ name: 'Welcome · unit circle and sine', bg: D.papers.white, grid: 'graph' });
    doc.paper.grid.spacing = 40; doc.paper.grid.divisions = 5;
    const L = doc.layers[0]; L.name = 'Sketch';
    const ink = D.newLayer('Ink'); const hl = D.newLayer('Highlights');
    doc.layers = [hl, L, ink]; doc.activeLayerId = ink.id;
    let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647 - 0.5);
    const stroke = (b, color, size, op, fn, n, opts = {}) => {
      const pts = [];
      for (let i = 0; i <= n; i++) {
        const t = i / n; const [x, y] = fn(t);
        const p = opts.flat ? 1 : 0.55 + 0.45 * Math.sin(Math.PI * Math.min(1, t * 1.15));
        pts.push(x + rnd() * (opts.j ?? 0.6), y + rnd() * (opts.j ?? 0.6), B.widthMul(b, p, opts.tilt || 0, true));
      }
      return D.makeStroke(b, color, size, op, G.simplify(pts, 0.15, 0.03), opts.extra || {});
    };
    const U = 120; // one unit = 120 px
    // axes
    ink.items.push(stroke('fineliner', '#1a1e26', 1.8, 1, (t) => [-200 + t * 1180, 0], 60, { flat: true, j: 0.4 }));
    ink.items.push(stroke('fineliner', '#1a1e26', 1.8, 1, (t) => [0, 200 - t * 400], 30, { flat: true, j: 0.4 }));
    ink.items.push(stroke('fineliner', '#1a1e26', 1.8, 1, (t) => [968 + t * 12, -8 + t * 8], 4, { flat: true, j: 0 }));
    ink.items.push(stroke('fineliner', '#1a1e26', 1.8, 1, (t) => [968 + t * 12, 8 - t * 8], 4, { flat: true, j: 0 }));
    ink.items.push(stroke('fineliner', '#1a1e26', 1.8, 1, (t) => [-8 + t * 8, -188 - t * 12 + 0], 4, { flat: true, j: 0 }));
    ink.items.push(stroke('fineliner', '#1a1e26', 1.8, 1, (t) => [8 - t * 8, -188 - t * 12], 4, { flat: true, j: 0 }));
    // ticks at pi/2 multiples
    for (let k = 1; k <= 4; k++) { const x = (k * Math.PI / 2) * U; ink.items.push(stroke('fineliner', '#1a1e26', 1.5, 1, (t) => [x, -7 + t * 14], 3, { flat: true, j: 0 })); }
    // unit circle (pencil) centred on the origin
    L.items.push(stroke('pencil', '#4a5060', 2.4, 0.9, (t) => [Math.cos(t * Math.PI * 2) * U, Math.sin(t * Math.PI * 2) * U], 140, { j: 0.8 }));
    // radius at 60°
    const a = -Math.PI / 3;
    ink.items.push(stroke('pen', '#c0392b', 2.6, 1, (t) => [Math.cos(a) * U * t, Math.sin(a) * U * t], 30));
    ink.items.push(stroke('dotted', '#c0392b', 2.4, 1, (t) => [Math.cos(a) * U, Math.sin(a) * U * (1 - t)], 20, { flat: true, j: 0 }));
    ink.items.push(stroke('dotted', '#1f4fbf', 2.4, 1, (t) => [Math.cos(a) * U + t * ((Math.PI / 3) * U - Math.cos(a) * U), Math.sin(a) * U], 30, { flat: true, j: 0 }));
    // angle arc
    ink.items.push(stroke('pen', '#c0392b', 1.8, 1, (t) => [Math.cos(-t * Math.PI / 3) * 34, Math.sin(-t * Math.PI / 3) * 34], 20));
    // sine curve
    ink.items.push(stroke('pen', '#1f4fbf', 3, 1, (t) => [t * 2 * Math.PI * U, -Math.sin(t * 2 * Math.PI) * U], 220, { j: 0.5 }));
    // shaded area under the first hump (fill)
    const fillPts = [];
    for (let i = 0; i <= 60; i++) { const t = i / 60; fillPts.push(t * Math.PI * U, -Math.sin(t * Math.PI) * U, 1); }
    fillPts.push(Math.PI * U, 0, 1, 0, 0, 1);
    L.items.unshift(D.makeStroke('fill', '#9cc3f0', 1, 0.45, fillPts));
    // highlighter on the point (pi/3, sin)
    hl.items.push(stroke('highlighter', '#f2c94c', 22, 0.45, (t) => [(Math.PI / 3) * U - 30 + t * 60, Math.sin(a) * U], 10, { flat: true, j: 0.3 }));
    // brush-pen flourish under everything: "area = 2"
    ink.items.push(stroke('brushpen', '#1e8449', 6, 1, (t) => [200 + t * 150, 90 + Math.sin(t * Math.PI) * -8], 60));
    doc.view = { tx: 0, ty: 0, zoom: 1, rot: 0 };
    return doc;
  }

  /* ---------- status-bar color: blend the clock strip into the canvas / gallery ---------- */
  function updateChrome() {
    let m = document.querySelector('meta[name="theme-color"]');
    if (!m) { m = document.createElement('meta'); m.name = 'theme-color'; document.head.append(m); }
    const onCanvas = D.doc && !canvasView().hidden;
    const c = onCanvas ? R.displayBg() : (getComputedStyle(document.body).backgroundColor || '#eef0f3');
    m.setAttribute('content', c);
  }
  A.on('doc:open', () => setTimeout(updateChrome, 0));
  A.on('doc:changed', (k) => { if (k === 'paper' || k === 'all') updateChrome(); });
  A.on('theme', () => setTimeout(updateChrome, 0));

  /* ---------- boot ---------- */
  async function boot() {
    try { if (navigator.standalone || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches) document.documentElement.classList.add('standalone'); } catch (e) { /* ignore */ }
    UI.applyTheme();
    if (matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => UI.applyTheme());
    R.init(A.$('#main'), A.$('#overlay'));
    A.IN.init(A.$('#overlay'));
    UI.mountStatus(A.$('#statusbar'));
    UI.mountTools(A.$('#tools'));
    UI.mountLayers(A.$('#layers'));
    UI.mountPrecision(A.$('#precision'));
    UI.mountSelection(A.$('#selmenu'), A.$('#selpopup'));
    UI.mountGallery(A.$('#gallery-view'));
    A.ST.mount(A.$('#studypanel'));
    A.NB.mount(A.$('#nb-ui'));
    A.TE.mount(A.$('#stage'));
    A.RD.mount(A.$('#reader-view'));
    UI.purgeTrash().catch(() => {});
    if (!S.calmDefaults) { S.calmDefaults = true; S.tapHoldSelect = false; S.highlightSelection = false; A.saveSettings(); }
    if (!S.slimBar) { S.slimBar = true; S.showPalette = false; A.saveSettings(); }
    if (window.AXIOM_NATIVE && A.native) {
      S.orientationLock = !!window.AXIOM_NATIVE.orientationLock;
      if (S.keepAwake) A.native.post({ op: 'keepAwake', on: true }).catch(() => {});
    }
    if (!S.homeSeen) { S.homeSeen = true; S.galleryFilter = 'home'; A.saveSettings(); }
    A.$('#restore-ui').innerHTML = A.icon('eye');
    A.$('#restore-ui').addEventListener('click', () => A.emit('cmd', 'toggleUI'));
    A.on('selmenu:show', () => {});
    A.on('eyedrop:end', () => {});

    // paste images / strokes
    document.addEventListener('paste', (e) => {
      if (!D.doc || canvasView().hidden) return;
      const items = (e.clipboardData && e.clipboardData.items) || [];
      for (const it of items) if (it.type && it.type.startsWith('image/')) { const f = it.getAsFile(); if (f) { e.preventDefault(); UI.importImageFile(f); return; } }
      if (A.clip) { e.preventDefault(); A.emit('cmd', 'paste'); }
    });
    // drag & drop files
    addEventListener('dragover', (e) => e.preventDefault());
    addEventListener('drop', async (e) => {
      e.preventDefault();
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (!f) return;
      if (/\.axiom$|json/i.test(f.name + f.type)) { try { await UI.importProjectText(await f.text()); } catch (er) { A.toast('That file is not an Axiom project'); } return; }
      if (!D.doc) return A.toast('Open a drawing first, then drop the file');
      if (f.type === 'application/pdf') UI.importPdf(f); else if (f.type.startsWith('image/')) UI.importImageFile(f);
    });

    const metas = await A.store.listMeta();
    if (!metas.length && !S.seenWelcome) {
      const doc = sampleDoc();
      await A.store.saveDoc(doc, null);
      S.seenWelcome = true; A.saveSettings();
      await openDoc(doc.id);
      await save();
      setTimeout(() => A.toast('Welcome to Axiom. Draw with Apple Pencil, and pinch with two fingers to move around.', 4200), 600);
    } else {
      await showGallery();
    }

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && window.top === window && !window.AXIOM_NO_SW) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
