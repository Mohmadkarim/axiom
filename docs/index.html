.ab-row { position: relative; }
.rd-actions.ask-bar .ab-in { height: 42px; border-radius: 21px; border: 0.5px solid var(--float-line); background: var(--panel-2); color: var(--fg); padding: 0 48px 0 16px; width: 100%; }
.rd-actions.ask-bar .ab-in::placeholder { color: var(--label); }
.rd-actions.ask-bar .ab-send { position: absolute; right: 5px; top: 5px; width: 32px; height: 32px; border-radius: 50%; padding: 0; justify-content: center; background: var(--accent); color: #fff; }
.rd-actions.ask-bar .ab-send .ic { width: 16px; height: 16px; }
.rd-actions.ask-bar .ab-chip { height: 30px; padding: 0 12px; border-radius: 15px; background: var(--panel-2); color: var(--fg); font-size: 13px; font-weight: 600; }
/* highlights: line-shaped, readable in night mode */
.rd-hl { border-radius: 3px; }
#reader-view[data-theme="night"] .rd-hl.yellow { background: rgba(255, 214, 10, .22); }
#reader-view[data-theme="night"] .rd-hl.green { background: rgba(80, 220, 130, .2); }
#reader-view[data-theme="night"] .rd-hl.blue { background: rgba(90, 160, 255, .22); }
#reader-view[data-theme="night"] .rd-hl.pink { background: rgba(255, 100, 170, .2); }
/* one title chip in every editor */
.nb-title > span:first-child, .sb-name { font: 650 15px/1.2 var(--ff-ui) !important; letter-spacing: -.01em; }
.nb-sub { font-size: 12px !important; color: var(--label) !important; }
.sb-group .flip .ic, .nb-tl .flip .ic { transform: rotate(180deg); }
/* page counter on one line */
.nb-counter { flex-direction: row; padding: 3px; border-radius: 16px; }
.nb-counter .ibtn { width: 36px; height: 36px; }
.nb-counter .ibtn:disabled { opacity: .3; }
.nb-count-n { flex-direction: row; align-items: baseline; gap: 0; padding: 0 6px; font-size: 14px; color: var(--fg); }
.nb-count-n b { font-size: 14px; font-weight: 650; }
.nb-count-n span { font-size: 14px !important; opacity: 1 !important; color: var(--label); }
/* rail: steady layout and readable disabled states */
.ibtn:disabled { opacity: .32; }
.toolbar.slim .ibtn:disabled { opacity: .3; }
.dv-pg { position: relative; background: #fff; border-radius: 2px; box-shadow: 0 0 0 0.5px rgba(0,0,0,.08), 0 6px 18px -10px rgba(0,0,0,.35); }
.dv-pg:not(.rendered)::before { content: ""; position: absolute; inset: 10% 12%; background: repeating-linear-gradient(180deg, rgba(120,128,140,.12) 0 8px, transparent 8px 20px); animation: shimmer 1.2s ease-in-out infinite alternate; }
.dv-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.dv-bar { gap: 2px; padding: 6px 8px; border-bottom: 0.5px solid var(--float-line); }
.pick-btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 12px; border-radius: var(--r-s); background: rgba(120,128,145,.14); font-weight: 600; font-size: 13.5px; color: var(--fg); white-space: nowrap; }
.pick-btn .ic { width: 15px; height: 15px; color: var(--label); }
.set-row { min-height: 56px; gap: 16px; }
.set-row > :last-child { flex: none; max-width: 60%; }
.set-row .t { font-weight: 600; font-size: 14px; }
.set-row input[type=range] { width: 200px !important; accent-color: var(--accent); }
@keyframes sheetIn { from { transform: translateY(18px) scale(.985); } to { transform: none; } }

/* ===== Desmos tab ===== */
.sp-graph { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg); container-type: inline-size; }
.sp-graph[hidden] { display: none; }
.sp-body[hidden] { display: none; }
.gr-bar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); min-width: 0; }
.gr-kinds { min-width: 0; overflow-x: auto; scrollbar-width: none; flex-shrink: 1; }
.gr-kinds::-webkit-scrollbar { display: none; }
.gr-insert { height: 32px; padding: 0 12px 0 9px; border-radius: var(--r-s); background: var(--accent); color: #fff; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }
.gr-insert svg { width: 17px; height: 17px; }
.gr-stage { position: relative; flex: 1; min-height: 0; background: #fff; }
.gr-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #fff; }
.gr-offline { position: absolute; inset: 0; display: grid; place-items: center; color: #8a8f99; font-size: 13px; }
@container (max-width: 380px) { .gr-insert span { display: none; } .gr-insert { padding: 0 8px; } }

/* ===== tutor context scope ===== */
.scope-pill { height: 28px; padding: 0 8px 0 7px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--label); background: rgba(120,128,145,.12); flex-shrink: 0; max-width: 220px; }
.scope-pill > span:not(.sc-webtag) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.scope-pill svg { width: 15px; height: 15px; flex-shrink: 0; }
.scope-pill > svg:last-child { width: 12px; height: 12px; opacity: .6; }
.scope-pill.on { color: var(--accent); background: var(--accent-soft); }
.sc-webtag { display: inline-flex; align-items: center; gap: 3px; padding-left: 6px; margin-left: 1px; border-left: 1px solid currentColor; border-left-color: color-mix(in srgb, currentColor 30%, transparent); }
.sc-webtag svg { width: 13px; height: 13px; }
.scope-menu { width: 300px; max-width: calc(100vw - 32px); }
.scope-menu > button, .sc-books > button { display: flex; align-items: center; gap: 10px; text-align: left; }
.scope-menu .sc-l { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
.scope-menu .sc-l b { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scope-menu .sc-l i { font-style: normal; font-size: 12px; color: var(--muted); }
.scope-menu > button.on svg { color: var(--accent); }
.scope-menu .sw { width: 36px; height: 22px; border-radius: 11px; background: rgba(120,128,145,.3); position: relative; flex-shrink: 0; transition: background .2s var(--ease); }
.scope-menu .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .2s var(--ease); }
.scope-menu .sw.on { background: var(--accent); }
.scope-menu .sw.on::after { transform: translateX(14px); }
.sc-books { max-height: 320px; overflow-y: auto; }
.sc-books .ck { width: 20px; height: 20px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px var(--line-strong); display: grid; place-items: center; flex-shrink: 0; }
.sc-books .ck svg { width: 14px; height: 14px; opacity: 0; }
.sc-books .ck.on { background: var(--accent); box-shadow: none; color: #fff; }
.sc-books .ck.on svg { opacity: 1; }
.sc-done { display: flex; justify-content: flex-end; padding: 8px 8px 4px; border-top: 1px solid var(--line); margin-top: 4px; }

/* reader: the Write tools float as their own pill under the bar instead of stretching it */
#reader-view .rd-group-wrap { position: relative; display: block; }
#reader-view .rd-inkbar { position: absolute; top: calc(100% + 14px); left: 50%; translate: -50% 0; z-index: 3; display: flex; align-items: center; white-space: nowrap; max-width: calc(100vw - 32px); overflow-x: auto; scrollbar-width: none; box-shadow: var(--float-shadow); }
#reader-view .rd-inkbar[hidden] { display: none; }
#reader-view .rd-inkbar::-webkit-scrollbar { display: none; }

/* zoomed-in pages scroll sideways on both sides instead of being cut off on the left */
#reader-view .rd-pages { width: max-content; min-width: 100%; margin: 0 auto; }

/* ===== form fields in sheets ===== */
.fx-f { display: grid; gap: 5px; min-width: 0; }
.fx-f > span { font-size: 12px; font-weight: 650; color: var(--muted); }
.fx-f .field { width: 100%; min-width: 0; margin: 0; }
.fx-f textarea.field { height: auto; padding: 9px 12px; line-height: 1.4; }
.fx-f input[type="date"], .fx-f input[type="time"] { -webkit-appearance: none; appearance: none; display: block; width: 100%; min-width: 0; max-width: 100%; box-sizing: border-box; text-align: left; line-height: 38px; padding: 0 12px; }
.fx-f input[type="date"]::-webkit-date-and-time-value, .fx-f input[type="time"]::-webkit-date-and-time-value { text-align: left; }
.fx-acts { margin-top: 4px; align-items: center; }
.fx-sub { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 0 10px 6px; }
.fx-none { color: var(--muted); font-size: 14px; margin: 0; padding: 12px; }
.fx-art { width: 48px; height: 48px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.fx-art svg { width: 26px; height: 26px; }
.fx-check { width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line-strong); display: grid; place-items: center; flex: none; color: transparent; }
.fx-check svg { width: 16px; height: 16px; }
.fx-check.on { background: #2f9e6b; box-shadow: none; color: #fff; }
.danger-text { color: var(--danger) !important; }
.field.err { box-shadow: 0 0 0 2px var(--danger); }
.g-sec-h .ibtn { width: 32px; height: 32px; }

/* ===== exam prep ===== */
.ex-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.ex-card { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 14px 16px; background: var(--panel-solid); border: 1px solid var(--line); border-radius: var(--r-l, 16px); min-width: 0; }
.ex-card:active { transform: scale(.99); }
.ex-card-top { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 650; color: var(--muted); }
.ex-card-top .dot { width: 8px; height: 8px; border-radius: 50%; }
.ex-left { color: var(--accent); }
.ex-title { font-size: 17px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ex-sub, .ex-today { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ex-bar { height: 4px; border-radius: 2px; background: var(--panel-2); overflow: hidden; }
.ex-bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s var(--ease); }

.ex-edit { width: min(560px, 100%); display: grid; gap: 14px; box-sizing: border-box; }
.ex-f2 { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, .8fr); }
.ex-mats { display: grid; gap: 6px; }
.ex-mat { display: flex; align-items: center; gap: 10px; padding: 8px 6px 8px 12px; border: 1px solid var(--line); border-radius: var(--r-m, 12px); min-width: 0; }
.ex-mat .grow { display: flex; flex-direction: column; min-width: 0; }
.ex-mat b { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ex-mat small { color: var(--muted); font-size: 12px; }
.ex-mat > svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.ex-mats-empty { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; padding: 10px 12px; border: 1px dashed var(--line-strong); border-radius: var(--r-m, 12px); }
.ex-add { justify-self: start; }
.menu button small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }

.ex-view { position: fixed; inset: 0; z-index: 55; background: var(--bg); display: flex; flex-direction: column; animation: viewIn .22s var(--ease); }
.ex-v-bar { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; }
.ex-v-bar .flip svg { transform: scaleX(-1); }
.ex-v-title { display: flex; flex-direction: column; min-width: 0; }
.ex-v-title b { font-size: 17px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ex-v-title small { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ex-v-left { font-weight: 700; font-size: 13px; color: var(--accent); background: var(--accent-soft); padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.ex-tabs { align-self: center; margin: 0 16px 8px; }
.ex-tabs[hidden] { display: none; }
.ex-v-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px max(16px, calc((100% - 760px) / 2)) calc(40px + env(safe-area-inset-bottom, 0px)); }
.ex-building { display: grid; place-items: center; gap: 14px; padding: 80px 20px; text-align: center; color: var(--muted); }
.ex-building.small { padding: 24px; }
.ex-building p { margin: 0; max-width: 46ch; line-height: 1.5; }
.ex-spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--panel-2); border-top-color: var(--accent); animation: exspin 1s linear infinite; }
@keyframes exspin { to { transform: rotate(360deg); } }
.ex-start { display: grid; justify-items: center; text-align: center; gap: 12px; padding: 60px 20px; }
.ex-start h3 { margin: 0; font-size: 20px; }
.ex-start p { margin: 0; color: var(--muted); max-width: 52ch; line-height: 1.5; }
.ex-err { color: var(--danger); font-size: 13.5px; }
.ex-summary { padding: 14px 16px; background: var(--panel-solid); border: 1px solid var(--line); border-radius: var(--r-l, 16px); display: grid; gap: 8px; }
.ex-summary .md p { margin: 0; }
.ex-format { margin: 0; font-size: 13.5px; color: var(--muted); }
.ex-format b { color: var(--fg); font-weight: 650; }
.ex-prog { display: grid; gap: 6px; }
.ex-prog small { color: var(--muted); font-size: 12px; }
.ex-missed { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 10px 12px 10px 16px; border-radius: var(--r-m, 12px); background: color-mix(in srgb, #d99a22 14%, transparent); font-size: 13.5px; }
.ex-day { margin-top: 18px; }
.ex-day-h { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 0 4px 8px; }
.ex-day.today .ex-day-h { color: var(--accent); }
.ex-day.past { opacity: .6; }
.ex-sess { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: var(--r-m, 12px); background: var(--panel-solid); border: 1px solid var(--line); margin-bottom: 8px; }
.ex-sess .fx-check { margin-top: 2px; }
.ex-sess.done .md { color: var(--muted); text-decoration: line-through; }
.ex-sess .md p { margin: 2px 0; }
.ex-sess-t { display: flex; gap: 8px; align-items: center; }
.ex-k { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
.ex-k.k-learn { background: var(--accent-soft); color: var(--accent); }
.ex-k.k-practice { background: color-mix(in srgb, #2f9e6b 16%, transparent); color: #2f9e6b; }
.ex-k.k-mock { background: color-mix(in srgb, #e5484d 16%, transparent); color: #e5484d; }
.ex-min { font-size: 12px; color: var(--muted); }
.ex-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.ex-chip { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--panel-2); color: var(--fg); }
.ex-chips.pick .ex-chip.on { background: var(--accent); color: #fff; }
.ex-list { display: grid; gap: 8px; }
.ex-topic { display: grid; gap: 4px; text-align: left; padding: 12px 14px; border-radius: var(--r-m, 12px); background: var(--panel-solid); border: 1px solid var(--line); }
.ex-topic-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ex-topic-h b { font-size: 15.5px; font-weight: 650; margin-right: auto; }
.ex-topic small { color: var(--muted); font-size: 13px; line-height: 1.4; }
.ex-topic .ex-src { color: var(--faint); font-size: 12px; }
.ex-w { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: capitalize; }
.ex-w.w-high { background: color-mix(in srgb, #e5484d 16%, transparent); color: #e5484d; }
.ex-w.w-medium { background: color-mix(in srgb, #d99a22 18%, transparent); color: #b7791f; }
.ex-w.w-low { background: var(--panel-2); color: var(--muted); }
.ex-n { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.ex-gaps { margin-top: 18px; padding: 12px 14px; border: 1px dashed var(--line-strong); border-radius: var(--r-m, 12px); }
.ex-gaps p { margin: 6px 0; font-size: 13.5px; line-height: 1.45; }
.ex-guide-h h2 { margin: 6px 0 4px; font-size: 24px; }
.ex-guide-h p { margin: 0 0 6px; }
.ex-hint { color: var(--faint); font-size: 12.5px; margin: 4px 0 12px; }
.ex-guide { display: grid; gap: 2px; }
.ex-block { padding: 6px 10px; border-radius: 10px; cursor: pointer; }
.ex-block:active { background: var(--panel-2); }
.ex-block .md > :first-child { margin-top: 0; } .ex-block .md > :last-child { margin-bottom: 0; }
.ex-block.heading { margin-top: 14px; }
.ex-block.heading .md h2 { font-size: 19px; margin: 0; }
.ex-deeper { margin: 4px 0 10px 18px; padding: 10px 14px; border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); border-radius: 0 10px 10px 0; }
.ex-deeper.sol { border-left-color: #2f9e6b; background: color-mix(in srgb, #2f9e6b 7%, transparent); }
.ex-deeper-h { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
.ex-deeper.sol .ex-deeper-h { color: #2f9e6b; }
.ex-deeper .md > :first-child { margin-top: 0; } .ex-deeper .md > :last-child { margin-bottom: 0; }
.ex-ask { display: flex; gap: 8px; align-items: flex-end; margin: 4px 0 10px 18px; }
.ex-ask .field { margin: 0; flex: 1; min-height: 40px; height: auto; padding: 9px 12px; }
.ex-qs-h { margin: 22px 0 8px; padding: 0 4px; }
.ex-q { padding: 12px 14px; border-radius: var(--r-m, 12px); background: var(--panel-solid); border: 1px solid var(--line); margin-bottom: 10px; display: grid; gap: 6px; }
.ex-q-h { display: flex; align-items: center; gap: 8px; }
.ex-q-h b { font-size: 13px; color: var(--muted); font-weight: 650; margin-right: auto; }
.ex-q .md p { margin: 4px 0; }
.ex-q-acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.ex-q-acts .btn { height: 34px; font-size: 13px; }
.ex-q-out .ex-deeper { margin-left: 0; }
.ex-practice-new { padding: 14px 16px; background: var(--panel-solid); border: 1px solid var(--line); border-radius: var(--r-l, 16px); display: grid; gap: 10px; margin-bottom: 14px; }
.ex-practice-new .fx-sub { padding: 0; }
.ex-set { margin-top: 18px; display: grid; gap: 8px; }
.ex-set-h { display: flex; align-items: baseline; gap: 10px; padding: 0 4px; }
.ex-set-h b { font-size: 16px; }
.ex-set-h small { color: var(--muted); font-size: 12.5px; }
.ex-set > .btn { justify-self: start; }
/* menus opened from inside a dialog sit above it */
.popover { z-index: 95; }
.fx-f3 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.md-table { overflow-x: auto; margin: 8px 0; }
.md-table table { border-collapse: collapse; font-size: 14px; min-width: 60%; }
.md-table th, .md-table td { border: 1px solid var(--line-strong); padding: 6px 10px; text-align: left; vertical-align: top; }
.md-table th { background: var(--panel-2); font-weight: 650; }

/* ===== notebooks on PencilKit: the page is transparent over the pages; the native view shows through ===== */
html.pk-on, html.pk-on body, html.pk-on #app, html.pk-on #canvas-view, html.pk-on #stage { background: transparent !important; }
#canvas-view.pk #main { visibility: hidden; }
html.pk-on #reader-view.pk, html.pk-on #reader-view.pk .rd-main { background: transparent !important; }
#reader-view.pk .rd-pages { visibility: hidden; }

/* ===== crop pictures ===== */
.crop-ui { position: fixed; inset: 0; z-index: 85; touch-action: none; }
.crop-img { position: absolute; pointer-events: none; transform-origin: center; }
.crop-shade { position: absolute; inset: 0; background: rgba(8, 10, 16, .55); pointer-events: none; }
.crop-box { position: absolute; box-shadow: 0 0 0 1.5px #fff, 0 0 0 3px rgba(0,0,0,.25); cursor: move; background-image: linear-gradient(rgba(255,255,255,.35) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.35) 1px, transparent 1px); background-size: 33.333% 33.333%; background-position: -1px -1px; }
.crop-h { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; }
.crop-h::after { content: ''; position: absolute; left: 11px; top: 11px; width: 12px; height: 12px; background: #fff; border-radius: 3px; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.crop-h.h-n, .crop-h.h-s { left: 50%; } .crop-h.h-e, .crop-h.h-w { top: 50%; }
.crop-h.h-nw, .crop-h.h-n, .crop-h.h-ne { top: 0; } .crop-h.h-sw, .crop-h.h-s, .crop-h.h-se { top: 100%; }
.crop-h.h-nw, .crop-h.h-w, .crop-h.h-sw { left: 0; } .crop-h.h-ne, .crop-h.h-e, .crop-h.h-se { left: 100%; }
.crop-h.h-n::after, .crop-h.h-s::after { width: 22px; height: 6px; left: 6px; top: 14px; }

<body>
<div id="app">
  <section id="gallery-view" hidden></section>
  <section id="reader-view" hidden></section>
  <section id="canvas-view" hidden>
    <div id="stage"><canvas id="main"></canvas><canvas id="overlay"></canvas></div>
    <header id="statusbar"></header>
    <div id="tools"></div>
    <aside id="layers" class="panel" hidden></aside>
    <div id="precision" class="panel" hidden></div>
    <div id="selmenu" class="panel" hidden></div>
    <div id="selpopup" class="panel" hidden></div>
    <button id="restore-ui" class="panel" aria-label="Show interface"></button>
    <div id="nb-ui"></div>
    <aside id="studypanel" hidden></aside>
  </section>
</div>
<div id="toasts" aria-live="polite"></div>

<script>window.AXIOM_BUILD = 'mvny0ezu';
/* ---- core.js ---- */
/* Axiom core: namespace, math, color, events, DOM helpers */
'use strict';
const A = (window.A = {});

A.VERSION = '0.4';
A.uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
A.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
A.lerp = (a, b, t) => a + (b - a) * t;
A.dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
A.now = () => performance.now();
A.deg = (r) => (r * 180) / Math.PI;
A.rad = (d) => (d * Math.PI) / 180;

A.debounce = (fn, ms) => {
  let t;
  const f = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  f.flush = (...a) => { clearTimeout(t); fn(...a); };
  f.cancel = () => clearTimeout(t);
  return f;
};

/* ---------- affine matrices [a,b,c,d,e,f] (canvas convention) ---------- */
A.M = {
  id: () => [1, 0, 0, 1, 0, 0],
  mul: (m, n) => [
    m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1],
    m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3],
    m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5],
  ],
  inv: (m) => {
    const det = m[0] * m[3] - m[1] * m[2] || 1e-12;
    return [m[3] / det, -m[1] / det, -m[2] / det, m[0] / det,
      (m[2] * m[5] - m[3] * m[4]) / det, (m[1] * m[4] - m[0] * m[5]) / det];
  },
  apply: (m, x, y) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]],
  translate: (x, y) => [1, 0, 0, 1, x, y],
  scale: (sx, sy = sx) => [sx, 0, 0, sy, 0, 0],
  rotate: (r) => { const c = Math.cos(r), s = Math.sin(r); return [c, s, -s, c, 0, 0]; },
  // transform about a pivot
  about: (m, px, py) => A.M.mul(A.M.translate(px, py), A.M.mul(m, A.M.translate(-px, -py))),
  det: (m) => m[0] * m[3] - m[1] * m[2],
};

/* ---------- color ---------- */
A.C = {
  hexToRgb(hex) {
    let h = String(hex || '').replace('#', '').trim();
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    if (!/^[0-9a-f]{6}$/i.test(h)) return null;
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  },
  rgbToHex(r, g, b) {
    return '#' + [r, g, b].map((v) => A.clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
  },
  rgbToHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    let h = 0;
    if (d) {
      if (mx === r) h = ((g - b) / d) % 6;
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60; if (h < 0) h += 360;
    }
    return [h, mx ? d / mx : 0, mx];
  },
  hsvToRgb(h, s, v) {
    const c = v * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = v - c;
    let r, g, b;
    if (h < 60) [r, g, b] = [c, x, 0]; else if (h < 120) [r, g, b] = [x, c, 0];
    else if (h < 180) [r, g, b] = [0, c, x]; else if (h < 240) [r, g, b] = [0, x, c];
    else if (h < 300) [r, g, b] = [x, 0, c]; else [r, g, b] = [c, 0, x];
    return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
  },
  rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
    let h = 0, s = 0;
    if (d) {
      s = d / (1 - Math.abs(2 * l - 1));
      if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
      h *= 60; if (h < 0) h += 360;
    }
    return [h, s, l];
  },
  hslToRgb(h, s, l) {
    const v = l + s * Math.min(l, 1 - l);
    const sv = v ? 2 * (1 - l / v) : 0;
    return A.C.hsvToRgb(((h % 360) + 360) % 360, sv, v);
  },
  luminance(hex) {
    const [r, g, b] = A.C.hexToRgb(hex) || [0, 0, 0];
    return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  },
  rgba(hex, a) {
    const [r, g, b] = A.C.hexToRgb(hex) || [0, 0, 0];
    return `rgba(${r},${g},${b},${a})`;
  },
};

/* ---------- events ---------- */
const _ev = {};
A.on = (n, f) => ((_ev[n] = _ev[n] || []).push(f), () => A.off(n, f));
A.off = (n, f) => { _ev[n] = (_ev[n] || []).filter((x) => x !== f); };
A.emit = (n, d) => (_ev[n] || []).slice().forEach((f) => f(d));

/* ---------- DOM ---------- */
A.$ = (s, r = document) => r.querySelector(s);
A.$$ = (s, r = document) => Array.from(r.querySelectorAll(s));
A.h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
};

/* one toast at a time: a new message replaces the current one instead of stacking */
A.toast = (msg, ms = 1800) => {
  const host = A.$('#toasts');
  if (!host) return;
  let t = host.querySelector('.toast');
  if (!t) {
    t = A.h('div', { class: 'toast', role: 'status' });
    host.append(t);
    requestAnimationFrame(() => t.classList.add('in'));
  } else t.classList.add('in');
  t.textContent = msg;
  // centre over the pane in use (canvas beside a panel, reader beside the tutor)
  const pane = [A.$('#canvas-view:not([hidden]) #stage'), A.$('#reader-view:not([hidden]) .rd-main')].find(Boolean);
  const r = pane ? pane.getBoundingClientRect() : null;
  host.style.left = r && r.width ? r.left + r.width / 2 + 'px' : '50%';
  clearTimeout(t._hide); clearTimeout(t._rm);
  t._hide = setTimeout(() => { t.classList.remove('in'); t._rm = setTimeout(() => t.remove(), 300); }, ms);
};

/* in-page confirm / prompt (native dialogs are unavailable in some hosts) */
A.dialog = ({ title, body, input, okText = 'OK', cancelText = 'Cancel', danger = false }) =>
  new Promise((res) => {
    const back = A.h('div', { class: 'modal-back' });
    let inp = null;
    if (input != null) inp = A.h('input', { class: 'field', id: 'dlg-input', value: input, autocomplete: 'off' });
    const close = (v) => { back.remove(); res(v); };
    const ok = A.h('button', { class: 'btn ' + (danger ? 'danger' : 'primary'), onclick: () => close(inp ? inp.value : true) }, okText);
    const box = A.h('div', { class: 'modal small', role: 'dialog', 'aria-modal': 'true' },
      A.h('h3', null, title),
      body ? A.h('p', { class: 'muted' }, body) : null,
      inp,
      A.h('div', { class: 'row end gap' },
        A.h('button', { class: 'btn', onclick: () => close(inp ? null : false) }, cancelText), ok));
    back.append(box);
    back.addEventListener('pointerdown', (e) => { if (e.target === back) close(inp ? null : false); });
    document.body.append(back);
    if (inp) {
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') ok.click(); if (e.key === 'Escape') close(null); });
      setTimeout(() => { inp.focus(); inp.select(); }, 30);
    }
  });

/* popover anchored to an element or point; closes on outside tap */
A.popover = (content, anchor, opts = {}) => {
  A.closePopovers();
  const pop = A.h('div', { class: 'popover ' + (opts.cls || '') });
  pop.append(content);
  document.body.append(pop);
  const place = () => {
    const pr = pop.getBoundingClientRect();
    let x, y;
    if (anchor && anchor.getBoundingClientRect) {
      const r = anchor.getBoundingClientRect();
      const side = opts.side || 'auto';
      if (side === 'right' || (side === 'auto' && r.left < innerWidth / 2 && r.width < 120 && r.height > r.width * 0.8)) {
        x = r.right + 10; y = r.top + r.height / 2 - pr.height / 2;
      } else if (side === 'left') {
        x = r.left - pr.width - 10; y = r.top + r.height / 2 - pr.height / 2;
      } else if (side === 'up') {
        x = r.left + r.width / 2 - pr.width / 2; y = r.top - pr.height - 10;
      } else {
        x = r.left + r.width / 2 - pr.width / 2; y = r.bottom + 10;
      }
    } else if (anchor) { x = anchor.x - pr.width / 2; y = anchor.y + 12; }
    else { x = innerWidth / 2 - pr.width / 2; y = innerHeight / 2 - pr.height / 2; }
    pop.style.left = A.clamp(x, 8, innerWidth - pr.width - 8) + 'px';
    pop.style.top = A.clamp(y, 8, innerHeight - pr.height - 8) + 'px';
  };
  place();
  pop._place = place;
  const outside = (e) => {
    if (pop.contains(e.target) || (anchor && anchor.contains && anchor.contains(e.target))) return;
    close();
  };
  const close = () => {
    document.removeEventListener('pointerdown', outside, true);
    pop.remove();
    opts.onClose && opts.onClose();
  };
  pop._close = close;
  setTimeout(() => document.addEventListener('pointerdown', outside, true), 0);
  requestAnimationFrame(() => pop.classList.add('in'));
  return pop;
};
A.closePopovers = () => A.$$('.popover').forEach((p) => (p._close ? p._close() : p.remove()));

/* downloads/sharing with graceful fallbacks */
A.deliverFile = async (blob, filename, previewUrl) => {
  if (A.native) {
    const data = await new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.readAsDataURL(blob); });
    await A.native.post({ op: 'share', name: filename, mime: blob.type, data });
    return true;
  }
  try {
    const file = new File([blob], filename, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: filename });
      return true;
    }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  try {
    const url = URL.createObjectURL(blob);
    const a = A.h('a', { href: url, download: filename });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) { /* ignore */ }
  // Always also show a preview the user can long-press to save
  A.showFilePreview(blob, filename, previewUrl);
  return true;
};
A.showFilePreview = (blob, filename, previewUrl) => {
  const url = previewUrl || URL.createObjectURL(blob);
  const isImg = blob.type.startsWith('image/');
  const back = A.h('div', { class: 'modal-back' });
  const close = () => back.remove();
  const body = isImg
    ? A.h('img', { src: url, class: 'export-preview', alt: filename })
    : A.h('p', { class: 'muted' }, `${filename} is ready (${Math.round(blob.size / 1024)} KB). If no download started, use Share from a full Safari window.`);
  back.append(A.h('div', { class: 'modal', role: 'dialog' },
    A.h('h3', null, filename),
    body,
    isImg ? A.h('p', { class: 'muted small' }, 'Tip: press and hold the image to save it to Photos or copy it.') : null,
    A.h('div', { class: 'row end gap' }, A.h('button', { class: 'btn primary', onclick: close }, 'Done'))));
  back.addEventListener('pointerdown', (e) => { if (e.target === back) close(); });
  document.body.append(back);
};

A.fmtDate = (t) => {
  const d = new Date(t), now = new Date();
  const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (d.toDateString() === now.toDateString()) return 'Today, ' + time;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return 'Yesterday, ' + time;
  return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
};

/* the visible height above the on-screen keyboard, for dialogs */
(() => {
  const vv = window.visualViewport;
  if (!vv) return;
  const set = () => document.documentElement.style.setProperty('--vvh', Math.round(vv.height) + 'px');
  vv.addEventListener('resize', set); set();
  // keep a focused field in view when the keyboard opens
  vv.addEventListener('resize', () => { const a = document.activeElement; if (a && a.closest && a.closest('.modal') && a.scrollIntoView) setTimeout(() => a.scrollIntoView({ block: 'nearest' }), 60); });
})();

/* ---- store.js ---- */
/* Axiom persistence: IndexedDB for drawings, localStorage for app settings */
'use strict';
(() => {
  const DB_NAME = 'axiom', DB_VER = 2;
  let dbp = null;
  const mem = { docs: new Map(), meta: new Map(), files: new Map() }; // fallback when IndexedDB is unavailable
  let useMem = false;
  // native iPad app: drawings are files managed by the app (see ios/Axiom/DrawingStore.swift)
  const NATIVE = !!(window.AXIOM_NATIVE && window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.axiom);
  const post = (m) => window.webkit.messageHandlers.axiom.postMessage(m);
  A.native = NATIVE ? { post } : null;
  // the app serves stored files as raw bytes at axiom://app/_files/<id> (see ios/Axiom/AppSchemeHandler.swift)
  const RAW = NATIVE && location.protocol === 'axiom:';
  const rawURL = (id) => '_files/' + encodeURIComponent(id);

  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res) => {
      try {
        const rq = indexedDB.open(DB_NAME, DB_VER);
        rq.onupgradeneeded = () => {
          const db = rq.result;
          if (!db.objectStoreNames.contains('docs')) db.createObjectStore('docs', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'id' });
        };
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => { useMem = true; res(null); };
        rq.onblocked = () => { useMem = true; res(null); };
      } catch (e) { useMem = true; res(null); }
    });
    return dbp;
  }
  function tx(store, mode, fn) {
    return open().then((db) => {
      if (!db || useMem) return fn(null);
      return new Promise((res, rej) => {
        const t = db.transaction(store, mode);
        const s = t.objectStore(store);
        let out;
        Promise.resolve(fn(s)).then((v) => (out = v));
        t.oncomplete = () => res(out);
        t.onerror = () => rej(t.error);
        t.onabort = () => rej(t.error);
      });
    });
  }
  const req = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

  A.store = {
    get usingMemory() { return useMem; },
    async listMeta() {
      if (NATIVE) return JSON.parse((await post({ op: 'list' })) || '[]');
      await open();
      if (useMem) return [...mem.meta.values()];
      return tx('meta', 'readonly', (s) => req(s.getAll()));
    },
    async loadDoc(id) {
      if (NATIVE) { const s = await post({ op: 'load', id }); return s ? JSON.parse(s) : null; }
      await open();
      if (useMem) return mem.docs.get(id) || null;
      return tx('docs', 'readonly', (s) => req(s.get(id)));
    },
    async saveDoc(doc, thumb) {
      const meta = { id: doc.id, name: doc.name, created: doc.created, updated: doc.updated, thumb: thumb || null, paper: doc.paper.bg, subject: doc.subject || null, kind: doc.kind || 'canvas', pages: doc.pages ? doc.pages.length : null, fav: !!doc.fav, folder: doc.folder || null, rec: doc.recordings ? doc.recordings.length : 0 };
      if (NATIVE) { await post({ op: 'save', id: doc.id, doc: JSON.stringify(doc), meta: JSON.stringify(meta) }); return; }
      await open();
      if (useMem) { mem.docs.set(doc.id, JSON.parse(JSON.stringify(doc))); mem.meta.set(doc.id, meta); return; }
      await tx('docs', 'readwrite', (s) => s.put(doc));
      await tx('meta', 'readwrite', (s) => s.put(meta));
    },
    async saveMeta(meta) {
      if (NATIVE) { await post({ op: 'saveMeta', id: meta.id, meta: JSON.stringify(meta) }); return; }
      await open();
      if (useMem) { mem.meta.set(meta.id, meta); return; }
      await tx('meta', 'readwrite', (s) => s.put(meta));
    },
    /* binary files: PDFs, photos, saved visuals (Blob in, Blob out) */
    async saveFile(id, blob) {
      if (RAW) {
        try { const r = await fetch(rawURL(id), { method: 'POST', body: blob }); if (r.ok) return; } catch (e) { /* fall back to the message bridge */ }
      }
      if (NATIVE) {
        const data = await new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.readAsDataURL(blob); });
        await post({ op: 'fileSave', id, data });
        return;
      }
      await open();
      if (useMem) { mem.files.set(id, blob); return; }
      const buf = await blob.arrayBuffer(); // raw bytes: Safari can't store Blob objects in IndexedDB
      await tx('files', 'readwrite', (s) => s.put({ id, buf, type: blob.type }));
    },
    async loadFile(id, type = 'application/octet-stream') {
      if (RAW) {
        try {
          const r = await fetch(rawURL(id));
          if (r.status === 404) return null;
          if (r.ok) return new Blob([await r.arrayBuffer()], { type });
        } catch (e) { /* fall back to the message bridge */ }
      }
      if (NATIVE) {
        const b64 = await post({ op: 'fileLoad', id });
        if (!b64) return null;
        return (await fetch('data:' + type + ';base64,' + b64)).blob();
      }
      await open();
      if (useMem) return mem.files.get(id) || null;
      const r = await tx('files', 'readonly', (s) => req(s.get(id)));
      if (!r) return null;
      return r.buf ? new Blob([r.buf], { type: r.type || type }) : r.blob || null;
    },
    async deleteFile(id) {
      if (NATIVE) { await post({ op: 'fileDelete', id }); return; }
      await open();
      if (useMem) { mem.files.delete(id); return; }
      await tx('files', 'readwrite', (s) => s.delete(id));
    },
    async deleteDoc(id) {
      if (NATIVE) { await post({ op: 'delete', id }); return; }
      await open();
      if (useMem) { mem.docs.delete(id); mem.meta.delete(id); return; }
      await tx('docs', 'readwrite', (s) => s.delete(id));
      await tx('meta', 'readwrite', (s) => s.delete(id));
    },
  };

  /* ---------- settings (per device) ---------- */
  const KEY = 'axiom.settings.v1';
  const defaults = () => ({
    theme: 'system',            // system | light | dark
    toolSetup: 'bar',           // bar | wheel
    toolSide: 'left',           // left | right
    toolPos: null,              // {x,y} for the wheel / bar offset
    fingerAction: 'auto',       // auto | draw | pan | select
    twoFingerUndo: true,
    threeFingerRedo: true,
    tapHoldSelect: false,
    holdTime: 500,
    pressure: 1.0,              // exponent: <1 softer, >1 firmer
    allowRotate: true,
    hoverCursor: true,
    highlightSelection: true,
    showPalette: true,
    activeSlot: 0,
    slots: null,                // filled by brushes.js
    recentColors: [],
    palettes: null,             // filled by color UI
    activePalette: 0,
    sort: 'updated',
    seenWelcome: false,
    majors: null,               // e.g. ['math','physics']; null until onboarding
    subjects: [],               // courses: {id, name, color}
    documents: [],              // study library meta: {id, name, kind, type, subject, size, added, lastPage}
    visuals: [],                // saved visuals meta: {id, name, subject, thumb}
    aiKey: '',
    aiModel: 'claude-opus-5-5',
    panelW: 0,
    galleryFilter: 'home',
    darkCanvas: true,
    penSeen: false,
  });
  let S = defaults();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) S = Object.assign(defaults(), JSON.parse(raw));
  } catch (e) { /* storage blocked */ }
  if (NATIVE && window.AXIOM_SETTINGS && typeof window.AXIOM_SETTINGS === 'object') S = Object.assign(defaults(), window.AXIOM_SETTINGS);
  A.settings = S;
  A.saveSettings = A.debounce(() => {
    try { localStorage.setItem(KEY, JSON.stringify(A.settings)); } catch (e) { /* ignore */ }
    if (NATIVE) post({ op: 'settings', json: JSON.stringify(A.settings) }).catch(() => {});
  }, 250);
})();

(() => {

    { id: 'chem', name: 'Chemistry', courses: ['General Chemistry', 'Organic Chemistry', 'Physical Chemistry', 'Inorganic Chemistry'] },
    { id: 'cs', name: 'Computer Science', courses: ['Discrete Math', 'Algorithms', 'Data Structures', 'Theory of Computation', 'Machine Learning'] },

  SU.name = (id) => (SU.get(id) || {}).name || '';
  SU.color = (id) => (SU.get(id) || {}).color || 'var(--faint)';
  SU.add = (name, color) => {
    name = String(name || '').trim().slice(0, 48);
    if (!name) return null;
    const ex = SU.list().find((s) => s.name.toLowerCase() === name.toLowerCase());
    if (ex) return ex;
    const s = { id: A.uid(), name, color: color || SU.colors[SU.list().length % SU.colors.length] };
    S.subjects = SU.list().concat([s]);
    A.saveSettings();
    A.emit('subjects');
    return s;
  };
  SU.remove = (id) => { S.subjects = SU.list().filter((s) => s.id !== id); A.saveSettings(); A.emit('subjects'); };
  SU.rename = (id, name) => { const s = SU.get(id); if (s && name) { s.name = name.slice(0, 48); A.saveSettings(); A.emit('subjects'); } };
  SU.majorNames = () => (S.majors || []).map((m) => (SU.majors.find((x) => x.id === m) || {}).name).filter(Boolean);

  /* "What do you study?" sheet: majors + courses */
  SU.openSetup = (first = false) => new Promise((res) => {
    const picked = new Set(S.majors || []);
    const back = h('div', { class: 'modal-back' });
    const box = h('div', { class: 'modal wide', role: 'dialog', 'aria-label': 'Your studies' });
    const close = () => { back.remove(); res(); };
    const body = h('div');
    const draw = () => {
      body.innerHTML = '';
      const chips = h('div', { class: 'chips' });
      SU.majors.forEach((m) => chips.append(h('button', { class: 'chip' + (picked.has(m.id) ? ' on' : ''), onclick: () => { picked.has(m.id) ? picked.delete(m.id) : picked.add(m.id); draw(); } }, m.name)));
      body.append(h('h5', null, 'Majors'), chips);
      const mine = h('div', { class: 'chips' });
      SU.list().forEach((s) => mine.append(h('span', { class: 'chip on' }, h('i', { class: 'dot', style: { background: s.color } }), s.name,
        h('button', { class: 'chip-x', 'aria-label': 'Remove ' + s.name, html: A.icon('close'), onclick: () => { SU.remove(s.id); draw(); } }))));
      const inp = h('input', { class: 'field', id: 'course-input', placeholder: 'Add a course, e.g. Differential Geometry', autocomplete: 'off', style: { margin: '0' } });
      const add = () => { if (SU.add(inp.value)) { inp.value = ''; draw(); setTimeout(() => A.$('#course-input')?.focus(), 0); } };
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') add(); });
      body.append(h('h5', null, 'Your courses'), SU.list().length ? mine : h('p', { class: 'muted small' }, 'Courses become folders for your drawings and documents, and the tutor knows which course you are working on.'),
        h('div', { class: 'row gap', style: { marginTop: '8px' } }, inp, h('button', { class: 'btn', onclick: add }, 'Add')));
      const sugg = h('div', { class: 'chips' });
      const have = new Set(SU.list().map((s) => s.name.toLowerCase()));
      SU.majors.filter((m) => picked.has(m.id)).forEach((m) => m.courses.forEach((c) => {
        if (!have.has(c.toLowerCase())) sugg.append(h('button', { class: 'chip ghost', onclick: () => { SU.add(c); draw(); } }, '+ ' + c));
      }));
      if (sugg.childElementCount) body.append(h('h5', null, 'Suggestions'), sugg);
    };
    draw();
    const done = h('button', { class: 'btn primary', onclick: () => { S.majors = [...picked]; A.saveSettings(); A.emit('subjects'); close(); } }, first ? 'Start' : 'Done');
    box.append(h('h3', null, first ? 'What do you study?' : 'Your studies'),
      h('p', { class: 'muted' }, 'Axiom shows the visual tools for your majors first and organizes your work by course. You can change this any time in Settings.'),
      body,
      h('div', { class: 'row end gap', style: { marginTop: '22px' } }, first ? h('button', { class: 'btn', onclick: () => { S.majors = S.majors || []; A.saveSettings(); close(); } }, 'Skip') : null, done));
    back.append(box);
    document.body.append(back);
  });

  /* compact subject picker used in menus */
  SU.pickMenu = (anchor, current, onPick) => {
    const box = h('div', { class: 'menu' });
    box.append(h('div', { class: 'sub' }, 'Course'));
    const it = (id, name, color) => {
      const b = h('button', { class: id === current ? 'on' : '', onclick: () => { A.closePopovers(); onPick(id); } }, h('i', { class: 'dot', style: { background: color } }), name);
      box.append(b);
    };
    it(null, 'No course', 'transparent');
    SU.list().forEach((s) => it(s.id, s.name, s.color));
    box.append(h('hr'), h('button', { onclick: async () => { A.closePopovers(); const n = await A.dialog({ title: 'New course', input: '', okText: 'Add' }); const s = n && SU.add(n); if (s) onPick(s.id); } }, '+ New course'));
    A.popover(box, anchor, { side: 'down' });
  };
})();

/* ---- geom.js ---- */
/* Axiom geometry: stroke processing, outlines, hit testing, shape recognition, lattices.
   Stroke points are flat arrays [x, y, m, x, y, m, ...] where m is a width multiplier. */
'use strict';
(() => {
  const G = (A.G = {});
  const hyp = Math.hypot;

  G.count = (p) => (p.length / 3) | 0;

  G.bbox = (pts, pad = 0) => {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (let i = 0; i < pts.length; i += 3) {
      const x = pts[i], y = pts[i + 1];
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    if (x0 === Infinity) return [0, 0, 0, 0];
    return [x0 - pad, y0 - pad, x1 + pad, y1 + pad];
  };
  G.bbUnion = (a, b) => (a ? [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])] : b.slice());
  G.bbHit = (a, b) => a[0] <= b[2] && a[2] >= b[0] && a[1] <= b[3] && a[3] >= b[1];
  G.maxM = (pts) => { let m = 0; for (let i = 2; i < pts.length; i += 3) if (pts[i] > m) m = pts[i]; return m || 1; };

  G.length = (pts) => {
    let L = 0;
    for (let i = 3; i < pts.length; i += 3) L += hyp(pts[i] - pts[i - 3], pts[i + 1] - pts[i - 2]);
    return L;
  };

  G.distToSeg = (px, py, ax, ay, bx, by) => {
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    return hyp(px - (ax + t * dx), py - (ay + t * dy));
  };

  G.pointInPoly = (x, y, poly) => {
    let inside = false;
    for (let i = 0, j = poly.length - 2; i < poly.length; j = i, i += 2) {
      const xi = poly[i], yi = poly[i + 1], xj = poly[j], yj = poly[j + 1];
      if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  };

  /* Resample to roughly uniform spacing (keeps first/last points) */
  G.resample = (pts, step) => {
    const n = G.count(pts);
    if (n < 2 || step <= 0) return pts.slice();
    const out = [pts[0], pts[1], pts[2]];
    let carry = 0;
    for (let i = 1; i < n; i++) {
      const ax = pts[(i - 1) * 3], ay = pts[(i - 1) * 3 + 1], am = pts[(i - 1) * 3 + 2];
      const bx = pts[i * 3], by = pts[i * 3 + 1], bm = pts[i * 3 + 2];
      const seg = hyp(bx - ax, by - ay);
      let d = step - carry;
      while (d <= seg) {
        const t = d / seg;
        out.push(ax + (bx - ax) * t, ay + (by - ay) * t, am + (bm - am) * t);
        d += step;
      }
      carry = seg - (d - step);
    }
    const L = out.length;
    const lx = pts[pts.length - 3], ly = pts[pts.length - 2];
    if (hyp(out[L - 3] - lx, out[L - 2] - ly) > step * 0.2) out.push(lx, ly, pts[pts.length - 1]);
    else { out[L - 3] = lx; out[L - 2] = ly; out[L - 1] = pts[pts.length - 1]; }
    return out;
  };

  /* Chaikin corner cutting, keeps endpoints */
  G.chaikin = (pts, iters = 1, closed = false) => {
    let p = pts;
    for (let k = 0; k < iters; k++) {
      const n = G.count(p);
      if (n < 3) return p;
      const o = closed ? [] : [p[0], p[1], p[2]];
      const lim = closed ? n : n - 1;
      for (let i = 0; i < lim; i++) {
        const a = i * 3, b = ((i + 1) % n) * 3;
        o.push(0.75 * p[a] + 0.25 * p[b], 0.75 * p[a + 1] + 0.25 * p[b + 1], 0.75 * p[a + 2] + 0.25 * p[b + 2]);
        o.push(0.25 * p[a] + 0.75 * p[b], 0.25 * p[a + 1] + 0.75 * p[b + 1], 0.25 * p[a + 2] + 0.75 * p[b + 2]);
      }
      if (!closed) o.push(p[p.length - 3], p[p.length - 2], p[p.length - 1]);
      p = o;
    }
    return p;
  };

  /* Ramer-Douglas-Peucker that also preserves width changes */
  G.simplify = (pts, tol, mtol = 0.06) => {
    const n = G.count(pts);
    if (n < 3) return pts.slice();
    const keep = new Uint8Array(n);
    keep[0] = keep[n - 1] = 1;
    const stack = [[0, n - 1]];
    while (stack.length) {
      const [s, e] = stack.pop();
      const ax = pts[s * 3], ay = pts[s * 3 + 1], am = pts[s * 3 + 2];
      const bx = pts[e * 3], by = pts[e * 3 + 1], bm = pts[e * 3 + 2];
      let worst = 0, wi = -1;
      for (let i = s + 1; i < e; i++) {
        const x = pts[i * 3], y = pts[i * 3 + 1], m = pts[i * 3 + 2];
        const t = (i - s) / (e - s);
        const err = Math.max(G.distToSeg(x, y, ax, ay, bx, by) / tol, Math.abs(m - (am + (bm - am) * t)) / mtol);
        if (err > worst) { worst = err; wi = i; }
      }
      if (worst > 1 && wi > 0) { keep[wi] = 1; stack.push([s, wi], [wi, e]); }
    }
    const out = [];
    for (let i = 0; i < n; i++) if (keep[i]) out.push(pts[i * 3], pts[i * 3 + 1], pts[i * 3 + 2]);
    return out;
  };

  /* ---------- outline builders (sink = Path2D or SVG builder) ---------- */
  G.svgSink = () => {
    const parts = [];
    const f = (v) => Math.round(v * 100) / 100;
    return {
      moveTo: (x, y) => parts.push(`M${f(x)} ${f(y)}`),
      lineTo: (x, y) => parts.push(`L${f(x)} ${f(y)}`),
      quadraticCurveTo: (cx, cy, x, y) => parts.push(`Q${f(cx)} ${f(cy)} ${f(x)} ${f(y)}`),
      circle: (x, y, r) => parts.push(`M${f(x - r)} ${f(y)}a${f(r)} ${f(r)} 0 1 0 ${f(2 * r)} 0a${f(r)} ${f(r)} 0 1 0 ${f(-2 * r)} 0Z`),
      closePath: () => parts.push('Z'),
      toString: () => parts.join(''),
    };
  };
  const circle = (sink, x, y, r) => {
    if (sink.circle) return sink.circle(x, y, r);
    sink.moveTo(x + r, y);
    sink.arc(x, y, r, 0, Math.PI * 2);
    sink.closePath();
  };

  /* Variable-width stroke as a nonzero union of circles and (consistently wound) tangent quads */
  G.buildVar = (sink, src, size, taper = 0) => {
    // drop sub-pixel jitter first: dense 240 Hz samples make hair-thin quads whose winding WebKit can cancel (hollow, doubled-looking ink)
    const minD = Math.max(0.4, size * 0.12), sn = G.count(src);
    let pts = src;
    if (sn > 2) {
      pts = [src[0], src[1], src[2]];
      for (let i = 1; i < sn; i++) {
        const j = i * 3, k = pts.length - 3;
        if (i === sn - 1 || hyp(src[j] - pts[k], src[j + 1] - pts[k + 1]) >= minD) pts.push(src[j], src[j + 1], src[j + 2]);
        else pts[k + 2] = Math.max(pts[k + 2], src[j + 2]);
      }
    }
    const n = G.count(pts);
    if (!n) return;
    const r = new Float32Array(n);
    let total = 0;
    const cum = new Float32Array(n);
    for (let i = 1; i < n; i++) { total += hyp(pts[i * 3] - pts[i * 3 - 3], pts[i * 3 + 1] - pts[i * 3 - 2]); cum[i] = total; }
    const tl = taper ? Math.min(size * taper, total * 0.4) : 0;
    for (let i = 0; i < n; i++) {
      let k = pts[i * 3 + 2];
      if (tl > 0) {
        const a = Math.min(1, cum[i] / tl), b = Math.min(1, (total - cum[i]) / tl);
        k *= Math.sqrt(Math.min(a, b)) * 0.92 + 0.08;
      }
      r[i] = Math.max(0.12, (size * k) / 2);
    }
    if (n === 1) { circle(sink, pts[0], pts[1], r[0]); return; }
    for (let i = 0; i < n; i++) circle(sink, pts[i * 3], pts[i * 3 + 1], r[i]);
    for (let i = 0; i < n - 1; i++) {
      const x1 = pts[i * 3], y1 = pts[i * 3 + 1], x2 = pts[i * 3 + 3], y2 = pts[i * 3 + 4];
      const dx = x2 - x1, dy = y2 - y1, L = hyp(dx, dy);
      if (L < 1e-6) continue;
      const nx = -dy / L, ny = dx / L, r1 = r[i], r2 = r[i + 1];
      const ax = x1 + nx * r1, ay = y1 + ny * r1, bx = x2 + nx * r2, by = y2 + ny * r2;
      const cx = x2 - nx * r2, cy = y2 - ny * r2, ex = x1 - nx * r1, ey = y1 - ny * r1;
      // signed area of A,B,C,D: keep positive (same winding as the arcs)
      const area = (ax * by - bx * ay) + (bx * cy - cx * by) + (cx * ey - ex * cy) + (ex * ay - ax * ey);
      if (area >= 0) { sink.moveTo(ax, ay); sink.lineTo(bx, by); sink.lineTo(cx, cy); sink.lineTo(ex, ey); }
      else { sink.moveTo(ax, ay); sink.lineTo(ex, ey); sink.lineTo(cx, cy); sink.lineTo(bx, by); }
      sink.closePath();
    }
  };

  /* Smooth centerline through points using midpoint quadratics */
  G.buildLine = (sink, pts, closed = false) => {
    const n = G.count(pts);
    if (!n) return;
    if (n === 1) { sink.moveTo(pts[0], pts[1]); sink.lineTo(pts[0] + 0.01, pts[1]); return; }
    if (n === 2) { sink.moveTo(pts[0], pts[1]); sink.lineTo(pts[3], pts[4]); if (closed) sink.closePath(); return; }
    sink.moveTo(pts[0], pts[1]);
    for (let i = 1; i < n - 1; i++) {
      const x = pts[i * 3], y = pts[i * 3 + 1];
      const mx = (x + pts[i * 3 + 3]) / 2, my = (y + pts[i * 3 + 4]) / 2;
      sink.quadraticCurveTo(x, y, mx, my);
    }
    sink.lineTo(pts[pts.length - 3], pts[pts.length - 2]);
    if (closed) sink.closePath();
  };

  /* Centripetal Catmull-Rom through the points, sampled every ~step (width interpolated linearly).
     Turns sparse simplified points back into a smooth curve. */
  G.spline = (pts, step, maxPts = 2400) => {
    const n = G.count(pts);
    if (n < 3) return pts;
    const L = G.length(pts);
    step = Math.max(step, L / maxPts);
    const P = (i) => { i = i < 0 ? 0 : i >= n ? n - 1 : i; return [pts[i * 3], pts[i * 3 + 1], pts[i * 3 + 2]]; };
    const out = [pts[0], pts[1], pts[2]];
    for (let i = 0; i < n - 1; i++) {
      const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
      const seg = hyp(p2[0] - p1[0], p2[1] - p1[1]);
      const k = Math.max(1, Math.ceil(seg / step));
      const d = (a, b) => Math.max(1e-4, Math.sqrt(hyp(b[0] - a[0], b[1] - a[1])));
      const t1 = d(p0, p1), t2 = t1 + d(p1, p2), t3 = t2 + d(p2, p3);
      for (let j = 1; j <= k; j++) {
        const u = j / k;
        if (k === 1 || seg < 1e-6) { out.push(p2[0], p2[1], p2[2]); break; }
        const t = t1 + (t2 - t1) * u;
        const lerp = (a, b, ta, tb) => { const w = (t - ta) / (tb - ta || 1e-6); return [a[0] + (b[0] - a[0]) * w, a[1] + (b[1] - a[1]) * w]; };
        const A1 = lerp(p0, p1, 0, t1), A2 = lerp(p1, p2, t1, t2), A3 = lerp(p2, p3, t2, t3);
        const B1 = lerp(A1, A2, 0, t2), B2 = lerp(A2, A3, t1, t3);
        const C = lerp(B1, B2, t1, t2);

    { id: 'cornell', name: 'Cornell' }, { id: 'eng', name: 'Engineering' }, { id: 'iso', name: 'Isometric' }, { id: 'music', name: 'Music staff' },
    { id: 'polar', name: 'Polar' }, { id: 'todo', name: 'Checklist' },
  ];
  R.drawTemplate = (ctx, rect, tpl, bg, hair) => {
    const [x0, y0, x1, y1] = rect, W = x1 - x0, H = y1 - y0;
    const [r, g, b] = R.gridColor(bg);
    const dark = A.C.luminance(bg) < 0.45;
    const line = (a) => `rgba(${r},${g},${b},${a})`;
    const hl = (yy, a, w = 1) => { ctx.strokeStyle = line(a); ctx.lineWidth = hair * w; ctx.beginPath(); ctx.moveTo(x0, yy); ctx.lineTo(x1, yy); ctx.stroke(); };
    const vl = (xx, a, w = 1, ya = y0, yb = y1) => { ctx.strokeStyle = line(a); ctx.lineWidth = hair * w; ctx.beginPath(); ctx.moveTo(xx, ya); ctx.lineTo(xx, yb); ctx.stroke(); };
    const ruled = (sp, top, margin) => {
      ctx.strokeStyle = dark ? 'rgba(120,170,255,0.22)' : 'rgba(70,120,200,0.30)'; ctx.lineWidth = hair;
      ctx.beginPath();
      for (let yy = y0 + top; yy < y1 - 6 * MM; yy += sp) { ctx.moveTo(x0, yy); ctx.lineTo(x1, yy); }
      ctx.stroke();
      if (margin) { ctx.strokeStyle = dark ? 'rgba(255,120,120,0.35)' : 'rgba(220,70,70,0.45)'; ctx.lineWidth = hair; ctx.beginPath(); ctx.moveTo(x0 + margin, y0); ctx.lineTo(x0 + margin, y1); ctx.stroke(); }
    };
    const css = hair > 0 ? 1 / hair : 1; // device px per world unit (≈ screen scale)
    const lod = (sp) => { let st = sp; while (st * css < 7) st *= 2; return st; };
    const grid = (sp0, a, major = 0) => {
      const sp = lod(sp0);
      if (sp !== sp0) major = 0;
      ctx.lineWidth = hair; ctx.beginPath();
      const nx = Math.floor(W / sp), ny = Math.floor(H / sp);
      const ox = x0 + (W - nx * sp) / 2, oy = y0 + (H - ny * sp) / 2;
      ctx.strokeStyle = line(a);
      for (let i = 0; i <= nx; i++) if (!major || i % major) { ctx.moveTo(ox + i * sp, oy); ctx.lineTo(ox + i * sp, oy + ny * sp); }
      for (let j = 0; j <= ny; j++) if (!major || j % major) { ctx.moveTo(ox, oy + j * sp); ctx.lineTo(ox + nx * sp, oy + j * sp); }
      ctx.stroke();
      if (major) {
        ctx.strokeStyle = line(a * 2.4); ctx.beginPath();
        for (let i = 0; i <= nx; i += major) { ctx.moveTo(ox + i * sp, oy); ctx.lineTo(ox + i * sp, oy + ny * sp); }
        for (let j = 0; j <= ny; j += major) { ctx.moveTo(ox, oy + j * sp); ctx.lineTo(ox + nx * sp, oy + j * sp); }
        ctx.stroke();
      }
    };
    ctx.save();
    switch (tpl) {
      case 'lined': ruled(7.1 * MM, 22 * MM, 25 * MM); break;
      case 'narrow': ruled(6 * MM, 18 * MM, 20 * MM); break;
      case 'wide': ruled(8.7 * MM, 26 * MM, 30 * MM); break;
      case 'grid': grid(5 * MM, 0.16); break;
      case 'smallgrid': grid(4 * MM, 0.14); break;
      case 'graph': grid(1 * MM, 0.07, 10); break;
      case 'dot': {
        const sp = lod(5 * MM), rad = hair * 1.25;
        const nx = Math.floor(W / sp), ny = Math.floor(H / sp);
        const ox = x0 + (W - nx * sp) / 2, oy = y0 + (H - ny * sp) / 2;
        ctx.fillStyle = line(0.38); ctx.beginPath();
        for (let i = 1; i < nx; i++) for (let j = 1; j < ny; j++) ctx.rect(ox + i * sp - rad, oy + j * sp - rad, rad * 2, rad * 2);
        ctx.fill();
        break;
      }
      case 'cornell': {
        ruled(7.1 * MM, 32 * MM, 0);
        vl(x0 + 62 * MM, 0.45, 1.4, y0 + 24 * MM, y1 - 52 * MM);
        hl(y0 + 24 * MM, 0.45, 1.4); hl(y1 - 52 * MM, 0.45, 1.4);
        break;
      }
      case 'eng': {
        ctx.fillStyle = dark ? 'rgba(80,140,90,0.10)' : 'rgba(210,235,205,0.55)'; ctx.fillRect(x0, y0, W, H);
        grid(5 * MM, 0.13);
        hl(y0 + 20 * MM, 0.5, 1.4); vl(x0 + 20 * MM, 0.35, 1.2);
        break;
      }
      case 'iso': {
        const sp = lod(6 * MM), h3 = sp * S3, rad = hair * 1.25;
        ctx.fillStyle = line(0.38); ctx.beginPath();
        for (let j = 0, yy = y0 + 8 * MM; yy < y1 - 6 * MM; j++, yy += h3) for (let xx = x0 + 8 * MM + (j % 2 ? sp / 2 : 0); xx < x1 - 6 * MM; xx += sp) ctx.rect(xx - rad, yy - rad, rad * 2, rad * 2);
        ctx.fill();
        break;
      }
      case 'music': {
        const st = 2 * MM, block = 22 * MM;
        ctx.strokeStyle = line(0.4); ctx.lineWidth = hair; ctx.beginPath();
        for (let yy = y0 + 22 * MM; yy + 4 * st < y1 - 12 * MM; yy += block) for (let k = 0; k < 5; k++) { ctx.moveTo(x0 + 15 * MM, yy + k * st); ctx.lineTo(x1 - 15 * MM, yy + k * st); }
        ctx.stroke();
        break;
      }
      case 'polar': {
        const cx = x0 + W / 2, cy = y0 + H / 2, R0 = Math.min(W, H) * 0.42;
        ctx.strokeStyle = line(0.16); ctx.lineWidth = hair; ctx.beginPath();
        for (let k = 1; k <= 8; k++) { ctx.moveTo(cx + (R0 * k) / 8, cy); ctx.arc(cx, cy, (R0 * k) / 8, 0, Math.PI * 2); }
        for (let k = 0; k < 24; k++) { const a = (k * Math.PI) / 12; ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * R0, cy + Math.sin(a) * R0); }
        ctx.stroke();
        break;
      }
      case 'todo': {
        ruled(9 * MM, 24 * MM, 0);
        ctx.strokeStyle = line(0.4); ctx.lineWidth = hair * 1.2;
        for (let yy = y0 + 24 * MM; yy < y1 - 6 * MM; yy += 9 * MM) ctx.strokeRect(x0 + 14 * MM, yy - 6 * MM, 4.2 * MM, 4.2 * MM);
        break;
      }
      default: break;
    }
    ctx.restore();
  };
  R.deskColor = (dark) => (dark ? '#0d0f13' : '#e4e6eb');
  /* paper behind the items: notebook pages, or artboard frames on a canvas */
  const drawPaper = (ctx, o) => {
    const doc = o.doc;
    const vbb = R.worldBB(o.m, o.w, o.h);
    const k = Math.hypot(o.m[0], o.m[1]);
    const hair = (o.dpr || A.dpr) / k;
    if (D.isNotebook(doc)) {
      if (o.bg) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = o.desk || R.deskColor(R.isDarkTheme()); ctx.fillRect(0, 0, o.w, o.h); }
      ctx.setTransform(...o.m);
      const rects = D.pageRects(doc);
      rects.forEach((rc, i) => {
        if (!G.bbHit(rc, vbb)) return;
        let pc = D.pageColor(doc, i);
        if (o.dark && A.C.luminance(pc) > 0.5) pc = R.DARK_PAPER;
        if (o.bg) {
          ctx.save();
          ctx.shadowColor = o.dark ? 'rgba(0,0,0,0.5)' : 'rgba(20,30,50,0.16)';
          ctx.shadowBlur = 18 * (o.dpr || A.dpr); ctx.shadowOffsetY = 4 * (o.dpr || A.dpr);
          ctx.fillStyle = pc; ctx.fillRect(rc[0], rc[1], rc[2] - rc[0], rc[3] - rc[1]);
          ctx.restore();
        } else if (o.pageBg) { ctx.fillStyle = pc; ctx.fillRect(rc[0], rc[1], rc[2] - rc[0], rc[3] - rc[1]); }
        if (o.bg || o.pageBg) R.drawTemplate(ctx, rc, D.pageTemplate(doc, i), pc, hair);
        if (o.bg && A.C.luminance(pc) < 0.35) { ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = hair; ctx.strokeRect(rc[0], rc[1], rc[2] - rc[0], rc[3] - rc[1]); }
      });
      // everything else is clipped to the paper
      ctx.beginPath();

        ctx.shadowBlur = 16 * (o.dpr || A.dpr); ctx.shadowOffsetY = 3 * (o.dpr || A.dpr);

        ctx.restore();

        ctx.lineWidth = hair; ctx.strokeRect(a.x, a.y, a.w, a.h);

  const layerHasMask = (l) => l.items.some((it) => it.t === 's' && B.catalog[it.b] && B.catalog[it.b].mask);

  /* opts: {m, w, h, doc, bg (null = transparent), grid, sel:Set, selPreview, fade, scratch, onImage, dpr, onlyIds:Set} */
  R.paperIsDark = (doc = D.doc) => !!doc && A.C.luminance(D.isNotebook(doc) ? doc.page.color : doc.paper.bg) < 0.35;
  R.drawScene = (ctx, o) => {

    B.lift = !o.dark && !!o.inkAdapt && R.paperIsDark(doc);

    ctx.clearRect(0, 0, o.w, o.h);

    drawPaper(ctx, o);
    if (o.grid && !nbk) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); R.drawGrid(ctx, o.m, o.w, o.h, o.bg ? Object.assign({}, doc.paper, { bg: o.bg }) : doc.paper, { dpr: o.dpr, axes: false }); ctx.restore(); }
    const vbb = R.worldBB(o.m, o.w, o.h);
    const sel = o.sel && o.sel.size ? o.sel : null;
    const fade = sel && o.fade ? 0.5 : 1;

    if (selected.length) {
      ctx.setTransform(...(o.selPreview ? M.mul(o.m, o.selPreview) : o.m));

        else B.render(ctx, it, 1);
      }
    }
    ctx.restore();
    B.dark = prevDark; B.lift = prevLift;
  };

  let mainQueued = false, overlayQueued = false;
  R.lastMs = 0;
  R.gesturing = false;
  let lastFull = 0;
  R.render = () => {
    if (mainQueued) return;
    mainQueued = true;
    requestAnimationFrame(() => { mainQueued = false; R.renderNow(); });

  R.renderNow = (force = false) => {
    if (!D.doc || !R.main) return;
    if (R.pk) { R.mctx.setTransform(1, 0, 0, 1, 0, 0); R.mctx.clearRect(0, 0, R.main.width, R.main.height); R.renderOverlay(); return; }
    const t0 = performance.now();

    if (!force && !R.replay && R.gesturing && R.lastMs > 14 && R.cacheValid && t0 - lastFull < 220) {

      ctx.setTransform(1, 0, 0, 1, 0, 0);

      m, w: W, h: H, doc: D.doc, bg: R.displayBg(), dark: R.darkActive(), grid: D.doc.precision.grid,

  R.renderOverlayNow = () => { overlayQueued = true; paintOverlay(); };
  const paintOverlay = () => {
      overlayQueued = false;
      const ctx = R.octx;
      ctx.setTransform(1, 0, 0, 1, 0, 0);

      }
      B.dark = prevDark; B.lift = prevLift;

  R.renderOverlay = () => {
    if (overlayQueued) return;
    overlayQueued = true;

      m, w: W, h: H, doc, bg: bg && !D.isNotebook(doc) ? (display ? R.displayBg(doc) : doc.paper.bg) : null, pageBg: bg && D.isNotebook(doc), grid, scratch: sc, sctx: sc.getContext('2d'), dpr: Math.max(1, s), onlyIds, noArtboards: !display, noStrokes, hideId: noStrokes ? R.hideId : null,

  };

    if (D.isNotebook(doc)) { const r0 = D.pageRect(doc, 0); W = 270; H = Math.round((270 * (r0[3] - r0[1])) / (r0[2] - r0[0])); }

    const sc = document.createElement('canvas'); sc.width = W; sc.height = H;
    const bb = D.isNotebook(doc) ? D.pageRect(doc, 0) : D.allBB(doc);
    let m;
    if (D.isNotebook(doc)) {
      const s = W / (bb[2] - bb[0]);
      m = [s, 0, 0, s, W / 2 - ((bb[0] + bb[2]) / 2) * s, -bb[1] * s];

    }

      const pad = 18, bw = Math.max(bb[2] - bb[0], 40), bh = Math.max(bb[3] - bb[1], 30);
      const s = Math.min((W - pad * 2) / bw, (H - pad * 2) / bh, 2);
      const cx = (bb[0] + bb[2]) / 2, cy = (bb[1] + bb[3]) / 2;

  };
})();

/* ---- guides.js ---- */
/* Axiom shape guides (Line, Ellipse, Rectangle, Angle) and measurement formatting */
'use strict';
(() => {
  const D = A.D, R = A.R, G = A.G;
  const GU = (A.GU = {});
  const hyp = Math.hypot;

  /* ---------- units ---------- */
  A.UNITS = { px: 1, pt: 0.75, mm: 25.4 / 96, cm: 2.54 / 96, in: 1 / 96 };
  A.fmtLen = (worldLen, doc = D.doc) => {
    const u = doc.precision.units || 'mm';
    const v = worldLen * (A.UNITS[u] || 1) * (doc.precision.scale || 1);
    const digits = v >= 100 ? 0 : v >= 10 ? 1 : 2;
    return v.toFixed(digits) + ' ' + u;
  };
  A.fmtArea = (worldArea, doc = D.doc) => {
    const u = doc.precision.units || 'mm';
    const k = (A.UNITS[u] || 1) * (doc.precision.scale || 1);
    const v = worldArea * k * k;
    return (v >= 100 ? v.toFixed(0) : v.toFixed(2)) + ' ' + u + '²';
  };

  GU.types = [
    { id: 'line', name: 'Line' },
    { id: 'ellipse', name: 'Ellipse' },
    { id: 'rect', name: 'Rectangle' },
    { id: 'angle', name: 'Angle' },
  ];

  GU.active = () => {
    const doc = D.doc;
    if (!doc || !doc.precision.guide || R.pk) return null; // PencilKit shows Apple's own ruler instead
    const t = doc.precision.guideType;
    if (!doc.guides[t]) doc.guides[t] = GU.make(t);
    return Object.assign({ type: t }, { s: doc.guides[t] });
  };
  GU.make = (t) => {
    const [cx, cy] = R.toWorld(R.w / 2, R.h / 2);
    const z = D.doc.view.zoom, L = Math.min(R.w, R.h) * 0.28 / z;
    switch (t) {
      case 'line': return { p1: [cx - L, cy], p2: [cx + L, cy], limit: false };
      case 'ellipse': return { cx, cy, rx: L * 0.8, ry: L * 0.55, rot: 0 };
      case 'rect': return { cx, cy, w: L * 1.4, h: L * 0.9, rot: 0 };
      case 'angle': return { v: [cx - L * 0.6, cy + L * 0.4], a: [cx + L * 0.8, cy + L * 0.4], b: [cx + L * 0.2, cy - L * 0.6] };
    }
  };
  GU.reset = () => { const d = D.doc; delete d.guides[d.precision.guideType]; R.renderOverlay(); };

  /* ---------- geometry helpers ---------- */
  const rotP = (x, y, a) => { const c = Math.cos(a), s = Math.sin(a); return [x * c - y * s, x * s + y * c]; };
  const center = (g) => {
    const s = g.s;
