name: Axiom
options:
  bundleIdPrefix: com.mohmadkarim
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: 1.7.3
targets:
  Axiom:
    type: application
    platform: iOS
    sources:
      - path: Axiom
      - path: web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mohmadkarim.axiom
        PRODUCT_NAME: Axiom
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Axiom/Info.plist
      properties:
        CFBundleDisplayName: Axiom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        NSMicrophoneUsageDescription: Axiom records lectures in your notebooks so you can replay them alongside your handwriting.
        NSCameraUsageDescription: Axiom can photograph problem sheets and pages to add them to your notes.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSPhotoLibraryAddUsageDescription: Axiom saves exported drawings to your photo library when you ask it to.
  AxiomNative:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AxiomNative
    dependencies:
      - package: SwiftMath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mohmadkarim.axiom
        PRODUCT_NAME: Axiom
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: AxiomNative/Info.plist
      properties:
        CFBundleDisplayName: Axiom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        NSMicrophoneUsageDescription: Axiom records lectures in your notebooks so you can replay them alongside your handwriting.
        NSCameraUsageDescription: Axiom can photograph problem sheets and pages to add them to your notes.
        NSPhotoLibraryAddUsageDescription: Axiom saves exported pages to your photo library when you ask it to.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

